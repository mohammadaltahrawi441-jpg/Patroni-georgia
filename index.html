const MAP_BOX={lng0:39.8, lng1:46.9, lat0:43.8, lat1:40.9};
const mapX=(lng,w)=>(lng-MAP_BOX.lng0)/(MAP_BOX.lng1-MAP_BOX.lng0)*w;
const mapY=(lat,h)=>(MAP_BOX.lat0-lat)/(MAP_BOX.lat0-MAP_BOX.lat1)*h;
const gmapsUrl=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

function openMap(q){

/* ================= BLOG =================

   Posts live in blog-data.js and are pre-rendered as real pages for search.
   The daily scheduled task publishes through /api/blog; those arrive at
   runtime in LIVE_BLOG and are merged in, newest first.

   Sharing is honest about what each platform allows. Facebook, X, Pinterest,
   Threads and WhatsApp accept a share URL. Instagram, TikTok and YouTube do
   not — there is no way to open their composer with text filled in — so for
   those the button copies the caption and hashtags and says so. */

let LIVE_BLOG = [];

function allPosts(){
  const live = LIVE_BLOG.map(p => Object.assign({}, p, { live: true }));
  const slugs = new Set(live.map(p => p.slug));
  return live.concat(BLOG.filter(p => !slugs.has(p.slug)))
             .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function postBySlug(s){ return allPosts().find(p => p.slug === s) || null; }

function postUrl(p){
  const base = (location.origin && location.origin.indexOf("http") === 0)
             ? location.origin : "https://patronigeorgia.com";
  return base + "/blog/" + p.slug + "/";
}
function postHash(p){ return "#/blog/" + p.slug; }

function blogDate(d){
  try{
    return new Date(d + "T00:00:00Z").toLocaleDateString(
      isAr() ? "ar" : (lang === "ka" ? "ka" : lang === "tr" ? "tr" : "en"),
      { year:"numeric", month:"long", day:"numeric", timeZone:"UTC" });
  }catch(e){ return d; }
}

async function doShare(kind, slug){
  const p = postBySlug(slug); if(!p) return;
  const url = postUrl(p), txt = shareText(p);
  const msg = (s) => { const el = $("#shMsg"); if(el){ el.textContent = s; el.hidden = false; } };

  if(SHARE_COPY.indexOf(kind) > -1){
    const okCopy = await copyText(txt + "\n" + url);
    msg(okCopy ? t("blCopied").replace("{p}", SHARE_NAME[kind]) : t("blCopyFail"));
    if(!okCopy) showWaModal(txt + "\n" + url, t("blCopyFail"));
    return;
  }
  const img = p.hero && IMG[p.hero] ? url : "";
  const link = SHARE_LINK[kind](url, txt, img);
  try{ window.open(link, "_blank", "noopener"); }
  catch(e){ location.href = link; }
}

async function copyText(s){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(s); return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const okExec = document.execCommand("copy");
    document.body.removeChild(ta);
    return okExec;
  }catch(e){ return false; }
}

async function blogFetch(){
  try{
    const res = await fetch("/api/blog", { cache: "no-store" });
    if(!res.ok) return false;
    const d = await res.json();
    if(!d || !d.ok || !Array.isArray(d.items)) return false;

  }catch(e){ return false; }
}

/* seed the board from everything already on the site, so it never looks empty */
function buildAds(){
  const out=[];
  P.forEach((p,i)=>{
    /* the card headlines a price per square metre, but the board sorts and
       filters on totals — so an ad carries the developer's own from-price and
       never the per-m² figure, which would sort a whole project under a studio */
    const total = (typeof p.from === "number" && p.from >= 20000 && !p.sold) ? p.from : null;
    out.push({id:"pr-"+p.key, cat:"property", sub:["New development","مشروع جديد","ახალი პროექტი"],
      title:p.name, city:p.city, price:total, priceTxt:total?["from "+money(total),"من "+money(total),"დან "+money(total),money(total)+" ‘den"]:p.ppm,
      img:p.hero||null, art:p.art, loc:p.loc,
      specs:p.facts.map(f=>[f[0],f[1]]),
      desc:p.lede, seller:{n:p.dev, ph:WHATSAPP_NUMBER, kind:["Developer","مطوّر","დეველოპერი"]},
      day:3+i, go:p.key});
  });
  /* The three sample OVAL units were removed on 11 Sep 2026. Everything in the
     "property" category now comes either from a development above or from a
     real seller, live or local — nothing on this board is a placeholder. */
  CITIES.forEach((c,i)=>{
    out.push({id:"tr-"+c.k, cat:"tour", sub:["Private tour","جولة خاصة","კერძო ტური"],
      title:[c.en+" — private day tour", "جولة يوم خاصة — "+c.ar], city:[c.en,c.ar],
      price:null, priceTxt:["Ask for a price","اسأل عن السعر","ფასის მოთხოვნა"],
      img:CITY_HERO[c.k], art:c.art, loc:[c.en+", Georgia", c.ar+"، جورجيا"],
      specs:[[["Places","الأماكن","ადგილები"],String(c.a.length)],[["Duration","المدة","ხანგრძლივობა"],"1 day"],
             [["Language","اللغة","ენა"],"AR / EN"],[["Group","المجموعة","ჯგუფი"],"1–7"]],
      desc:[c.bEn,c.bAr], seller:{n:MK_SELF, ph:WHATSAPP_NUMBER, kind:["Operator","مشغّل","ოპერატორი"]},
      day:2+i, city_k:c.k});
  });
  return out;
}

function allAds(){
  if(!ADS) ADS=buildAds();
  /* approved listings from the API come first; a seller\'s own pending copy is
     dropped once the same listing is live, so it is never shown twice */
  const live = (typeof liveAds === "function") ? liveAds() : [];

let mk={cat:"property", q:"", city:"all", lo:"", hi:"", sort:"new", view:"list"};

function mkCities(){
  const s=new Set(); allAds().filter(a=>a.cat===mk.cat).forEach(a=>s.add(L(a.city))); return [...s].sort();

function mkFiltered(){
  return allAds().filter(a=>{
    if(a.cat!==mk.cat) return false;
    if(mk.city!=="all" && L(a.city)!==mk.city) return false;
    if(mk.lo && (a.price===null || a.price < +mk.lo)) return false;
    if(mk.hi && (a.price===null || a.price > +mk.hi)) return false;
    if(mk.q){ const q=mk.q.toLowerCase();
      if(!((L(a.title)+" "+L(a.city)+" "+L(a.desc)).toLowerCase().includes(q))) return false; }
    return true;
  }).sort((x,y)=>{
    if(mk.sort==="lo") return (x.price??9e9)-(y.price??9e9);
    if(mk.sort==="hi") return (y.price??-1)-(x.price??-1);
    return (x.day||0)-(y.day||0);
  });
}

    const d={ttl:g("pfTitle"), cty:g("pfCity"), nm:g("pfName"), ph:g("pfPhone"),
      cat:g("pfCat"), pr:g("pfPrice"), ar:g("pfArea"), rm:g("pfRooms"), ds:g("pfDesc"),
      who:whoVal(), whoTxt:whoLabel()};
    d.bad = d.ttl.length<4 || d.cty.length<2 || d.nm.length<2
         || d.ph.replace(/\D/g,"").length<7

  function pfText(d){
    return `${t("mkNewAd")}\n\n${t("pfWhoH")}: ${d.whoTxt}\n${t("mkTitle")}: ${d.ttl}`
      + `\n${t("mkCat")}: ${d.cat}\n${t("mkCity")}: ${d.cty}`
      + (d.pr?`\n${t("mkPriceUsd")}: ${d.pr}`:"") + (d.ar?`\n${t("mkArea")}: ${d.ar}`:"")
      + (d.rm?`\n${t("mkRooms")}: ${d.rm}`:"")
      + `\n${t("pfPhotoH")}: ${pfPhotos.length}`
      + `\n${t("mkYou")}: ${d.nm}\n${t("magNum")}: ${d.ph}`
      + (d.ds?`\n\n${d.ds}`:"") + `\n\n${t("mkApproveAsk")}`;

  /* the short message: a link, not a wall of text */
  function pfLinkText(d, review){
    return `${t("mkNewAd")}\n${d.ttl} — ${d.cty}\n${d.whoTxt}`
         + `\n${t("pfPhotoH")}: ${pfPhotos.length}${pfVideo?" + 1 video":""}`
         + `\n\n${t("mkApproveLink")}\n${review}`;
  }

  function pfSaveLocal(d, price, sub){
    saveMine({id:"my-"+Date.now(), cat:d.cat, mine:true, sub,
      title:[d.ttl,d.ttl], city:[d.cty,d.cty], loc:[d.cty,d.cty], price,
      priceTxt: price?[money(price),money(price)]:["Ask for a price","اسأل عن السعر","ფასის მოთხოვნა"],
      img:null, photos:pfPhotos.slice(), video:null, art: d.cat==="tour"?"city":"tower",
      specs:[[["Area","المساحة","ფართობი"],d.ar||"—"],[["Rooms","الغرف","ოთახები"],d.rm||"—"],
             [["Posted by","نشرها","განცხადების ავტორი"],d.nm],[["Role","الصفة","როლი"],d.whoTxt]],
      desc:[d.ds||"—",d.ds||"—"],
      seller:{n:[d.nm,d.nm], ph:d.ph, kind:[d.whoTxt,d.whoTxt]}, day:0});
  }

  async function pfSubmit(send){
    const d=pfCollect();
    if(d.bad){ $("#pfErr").hidden=false; return; }
    $("#pfErr").hidden=true;
    const price = d.pr? +d.pr : null;
    const btns=[$("#pfSend"),$("#pfSendTg"),$("#pfSendMail")].filter(Boolean);
    const say=(k,err)=>pfMsg(k,err);

    /* API path: upload once, then send a link */
    if(API_ON !== false){
      btns.forEach(b=>b.disabled=true);
      say("pfSending");
      try{
        const res = await liveSubmit({
          title:d.ttl, cat:d.cat, city:d.cty, price:d.pr, area:d.ar, rooms:d.rm,
          desc:d.ds, who:d.who, whoTxt:d.whoTxt, name:d.nm, phone:d.ph, lang:lang });
        if(res.ok){
          /* the token is the only proof this listing is theirs */
          if(typeof saveKey === "function" && res.id && res.token)
            saveKey({ id:res.id, token:res.token, title:d.ttl, at:Date.now() });
          pfSaveLocal(d, price, ["Waiting for approval","بانتظار الموافقة","ელოდება დამტკიცებას","Onay bekliyor"]);
          say("pfSent");
          send(pfLinkText(d, res.review));
          pfClearMedia();
          btns.forEach(b=>b.disabled=false);
          render();
          return;
        }
        say(t("pfSendFail") + " (" + res.error + ")", true);
      }catch(e){ say(t("pfSendFail"), true); }
      btns.forEach(b=>b.disabled=false);
      /* fall through to the message-only path so nothing is lost */
    }

    saveMine({id:"my-"+Date.now(), cat:d.cat, mine:true,
      sub:["Waiting for approval","بانتظار الموافقة","ელოდება დამტკიცებას","Onay bekliyor"],
      title:[d.ttl,d.ttl], city:[d.cty,d.cty], loc:[d.cty,d.cty], price,
      priceTxt: price?[money(price),money(price)]:["Ask for a price","اسأل عن السعر","ფასის მოთხოვნა"],
      img:null, photos:pfPhotos.slice(), art: d.cat==="tour"?"city":"tower",
      specs:[[["Area","المساحة","ფართობი"],d.ar||"—"],[["Rooms","الغرف","ოთახები"],d.rm||"—"],
             [["Posted by","نشرها","განცხადების ავტორი"],d.nm],[["Role","الصفة","როლი"],d.whoTxt]],
      desc:[d.ds||"—",d.ds||"—"],
      seller:{n:[d.nm,d.nm], ph:d.ph, kind:[d.whoTxt,d.whoTxt]}, day:0});
    send(pfText(d));
    pfClearMedia();
    render();
  }
  if($("#pfSend")) $("#pfSend").onclick=()=>pfSubmit(waOpen);
  if($("#pfSendTg")) $("#pfSendTg").onclick=()=>pfSubmit(tgOpen);
  if($("#pfSendMail")) $("#pfSendMail").onclick=()=>pfSubmit(txt=>{
    location.href = "mailto:" + APPROVAL_EMAIL
      + "?subject=" + encodeURIComponent(t("mkNewAd"))
      + "&body=" + encodeURIComponent(txt);
  });
}

/* ================= THE PROPERTIES BOARD =================

   Everything on this page is posted by a real seller. It adapts to whatever
   exists: zero listings, one, or two hundred. There is no seeded content and
   no placeholder — an empty board says so honestly and offers the form.

   Ownership is by token, kept on the seller's own device (see live.js). A
   seller sees Edit / Share / Remove on their own listings and nobody else's. */

function userListings(){
  const live = (typeof liveAds === "function") ? liveAds() : [];
  const liveTitles = new Set(live.map(a => L(a.title)));
  const mine = myAds().filter(a => !liveTitles.has(L(a.title)));
  return live.concat(mine).filter(a => a.cat === "property");
}

/* the same filters the marketplace uses, applied to the seller board */
function plFiltered(){
  const q = (query || "").trim().toLowerCase();
  return userListings().filter(a => {
    if(filter === "residency" && !(a.price >= 150000)) return false;
    if(band === "lo"  && !(a.price  <  100000)) return false;
    if(band === "mid" && !(a.price >= 100000 && a.price <= 150000)) return false;
    if(band === "hi"  && !(a.price >= 150000)) return false;
    if(q && (L(a.title) + " " + L(a.city) + " " + L(a.desc)).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort((x, y) => (x.day || 0) - (y.day || 0));
}

function plShareUrl(a){
  const base = (location.origin && location.origin.indexOf("http") === 0)
             ? location.origin : "https://patronigeorgia.com";
  return base + "/#/ad/" + a.id;
}

/* one card, plus the manage bar when the listing belongs to this device */
function plCard(a){
  const own = (typeof mineAd === "function") && mineAd(a);
  const bar = own ? `<div class="plbar">
      <button class="plb" data-pledit="${esc(a.id)}">${t("plEdit")}</button>
      <button class="plb" data-plshare="${esc(a.id)}">${t("plShare")}</button>
      <button class="plb del" data-plremove="${esc(a.id)}">${t("plRemove")}</button>
    </div>` : `<div class="plbar">
      <button class="plb" data-plshare="${esc(a.id)}">${t("plShare")}</button>
    </div>`;
  const flag = own ? `<span class="plmine">${t("plMine")}</span>` : "";
  return `<div class="plwrap">${adCard(a)}${flag}${bar}</div>`;
}

function plBoardHTML(){
  const all = userListings(), list = plFiltered();
  if(!all.length){
    return `<div class="soonbox">
        <h3>${t("plEmptyH")}</h3>
        <p>${t("plEmptyP")}</p>
        <div class="cta2">
          <button class="btn-gold btn-postad" data-nav="post">＋ ${t("mkPost")}</button>
          <button class="btn-line" data-nav="market">${t("sellB2")}</button>
        </div>
      </div>`;
  }
  const head = `<div class="plhead"><span class="plcount"><b>${list.length}</b> ${t("plCount")}</span>
      <button class="btn-gold sm btn-postad" data-nav="post">＋ ${t("mkPost")}</button></div>`;
  if(!list.length)
    return head + `<div class="soonbox sm"><h3>${t("catSoonH")}</h3><p>${t("catSoonP")}</p></div>`;
  return head + `<div class="adgrid">${list.map(plCard).join("")}</div>`;
}

/* ---------- manage actions ---------- */

function plFind(id){ return userListings().find(a => a.id === id) || null; }

function plShare(id){
  const a = plFind(id); if(!a) return;
  const url = plShareUrl(a);
  const text = L(a.title) + " — " + L(a.priceTxt) + "\n" + url;
  if(navigator.share){
    navigator.share({ title: L(a.title), text: L(a.title), url }).catch(() => {});
    return;
  }
  showWaModal(text, t("plShared"));
}

async function plRemove(id){
  const a = plFind(id); if(!a) return;
  const k = keyFor(id);
  if(!k){ pfMsg(t("plNotYours"), true); return; }
  /* a listing that never reached the API only exists in this browser */
  if(String(id).indexOf("lv-") !== 0){
    try{
      const m = myAds().filter(x => x.id !== id);
      localStorage.setItem("mk_mine", JSON.stringify(m));
    }catch(e){}
    forgetKey(k.id);
    render();
    return;
  }
  const res = await liveRemove(k.id, k.token);
  if(!res.ok){ pfMsg(t("plRemoveFail") + " (" + res.error + ")", true); return; }
  try{
    const m = myAds().filter(x => L(x.title) !== L(a.title));
    localStorage.setItem("mk_mine", JSON.stringify(m));
  }catch(e){}
  await livePoll(true);
  render();
}

/* Edit reuses the posting form: it is the same set of fields, so there is one
   form to maintain and the seller sees exactly what they filled in before. */
let plEditing = null;

function plEdit(id){
  const a = plFind(id); if(!a) return;
  const k = keyFor(id);
  if(!k){ pfMsg(t("plNotYours"), true); return; }
  const spec = n => { const s = (a.specs || []).find(x => L(x[0]) === n); return s ? s[1] : ""; };
  plEditing = {
    id: k.id, token: k.token,
    title: L(a.title), city: L(a.city),
    price: a.price ? String(a.price) : "",
    area: String(spec("Area") || "").replace(" m²", "").replace("—", ""),
    rooms: String(spec("Rooms") || "").replace("—", ""),
    desc: L(a.desc) === "—" ? "" : L(a.desc),
    name: a.seller ? L(a.seller.n) : "",
    phone: a.seller ? a.seller.ph : ""
  };
  nav("post");
}

async function plSaveEdit(){
  if(!plEditing) return;
  const d = pfCollect();
  if(d.bad){ $("#pfErr").hidden = false; return; }
  $("#pfErr").hidden = true;
  pfMsg("pfSending");
  const res = await liveUpdate(plEditing.id, plEditing.token, {
    title:d.ttl, city:d.cty, price:d.pr, area:d.ar, rooms:d.rm,
    desc:d.ds, who:d.who, whoTxt:d.whoTxt, name:d.nm, phone:d.ph });
  if(!res.ok){ pfMsg(t("plSaveFail") + " (" + res.error + ")", true); return; }
  plEditing = null;
  await livePoll(true);
  nav("properties");
}

function wireProperties(){
  $$("[data-plshare]").forEach(b => b.onclick = e => { e.stopPropagation(); plShare(b.dataset.plshare); });
  $$("[data-plremove]").forEach(b => b.onclick = e => { e.stopPropagation(); plRemove(b.dataset.plremove); });
  $$("[data-pledit]").forEach(b => b.onclick = e => { e.stopPropagation(); plEdit(b.dataset.pledit); });
}

/* written with \u escapes so the class can never depend on how the file is decoded */
const AI_NORM = s => String(s||"").toLowerCase()
  .replace(/[\u064B-\u0652\u0640]/g,"")                       /* Arabic marks and tatweel */
  .replace(/[\u0623\u0625\u0622\u0627]/g,"\u0627")             /* alef forms */
  .replace(/[\u0649\u064A]/g,"\u064A").replace(/\u0629/g,"\u0647")
  .replace(/[^\p{L}\p{N}]+/gu," ").trim();

/* returns the best matching topic, or null */
function aiMatch(q){
  const n = " " + AI_NORM(q) + " ";
  let best = null, bestScore = 0;
  AI_TOPICS().forEach(topic => {
    let score = 0;
    topic.k.forEach(w => {
      const nw = AI_NORM(w);
      if(!nw) return;
      if(n.indexOf(" " + nw + " ") > -1) score += nw.length + 4;      /* whole word */
      else if(nw.length > 3 && n.indexOf(nw) > -1) score += nw.length; /* inside a word */
    });
    score *= (topic.w || 1);
    if(score > bestScore){ bestScore = score; best = topic; }
  });
  return bestScore >= 6 ? best : null;
}

/* a named project always wins over a general topic */
function aiProject(q){
  const n = AI_NORM(q);
  let hit = null, len = 0;
  P.forEach(p => {
    [p.name[0], p.name[1], p.key].forEach(nm => {
      const w = AI_NORM(nm).replace(/^next /,"");
      if(w.length > 3 && n.indexOf(w) > -1 && w.length > len){ hit = p; len = w.length; }
    });
  });
  return hit;
}

function aiProjectAnswer(p){
  const facts = (p.facts||[]).map(f => L(f[0]) + " " + f[1]).join(" · ");
  return t("aiA_project")
    .replace("{name}", L(p.name)).replace("{city}", L(p.loc))
    .replace("{pm}", L(p.pm)).replace("{sizes}", L(p.sizes))
    .replace("{facts}", facts);
}

/* "how much is unit 4207" — the site has no per-unit list and must not pretend */
const AI_UNIT = /(?:unit|apartment|flat|apt|no\.?|#|\u0648\u062d\u062f\u0629|\u0634\u0642\u0629|daire)\s*#?\s*\d{3,5}\b/i;

function localAnswer(q){
  if(AI_UNIT.test(q)) return t("aiA_unit");
  const p = aiProject(q);
  if(p) return aiProjectAnswer(p);
  const topic = aiMatch(q);
  if(topic) return typeof topic.a === "function" ? topic.a(q) : topic.a;
  return t("aiA_none");
}

async function aiSend(text){
  text = (text || "").trim();
  if(!text || aiBusy) return;

  aiTurns.push({role:"user", content:text});
  const input = $("#aiIn"); if(input) input.value = "";
  aiPaint();

  if(AI === undefined){
    AI = (typeof claude !== "undefined" && claude && claude.use)
       ? await claude.use("sample").catch(() => null) : null;
  }
  /* no model here — answer from the site itself */
  if(!AI){ aiReplyLocal(text); return; }

  const box = $("#aiBody");
  const think = document.createElement("div");
  think.className = "aim assistant"; think.id = "aiThink";
  think.innerHTML = `<span class="aiav">M</span><div class="aitx thinking">${t("aiThinking")}</div>`;
  box.appendChild(think); box.scrollTop = box.scrollHeight;

  aiBusy = true;
  aiStop = new AbortController();
  $("#aiSend").hidden = true; $("#aiStop").hidden = false;

  /* the brief travels as the first user turn; only the last few turns follow it */
  const turns = [{role:"user", content: siteBrief() + "\n\nFirst question: " + aiTurns[0].content}]
    .concat(aiTurns.slice(1).slice(-6));

  try{
    const res = await AI(turns, {
      modelTier: "quick",
      signal: aiStop.signal,
      onText: ({text}) => {
        const th = $("#aiThink");
        if(th){ th.querySelector(".aitx").classList.remove("thinking"); }
        if(th) th.querySelector(".aitx").innerHTML = esc(text).replace(/\n/g,"<br>");
        box.scrollTop = box.scrollHeight;
      }
    });
    aiTurns.push({role:"assistant", content: res.text});
    aiPaint();
  }catch(e){
    const th = $("#aiThink"); if(th) th.remove();
    if(e && e.text){ aiTurns.push({role:"assistant", content:e.text}); aiPaint(); }
    else if(e && e.code === "cancelled"){ aiPaint(); }
    else { aiReplyLocal(text); }          /* the model failed — the site still answers */
  }finally{
    aiBusy = false; aiStop = null;
    const s = $("#aiSend"), p = $("#aiStop");
    if(s) s.hidden = false; if(p) p.hidden = true;
  }
}

const PF_CITY_WORDS = [
  ["Batumi","باتومي","ბათუმი","Batum"],["Gonio","غونيو","გონიო","Gonio"],
  ["Tbilisi","تبليسي","თბილისი","Tiflis"],["Kobuleti","كوبوليتي","ქობულეთი","Kobuleti"],
  ["Kutaisi","كوتايسي","ქუთაისი","Kutaisi"],["Kakheti","كاخيتي","კახეთი","Kaheti"],
  ["Kazbegi","كازبيغي","ყაზბეგი","Kazbegi"],["Borjomi","بورجومي","ბორჯომი","Borjomi"],
  ["Svaneti","سفانيتي","სვანეთი","Svaneti"],["Mtskheta","متسخيتا","მცხეთა","Mtsheta"],
  ["Chakvi","تشاكفي","ჩაქვი","Çakvi"],["Makhinjauri","ماخينجاوري","მახინჯაური","Mahincauri"]
];

function pfParse(src){
  const text = String(src||"");
  const flat = text.replace(/ /g," ");
  const low  = flat.toLowerCase();
  const out  = {};

  /* --- price --- */
  const nums = [];
  flat.replace(/(\$\s*)?(\d{1,3}(?:[ ,.٬]\d{3})+|\d{4,9})(\s*(usd|\$|dollar|دولار|\$|tl|lari|₾))?/gi,
    (m, pre, body, _s, cur, idx) => {
      const v = +body.replace(/[^\d]/g,"");
      if(v >= 3000 && v <= 90000000)
        nums.push({v, cur: !!(pre||cur), at: idx});
      return m;
    });
  const priceWord = /price|cost|asking|سعر|السعر|ثمن|fiyat|ფასი/i;
  let priced = nums.filter(n => n.cur);
  if(!priced.length){
    priced = nums.filter(n => priceWord.test(flat.slice(Math.max(0, n.at-40), n.at+10)));
  }
  if(!priced.length) priced = nums.filter(n => n.v >= 15000);
  if(priced.length) out.price = String(priced.sort((a,b)=>b.v-a.v)[0].v);

  /* --- area --- */
  const area = flat.match(/(\d{2,4}(?:[.,]\d{1,2})?)\s*(?:m²|m2|sq\.?\s?m|sqm|متر|م٢|م2|metrekare|კვ\.?\s?მ)/i)
            || flat.match(/(?:area|المساحة|مساحة|alan|ფართი)\D{0,12}(\d{2,4}(?:[.,]\d{1,2})?)/i);
  if(area) out.area = area[1].replace(",",".");

  /* --- rooms --- */
  let rooms = flat.match(/(\d)\s*\+\s*1/);                                  /* Turkish 2+1 */
  if(rooms) out.rooms = String(+rooms[1] + 1);
  else{
    rooms = flat.match(/(\d)\s*(?:bed\s?rooms?|bedrooms?|rooms?|br\b|غرف|غرفة|oda|ოთახ)/i)
         || flat.match(/(?:rooms?|bedrooms?|غرف|oda sayısı|ოთახები)\D{0,8}(\d)/i);
    if(rooms) out.rooms = rooms[1];
  }

  /* --- city --- */
  for(const row of PF_CITY_WORDS){
    if(row.some(w => low.indexOf(w.toLowerCase()) > -1)){ out.city = L(row); break; }
  }

  /* --- category --- */
  out.cat = /(\btour\b|tours|itinerary|جولة|جوله|رحلة|tur\b|gezi|ტური)/i.test(flat) ? "tour" : "property";

  /* --- title and description --- */
  const lines = flat.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>2);
  let title = lines.length ? lines[0] : "";
  if(title.length > 60){
    const cut = title.slice(0,60);
    title = cut.slice(0, Math.max(cut.lastIndexOf(" "), 30)).trim();
  }
  if(title.length < 6){
    title = [out.rooms ? out.rooms + " " + t("mkRooms") : "", out.city || ""].filter(Boolean).join(" · ");
  }
  out.title = title;
  const body = lines.slice(title === (lines[0]||"") ? 1 : 0).join(" ").replace(/\s{2,}/g," ").trim();
  out.desc = (body || flat.trim()).slice(0, 600);
  return out;
}

/* ---------- photos and one video ----------
   Photos are resized in the browser before they go anywhere: a modern phone
   camera produces 4-8 MB per shot and twenty of those would be a 100 MB
   upload over a Batumi mobile connection. The video is left exactly as it is
   — re-encoding it here is not possible — so it is size-checked instead. */

const PF_MAX_PHOTOS = 20;
const PF_MAX_VIDEO  = 60 * 1024 * 1024;      /* 60 MB */
const PF_PHOTO_W    = 1600;

let pfPhotos = [];        /* data URLs, in display order; the first is the cover */
let pfVideo  = null;      /* one File, untouched */

/* the notice survives a re-render: the fallback path repaints the page right
   after it explains itself, and the seller was never seeing the explanation */
let pfNotice = null;
function pfMsg(key, isErr){
  const text = typeof key === "string" && T[key] ? t(key) : key;
  pfNotice = { text, err: !!isErr };
  pfShowNotice();
}
function pfShowNotice(){
  const el = $("#pfMediaMsg"); if(!el) return;
  if(!pfNotice){ el.hidden = true; return; }
  el.textContent = pfNotice.text;
  el.hidden = false;
  el.classList.toggle("err", pfNotice.err);
}

function pfAddPhotos(files){
  const room = PF_MAX_PHOTOS - pfPhotos.length;
  const list = [...files].filter(f => /^image\//.test(f.type));
  if(!list.length) return;
  if(room <= 0){ pfMsg("pfFullPhotos", true); return; }
  const take = list.slice(0, room);
  if(list.length > room) pfMsg("pfFullPhotos", true);

  take.forEach(f => {
    if(!(f instanceof Blob)){ pfMsg("pfBadPhoto", true); return; }
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const w = Math.min(PF_PHOTO_W, im.width), h = Math.round(im.height * w / im.width);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        pfPhotos.push(c.toDataURL("image/jpeg", 0.74));
        pfPaintPhotos();
      };
      im.onerror = () => pfMsg("pfBadPhoto", true);
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

function pfSetVideo(file){
  if(!file) return;
  if(!/^video\//.test(file.type)){ pfMsg("pfNotVideo", true); return; }
  if(file.size > PF_MAX_VIDEO){
    pfMsg(t("pfVideoBig").replace("{mb}", Math.round(file.size / 1048576)), true);
    return;
  }
  pfVideo = file;
  pfPaintPhotos();
  pfMsg("pfVideoOk");
}

function pfPaintPhotos(){
  const w = $("#pfThumbs");
  if(w){
    w.innerHTML = pfPhotos.map((d,i) =>
      `<div class="pfth"${i===0?' data-cover="1"':''}>
         <img src="${d}" alt="">
         ${i===0?`<span class="pfcover">${esc(t("pfCover"))}</span>`:""}
         <div class="pfacts">
           ${i>0?`<button data-pfup="${i}" aria-label="Move up">↑</button>`:""}
           <button data-pfdel="${i}" aria-label="Remove">×</button>
         </div>
       </div>`).join("");
    w.querySelectorAll("[data-pfdel]").forEach(b =>
      b.onclick = () => { pfPhotos.splice(+b.dataset.pfdel, 1); pfPaintPhotos(); });
    w.querySelectorAll("[data-pfup]").forEach(b =>
      b.onclick = () => { const i = +b.dataset.pfup;
        pfPhotos.splice(i-1, 0, pfPhotos.splice(i,1)[0]); pfPaintPhotos(); });
  }
  const c = $("#pfCount"); if(c) c.textContent = pfPhotos.length + "/" + PF_MAX_PHOTOS;
  const v = $("#pfVideoName");
  if(v){
    const mb = pfVideo ? pfVideo.size/1048576 : 0;
    v.textContent = pfVideo ? (pfVideo.name + " · " + (mb < 1 ? "<1" : Math.round(mb)) + " MB") : "";
    v.hidden = !pfVideo;
  }
  const vd = $("#pfVideoDrop"); if(vd) vd.hidden = !!pfVideo;
  const vr = $("#pfVideoRm"); if(vr) vr.hidden = !pfVideo;
}

function pfClearMedia(){ pfPhotos = []; pfVideo = null; pfPaintPhotos(); }

function wirePostAI(){
  if($("#pfAiGo")) $("#pfAiGo").onclick = aiFillListing;
  if($("#pfFiles")) $("#pfFiles").onchange = e => { pfAddPhotos(e.target.files); e.target.value = ""; };
  if($("#pfVideoFile")) $("#pfVideoFile").onchange = e => { pfSetVideo(e.target.files[0]); e.target.value = ""; };
  if($("#pfVideoRm")) $("#pfVideoRm").onclick = () => { pfVideo = null; pfPaintPhotos(); };
  if($("#pfThumbs")) pfPaintPhotos();
  pfShowNotice();
}

/* ================= LIVE LISTINGS =================
   Talks to the Cloudflare Functions API in /functions.

   If the API answers, approved listings from every device show up on the
   board and the page keeps itself fresh. If it does not answer — the bindings
   are not set up yet, or the site is opened from a file — API_ON goes false
   and everything falls back to the WhatsApp flow that worked before. The site
   never waits on the network to render. */

let API_ON = null;            // null = not asked yet, true/false = known
let LIVE = { v: 0, items: [] };
let livePollTimer = null;

const LIVE_POLL_MS = 30000;   // and immediately whenever the tab comes back

async function liveFetch(force){
  try{
    const q = (!force && LIVE.v) ? "?v=" + encodeURIComponent(LIVE.v) : "";
    const res = await fetch("/api/feed" + q, { cache: "no-store" });
    if(!res.ok){ API_ON = false; return false; }
    const d = await res.json();
    if(!d || !d.ok){ API_ON = false; return false; }
    API_ON = true;
    if(d.same) return false;                       /* nothing new */
    LIVE.v = d.v || 0;
    LIVE.items = Array.isArray(d.items) ? d.items : [];
    return true;
  }catch(e){ API_ON = false; return false; }
}

const LIVE_ROLE = {
  owner:     ["Owner","المالك","მესაკუთრე","Mal sahibi"],
  developer: ["Developer","مطوّر","დეველოპერი","Geliştirici"],
  agency:    ["Real-estate agency","وكالة عقارية","სააგენტო","Emlak ofisi"],
  other:     ["Private seller","بائع خاص","კერძო გამყიდველი","Özel satıcı"]
};
function liveRole(r){
  if(r.who === "other" && r.whoTxt) return [r.whoTxt, r.whoTxt];
  return LIVE_ROLE[r.who] || LIVE_ROLE.owner;
}

/* one feed record -> the ad shape the board already knows how to draw */
function liveAds(){
  return LIVE.items.map(r => {
    const photos = (r.media||[]).filter(m => m.kind === "photo").map(m => m.url);
    const video  = (r.media||[]).find(m => m.kind === "video");
    const role   = liveRole(r);
    return {
      id: "lv-" + r.id, cat: r.cat === "tour" ? "tour" : "property", live: true,
      sub: role,
      title: [r.title, r.title], city: [r.city, r.city], loc: [r.city, r.city],
      price: r.price, priceTxt: r.price ? [money(r.price), money(r.price)]
                                        : ["Ask for a price","اسأل عن السعر","ფასი შეთანხმებით","Fiyat sorunuz"],
      img: null, photos, video: video ? video.url : null,
      art: r.cat === "tour" ? "city" : "tower",
      specs: [[["Area","المساحة","ფართი","Alan"], r.area ? r.area + " m²" : "—"],
              [["Rooms","الغرف","ოთახები","Oda"], r.rooms || "—"],
              [["Posted by","نشرها","გამომქვეყნებელი","Ekleyen"], r.name],
              [["Role","الصفة","როლი","Sıfat"], L(role)]],
      desc: [r.desc || "—", r.desc || "—"],
      /* The feed no longer carries the seller's number — it says only that
         there is one. auth.js asks for it, once, for someone signed in. */
      hasPhone: !!r.hasPhone,
      seller: { n: [r.name, r.name], ph: r.phone || "", kind: role },
      day: -(r.liveAt || r.at || 0)          /* newest first: the board sorts day ascending */
    };
  });
}

/* re-render only where a new listing would actually be visible, and never
   while someone is typing into a filter or the posting form */
function liveRepaint(){
  const busy = document.activeElement &&
               /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(busy) return;
  if(route === "market" || route === "home") render();
}

async function livePoll(force){
  const changed = await liveFetch(force);
  if(changed) liveRepaint();
}

function liveStart(){
  if(livePollTimer) return;
  livePoll(true);
  livePollTimer = setInterval(() => { if(!document.hidden) livePoll(); }, LIVE_POLL_MS);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) livePoll(); });
  window.addEventListener("online", () => livePoll(true));
}

/* ---------- sending a listing through the API ---------- */

async function dataUrlToBlob(u){
  const r = await fetch(u);
  return await r.blob();
}

/* returns {ok, review} or {ok:false, error} — the caller decides what to say */
async function liveSubmit(fields){
  const fd = new FormData();
  fd.append("listing", JSON.stringify(fields));
  for(let i = 0; i < pfPhotos.length; i++){
    try{
      const b = await dataUrlToBlob(pfPhotos[i]);
      fd.append("photo" + i, b, "p" + i + ".jpg");
    }catch(e){ /* skip a photo that will not convert rather than lose the listing */ }
  }
  if(pfVideo) fd.append("video", pfVideo, pfVideo.name || "video.mp4");

  const res = await fetch("/api/submit", { method: "POST", body: fd });
  let d = null;
  try{ d = await res.json(); }catch(e){}
  if(!res.ok || !d || !d.ok) return { ok:false, error: (d && d.error) || ("http-" + res.status) };
  return d;
}

/* ---------- the seller's own listings ----------

   When a listing is accepted the API hands back {id, token}. That token is the
   only thing that proves the listing is yours, so it is kept on this device and
   nowhere else — it is what lets the seller edit or withdraw their own listing
   later without an account, a password or a login.

   Clearing browser data loses it. That is the honest trade for having no
   accounts: the listing stays up, and the seller messages us to change it. */

const MY_KEYS = "mk_keys";

function myKeys(){
  try{ const v = JSON.parse(localStorage.getItem(MY_KEYS) || "[]");
       return Array.isArray(v) ? v : []; }catch(e){ return []; }
}
function saveKey(k){
  try{
    const all = myKeys().filter(x => x.id !== k.id);
    all.unshift(k);
    localStorage.setItem(MY_KEYS, JSON.stringify(all.slice(0, 50)));
  }catch(e){}
}
function forgetKey(id){
  try{ localStorage.setItem(MY_KEYS, JSON.stringify(myKeys().filter(x => x.id !== id))); }catch(e){}
}
function keyFor(id){
  const bare = String(id || "").replace(/^lv-/, "");
  return myKeys().find(k => k.id === bare) || null;
}
/* is this ad one I posted from this device? */
function mineAd(ad){ return !!(ad && keyFor(ad.id)); }

async function liveUpdate(id, token, fields){
  try{
    const res = await fetch("/api/update", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, token, fields })
    });
    const d = await res.json().catch(() => null);
    if(!res.ok || !d || !d.ok) return { ok:false, error:(d && d.error) || ("http-" + res.status) };
    return d;
  }catch(e){ return { ok:false, error:"offline" }; }
}

async function liveRemove(id, token){
  try{
    const res = await fetch("/api/decide", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, token, action: "reject" })
    });
    const d = await res.json().catch(() => null);
    if(!res.ok || !d || !d.ok) return { ok:false, error:(d && d.error) || ("http-" + res.status) };
    forgetKey(id);
    return d;
  }catch(e){ return { ok:false, error:"offline" }; }
}

/* ================= ACCOUNTS =================

   A free account. Email and a password, nothing else, no third party.

   It buys two things:
     - your listings follow you rather than the browser you posted from, so you
       can edit or withdraw one from your phone after posting from a laptop;
     - the telephone number on other people's listings.

   The email is NOT verified yet — there is no mail server behind this site, so
   nobody waits for a code that will never arrive. The profile says so plainly
   rather than pretending. Every listing is still read before it goes live.

   If the API is not answering (bindings not configured, or the page opened
   from a file), everything here goes quiet and the site works exactly as it
   did before accounts existed. Nothing on this page is allowed to break the
   rest of the site. */

const AUTH_KEY = "pt_auth";
let AUTH = null;               /* {auth:token, user:{...}} or null */
let MY_LISTINGS = [];          /* filled by authRefresh() */
let acctTab = "in";            /* "in" = sign in, "up" = sign up */
let acctMsg = null;            /* {text, bad} shown at the top of the form */
let acctBusy = false;

function authLoad(){
  try{
    const v = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    AUTH = (v && v.auth && v.user) ? v : null;
  }catch(e){ AUTH = null; }
  return AUTH;
}
function authStore(v){
  AUTH = v;
  try{
    if(v) localStorage.setItem(AUTH_KEY, JSON.stringify(v));
    else localStorage.removeItem(AUTH_KEY);
  }catch(e){}
}
/* Function declarations, not arrow constants: render() in the shell asks
   `typeof signedIn === "function"`, and a const that has not been reached yet
   throws on typeof rather than answering "undefined". Declarations hoist. */
function signedIn(){ return !!(AUTH && AUTH.auth); }
function myName(){ return (AUTH && AUTH.user && AUTH.user.name) ? AUTH.user.name : ""; }
function firstName(){ return (myName().split(/\s+/)[0] || "").slice(0, 14); }

/* one place that talks to the account API */
async function acctCall(action, body, method){
  const h = { "content-type": "application/json" };
  if(AUTH && AUTH.auth) h["authorization"] = "Bearer " + AUTH.auth;
  try{
    const res = await fetch("/api/account/" + action, {
      method: method || "POST",
      headers: h,
      body: method === "GET" ? undefined : JSON.stringify(body || {})
    });
    const d = await res.json().catch(() => null);
    if(!res.ok || !d || !d.ok)
      return { ok:false, error:(d && d.error) || ("http-" + res.status), status:res.status };
    return d;
  }catch(e){ return { ok:false, error:"offline" }; }
}

/* Ask the server who we are. A session that has expired or been deleted from
   the other side signs this device out quietly rather than leaving a name in
   the header that no longer means anything. */
async function authRefresh(){
  if(!signedIn()){ MY_LISTINGS = []; return false; }
  const d = await acctCall("me", null, "GET");
  if(d.ok){
    authStore({ auth: AUTH.auth, user: d.user });
    MY_LISTINGS = Array.isArray(d.listings) ? d.listings : [];
    return true;
  }
  if(d.status === 401){ authStore(null); MY_LISTINGS = []; }
  return false;
}

/* ---------- the telephone gate ----------

   The public feed carries hasPhone, never the number. This asks for it, and
   caches the answer for as long as the page is open so a second tap on the
   same card does not go back to the network. */
const PHONES = {};

async function revealPhone(id){
  const key = String(id).replace(/^lv-/, "");
  if(PHONES[key]) return { ok:true, phone: PHONES[key] };
  if(!signedIn()) return { ok:false, error:"sign-in-to-see-number" };
  const d = await acctCall("phone", { id: key });
  if(d.ok && d.phone){ PHONES[key] = d.phone; return { ok:true, phone:d.phone }; }
  return { ok:false, error: d.error || "unknown" };
}

/* the button that stands where a number would be */
function phoneSlot(ad){
  if(!ad || !ad.live) return "";
  const id = String(ad.id).replace(/^lv-/, "");
  if(PHONES[id])
    return `<a class="btn-gold sm" href="tel:${esc(PHONES[id])}">${esc(PHONES[id])}</a>`;
  if(!ad.hasPhone) return `<span class="mini">${t("acNoPhone")}</span>`;
  return signedIn()
    ? `<button class="btn-line sm" data-phone="${id}">${t("acShowPhone")}</button>`
    : `<button class="btn-gold sm" data-signin="${id}">${t("acSignToSee")}</button>`;
}

function wirePhones(){
  $$("[data-phone]").forEach(b => b.onclick = async () => {
    const id = b.dataset.phone;
    b.disabled = true; b.textContent = t("acWorking");
    const r = await revealPhone(id);
    if(r.ok){ render(); }
    else {
      b.disabled = false;
      b.textContent = t("acShowPhone");
      if(r.error === "sign-in-to-see-number" || r.error === "not-signed-in"){
        authStore(null); nav("account");
      }
    }
  });
  $$("[data-signin]").forEach(b => b.onclick = () => {
    acctTab = "in";
    acctMsg = { text: t("acWhySign"), bad:false };
    nav("account");
  });
}

/* withdraw one of my own listings — authenticated by the session, so it works
   from a device that never held the posting token */
async function acctRemoveListing(r){
  const h = { "content-type": "application/json" };
  if(AUTH && AUTH.auth) h["authorization"] = "Bearer " + AUTH.auth;
  try{
    const res = await fetch("/api/decide", {
      method: "POST", headers: h,
      body: JSON.stringify({ id: r.id, token: r.token || "", action: "reject" })
    });
    const d = await res.json().catch(() => null);
    if(!res.ok || !d || !d.ok)
      return { ok:false, error:(d && d.error) || ("http-" + res.status) };
    return d;
  }catch(e){ return { ok:false, error:"offline" }; }
}

function PHONES_clear(){ for(const k in PHONES) delete PHONES[k]; }

/* ---------- the app asks you to sign in when it opens ----------

   In the installed app the first screen is the account screen: Google Play
   testers, and everyone after them, sign in or sign up before they browse.
   The website is not gated this way — a stranger arriving from a search
   result sees the site, and is asked for an account only when they want a
   telephone number or want to post.

   "Installed app" means launched from the home-screen icon (standalone
   display mode) or opened through the start_url the manifest declares. A
   normal browser tab is never gated. */
function isAppLaunch(){
  try{
    if(window.matchMedia("(display-mode: standalone)").matches) return true;
    if(window.navigator.standalone === true) return true;
    if(document.referrer.startsWith("android-app://")) return true;
    return new URLSearchParams(location.search).get("src") === "app";
  }catch(e){ return false; }
}

let appGateShown = false;

function appGate(){
  if(!isAppLaunch() || signedIn() || appGateShown) return;
  /* Wait until we know whether the API answers at all. Sending someone to a
     sign-in screen that cannot possibly work would be worse than not asking. */
  if(API_ON === null){ setTimeout(appGate, 1500); return; }
  if(API_ON === false) return;      /* no API means no accounts; do not trap anyone */
  appGateShown = true;
  acctTab = "in";
  acctMsg = { text: t("acAppGate"), bad:false };
  nav("account");
}


/* ---------- router ---------- */
/* "post" and "account" are real routes but are not nav buttons: posting is
   reached from the board, and the account sits in the header where people
   look for it. */
const ROUTES=["home","market","post","account","properties","projects","calculator","tours","blog","library","guide"];
const NAV_HIDDEN=["post","account"];
let route="home", param=null;
function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h) return ["home",null];
  const [r,p]=h.split("/");
  if(r==="project"&&P.find(x=>x.key===p)) return ["project",p];
  if(r==="city") return CITIES.find(x=>x.k===p) ? ["city",p] : ["tours",null];
  if(r==="ad"&&p) return ["ad",p];
  if(r==="blog") return ["blog", p || null];
  return [ROUTES.includes(r)?r:"home", null];
}
function nav(r,p){
  const hash = (r==="project"||r==="city"||r==="ad"||(r==="blog"&&p)) ? "#/"+r+"/"+p : (r==="home"?"#/":"#/"+r);
  if(location.hash!==hash) location.hash=hash;   // updates the URL for sharing / back button
  render();                                       // render now, don't wait for the async hashchange
}
function render(){
  [route,param]=parseHash();
  const cur = route==="project" ? "projects" : route==="city" ? "tours" : (route==="ad"||route==="post") ? "market" : route==="blog" ? "blog" : route;
  const items=ROUTES.filter(r=>NAV_HIDDEN.indexOf(r)<0).map(r=>`<button data-nav="${r}"${r===cur?' aria-current="page"':""}>${t("nav_"+r)}</button>`).join("");
  const acct=$("#acct");
  if(acct){
    acct.textContent = (typeof signedIn==="function" && signedIn())
      ? (firstName() || t("nav_account")) : t("acTabIn");
    acct.setAttribute("aria-current", route==="account" ? "page" : "false");
  }
  $("#nav").innerHTML=items; $("#mnav").innerHTML=items;
  const v=$("#view");
  if(route==="project") v.innerHTML=viewProject(P.find(x=>x.key===param));
  else if(route==="properties") v.innerHTML=viewProperties();
  else if(route==="projects") v.innerHTML=viewProjects();
  else if(route==="calculator") v.innerHTML=viewCalculator();
  else if(route==="tours") v.innerHTML=viewTours();
  else if(route==="market") v.innerHTML=viewMarket();
  else if(route==="ad") v.innerHTML=viewAd(param);
  else if(route==="post") v.innerHTML=viewPost();
  else if(route==="city") v.innerHTML=viewCity(param);
  else if(route==="library") v.innerHTML=viewLibrary();
  else if(route==="guide") v.innerHTML=viewGuide();
  else if(route==="blog") v.innerHTML = param ? viewPost2(param) : viewBlog();
  else if(route==="account") v.innerHTML=viewAccount();
  else v.innerHTML=viewHome();
  if(route!=="calculator") calcFrom=null;   /* the "filled from" note is for one visit only */
  if(route!=="post") pfNotice=null;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $$("[data-nav]").forEach(el=>el.onclick=()=>nav(el.dataset.nav));
  $$("[data-go]").forEach(el=>el.onclick=()=>nav("project",el.dataset.go));
  /* the ROI button sits inside a clickable table row, so it must swallow the
     click or the row would navigate to the project instead */
  $$("[data-roi]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); openROI(el.dataset.roi); });
  $$("[data-city]").forEach(el=>el.onclick=()=>nav("city",el.dataset.city));
  wireView(); wireMarket(); wireAI(); wirePostAI(); wireBlog();
  wireAccount(); wirePhones();
  $("#basket").classList.toggle("on", picked.size>0 && (route==="tours"||route==="city"));
  window.scrollTo(0,0);
}

function setLang(v){
  if(LANGS.indexOf(v)<0) v="en";
  lang=v;
  const app=$("#app");
  app.dir = isAr() ? "rtl" : "ltr";
  app.lang = v;                       /* drives the Georgian font block in CSS */
  document.documentElement.lang = v;
  /* the pre-rendered Arabic pages set dir on <html>; the app now matches, so
     anything reading the document (a crawler, a screen reader, a print
     stylesheet) sees the same direction in both halves of the site */
  document.documentElement.dir = isAr() ? "rtl" : "ltr";
  $("#lang").value = v;
  try{ localStorage.setItem("pt_lang", v); }catch(e){}
  render(); renderBasket();
}
$("#lang").onchange = e => setLang(e.target.value);
/* Language on arrival, in order of authority:
     1. ?lang=ar (or ?lang=en, ?lang=tr) in the address — how the pre-rendered
        Arabic pages hand a visitor over to the app without making them hunt
        for the picker;
     2. the choice they made here last time;
     3. Georgian — this is a Georgia-based business and Georgian is the
        site's home language; a first-time visitor with no saved preference
        and no ?lang= sees the app in Georgian and can switch with one tap.
   setLang always runs (never skipped) so the header select, the document's
   lang/dir attributes and the Georgian font rule stay in sync with `lang`
   from the very first paint, not just on an explicit choice. */
try{
  const asked = new URLSearchParams(location.search).get("lang");
  const saved = localStorage.getItem("pt_lang");
  const want  = (asked && LANGS.indexOf(asked) >= 0) ? asked
              : (saved && LANGS.indexOf(saved) >= 0) ? saved : lang;
  setLang(want);
}catch(e){}

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

function instShow(on){ const b=$("#instbar"); if(b) b.hidden = !on; }
function instDismissed(){ try{ return localStorage.getItem("pt_inst")==="no"; }catch(e){ return false; } }

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredInstall = e;
  if(!isStandalone() && !instDismissed()) instShow(true);
});
window.addEventListener("appinstalled", () => { instShow(false); deferredInstall=null; });

if($("#instGo")) $("#instGo").onclick = async () => {
  if(deferredInstall){ deferredInstall.prompt(); await deferredInstall.userChoice.catch(()=>{});
    deferredInstall=null; instShow(false); }
  else { $("#iosheet").hidden = false; }      /* Safari has no prompt — show the steps */
};
if($("#instNo")) $("#instNo").onclick = () => {
  instShow(false); try{ localStorage.setItem("pt_inst","no"); }catch(e){}
};
if($("#iosClose")) $("#iosClose").onclick = () => $("#iosheet").hidden = true;
$("#iosheet").onclick = e => { if(e.target.id==="iosheet") $("#iosheet").hidden = true; };

/* iOS never fires beforeinstallprompt, so offer it there on merit after a look around */
if(HAS_PWA && isIOS() && !isStandalone() && !instDismissed()) setTimeout(()=>instShow(true), 9000);

/* ---------- offline notice ---------- */
function netState(){ const b=$("#offbar"); if(b) b.hidden = navigator.onLine; }
window.addEventListener("online", netState); window.addEventListener("offline", netState); netState();

/* ---------- share ---------- */
async function shareThis(title, text){
  const url = location.href;
  if(navigator.share){
    try{ await navigator.share({title, text, url}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(text + "\n" + url); alert(t("shareCopied")); }
  catch(e){ waOpen(text + "\n" + url); }
}

/* ---------- service worker ---------- */
/* Only registers on a real origin; inside a sandboxed preview it is unavailable
   and that must not take the rest of the page down with it. */
if("serviceWorker" in navigator && location.protocol === "https:" && HAS_PWA){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/pwa/sw.js").catch(()=>{});
  });
}

$("#waTop").onclick=()=>waOpen(t("hello"));
$("#tgTop").onclick=()=>tgOpen(t("hello"));
$("#mclose").onclick=()=>$("#modal").hidden=true;
$("#modal").onclick=e=>{ if(e.target.id==="modal") $("#modal").hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#modal").hidden=true; });
$("#mcopy").onclick=async()=>{ const el=$("#mtext"),b=$("#mcopy");
  try{ await navigator.clipboard.writeText(el.value); }
  catch(e){ el.focus(); el.select(); try{document.execCommand("copy")}catch(_){} }
  b.textContent=t("mDone"); b.classList.add("copied"); };
$("#clearB").onclick=()=>{ picked.clear(); if(route==="tours"||route==="city") render(); renderBasket(); };
$("#sendTour").onclick=()=>waOpen(tourText());
if($("#tgTour")) $("#tgTour").onclick=()=>tgOpen(tourText());
if($("#shareTour")) $("#shareTour").onclick=()=>shareThis("Patroni Georgia", t("shareTour") + "\n" + tourText());
let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(route==="calculator") calc(); },160); });
render(); renderBasket();
/* ask the API once; if it is not there the site simply stays as it is */
liveStart();
blogFetch().then(ok=>{ if(ok && route==="blog") render(); });

/* Accounts. The header shows the saved name immediately so the page does not
   flicker from "Sign in" to a name, then the server is asked whether that
   session is still real. Opened as the installed app, the first screen is the
   account screen. */
authLoad();
render();
authRefresh().then(() => { render(); appGate(); });
</script>

</body>
</html>
