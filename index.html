  loc:["Old Town, Batumi","المدينة القديمة، باتومي","ძველი ქალაქი, ბათუმი","Eski Şehir, Batum"],
  city:["Batumi","باتومي","ბათუმი","Batum"], ppm:"Ask me", sizes:"22.2–71.1 m²", from:161460,
  tags:[["17 apartments","١٧ شقة","17 ბინა","17 daire"],["Old Town","المدينة القديمة","ძველი ქალაქი","Eski Şehir"]],
  lede:["<b>Seventeen apartments. One block. Batumi Old Town.</b> From $161,460, handing over <b>June 2026</b> — the only building on this list that is finished this year. Every unit clears the residency line.",
        "<b>سبع عشرة شقة. مبنى واحد. المدينة القديمة في باتومي.</b> يبدأ من ١٦١٤٦٠ دولاراً، والتسليم في <b>يونيو ٢٠٢٦</b> — المبنى الوحيد في هذه القائمة الذي ينتهي هذا العام. وكل وحدة فيه تتجاوز خط الإقامة.","<b>ჩვიდმეტი ბინა. ერთი კორპუსი. ბათუმის ძველი ქალაქი.</b> $161,460-დან, ჩაბარება <b>2026 წლის ივნისში</b> — ერთადერთი შენობა ამ სიაში, რომელიც წელს სრულდება. ყველა ბინა ბინადრობის ზღვარს აღემატება."],
  facts:[[["From","يبدأ من","დან","Başlangıç"],"$161,460"],[["Apartments","الشقق","ბინები","Daire"],"17"],
         [["Ceilings","الارتفاع","ჭერი","Tavan"],"3.2 m"],[["Handover","التسليم","ჩაბარება","Teslim"],"Jun 2026"],
         [["Sold","مباع","გაყიდულია","Satılan"],"70%"]],
  story:[
   {h:["Why there is no price per metre here","لماذا لا يوجد سعر للمتر هنا","რატომ არ არის აქ მითითებული ფასი კვადრატულ მეტრზე"],
    p:["The developer's from-price is $161,460 and the smallest unit is 22.2 m². Divide one by the other and you get about $7,270 per square metre, which would make this the most expensive building in Georgia by a wide margin. That is almost certainly not what is happening — the $161,460 belongs to a larger unit, not the small studio.<br><br>Rather than print a number I cannot stand behind, I have asked NEXT for the actual per-square-metre price list for this building. Until it arrives, this row says Ask me and I will send you the real figure. <b>Seventeen apartments in Old Town, handing over June 2026</b>, with a Mitsubishi lift, a panoramic terrace, 24/7 concierge, a restaurant and commercial space below, and fibre-reinforced concrete rated to magnitude 8.",
        "سعر البدء لدى المطوّر هو ١٦١٤٦٠ دولاراً، وأصغر وحدة ٢٢٫٢ متراً مربعاً. اقسم أحدهما على الآخر تحصل على نحو ٧٢٧٠ دولاراً للمتر، ما يجعل هذا أغلى مبنى في جورجيا بفارق كبير. وهذا شبه مؤكد ليس ما يحدث — فالمبلغ يعود إلى وحدة أكبر لا إلى الاستوديو الصغير.<br><br>وبدلاً من نشر رقم لا أستطيع الدفاع عنه، طلبت من نكست قائمة أسعار المتر الفعلية لهذا المبنى. وإلى أن تصل، يقول هذا الصف «اسألني» وسأرسل لك الرقم الحقيقي. <b>سبع عشرة شقة في المدينة القديمة، التسليم يونيو ٢٠٢٦</b>، مع مصعد ميتسوبيشي، وتراس بانورامي، وكونسيرج على مدار الساعة، ومطعم ومساحة تجارية في الأسفل، وخرسانة مسلّحة بالألياف مقاومة لزلزال بقوة ٨.","დეველოპერის საწყისი ფასია $161,460, ყველაზე მცირე ბინა კი 22.2 მ²-ია. ერთი მეორეზე გაყავით და მიიღებთ დაახლოებით $7,270-ს კვადრატულ მეტრზე, რაც ამ შენობას დიდი სხვაობით საქართველოში ყველაზე ძვირად აქცევდა. თითქმის ნამდვილად ასე არ არის — $161,460 უფრო დიდ ბინას ეკუთვნის და არა პატარა სტუდიოს.<br><br>იმის ნაცვლად, რომ დავბეჭდო ციფრი, რომელზეც პასუხს ვერ ვაგებ, NEXT-ს ვთხოვე ამ შენობის რეალური ფასთა ნუსხა კვადრატულ მეტრზე. სანამ ის მოვა, ამ სტრიქონში წერია „მკითხეთ“ და მე რეალურ ციფრს გამოგიგზავნით. <b>ჩვიდმეტი ბინა ძველ ქალაქში, ჩაბარება 2026 წლის ივნისში</b>, Mitsubishi-ს ლიფტით, პანორამული ტერასით, 24/7 კონსიერჟით, ქვემოთ რესტორნითა და კომერციული ფართით, და ფიბრობეტონით, რომელიც 8 მაგნიტუდაზეა გათვლილი."]},

   {duo:["dt_dusk","dt_night"],

         "الزاوية عند الغروب ثم بعد حلول الظلام — الكتلة الزجاجية مضاءة من الداخل، والمطعم والبار عند مستوى الشارع.","კუთხე დაბინდებისას და ისევ ბნელის შემდეგ — შუშის მოცულობა შიგნიდან განათებული, რესტორანი და ბარი ქუჩის დონეზე."]},

   {h:["A nineteenth-century facade with a glass building behind it",
       "واجهة من القرن التاسع عشر ومبنى زجاجي خلفها","მეცხრამეტე საუკუნის ფასადი და მის უკან შუშის შენობა"],
    p:["This is the part of the project that decides whether you like it. The original Old Town frontage — the stone, the cornices, the wrought-iron balconies, the arched carriage door — is kept and restored, and the new building rises behind and above it in glass. Nothing of the street is demolished.<br><br>It is a harder thing to build than a tower on an empty plot, and it is the reason the apartments sit where they do: <b>you are inside the Old Town, not beside it</b>. The shops at pavement level stay commercial, so the ground floor is a street rather than a lobby.",
        "هذا هو الجزء الذي يقرّر إن كان المشروع يعجبك. فالواجهة الأصلية للمدينة القديمة — الحجر والكرانيش وشرفات الحديد المطاوع والباب المقوّس — محفوظة ومرمّمة، والمبنى الجديد يرتفع خلفها وفوقها بالزجاج. ولا يُهدم شيء من الشارع.<br><br>وهو أصعب في البناء من برج على أرض فارغة، وهو سبب موقع الشقق: <b>أنت داخل المدينة القديمة لا بجوارها</b>. والمحلات عند مستوى الرصيف تبقى تجارية، فالطابق الأرضي شارع لا بهو.","სწორედ ეს ნაწილი წყვეტს, მოგეწონებათ თუ არა პროექტი. ძველი ქალაქის ორიგინალური ფასადი — ქვა, კარნიზები, ნაჭედი რკინის აივნები, თაღოვანი საკარეტე კარი — შენარჩუნებული და აღდგენილია, ახალი შენობა კი მის უკან და მის ზემოთ შუშით იზრდება. ქუჩიდან არაფერი ინგრევა.<br><br>ეს ცარიელ ნაკვეთზე კოშკის აშენებაზე რთული საქმეა და სწორედ ამიტომ დგას ბინები იქ, სადაც დგანან: <b>თქვენ ძველი ქალაქის შიგნით ხართ და არა მის გვერდით</b>. ტროტუარის დონეზე მაღაზიები კომერციული რჩება, ამიტომ პირველი სართული ქუჩაა და არა ლობი."]},

   {duo:["dt_facade","dt_aerial"],

         "الواجهة المرمّمة عند مستوى الشارع، والمبنى كاملاً من الأعلى مع تراس السطح الممتد بطوله.","აღდგენილი ფასადი ქუჩის დონეზე და მთელი კორპუსი ზემოდან, სახურავის ტერასით მთელ სიგრძეზე."]},

   {h:["Inside the apartments","داخل الشقق","ბინების შიგნით"],
    p:["Ceilings are <b>3.2 m</b>, which is unusually generous for seventeen units in a restored block and is what makes the smaller apartments work. The interiors are finished in oak, travertine, boucle and linen — warm rather than white, and quiet enough that the window does the talking.<br><br>Units run from <b>22.2 to 71.1 m²</b>. The studios are genuinely small; what they get in exchange is the address, the ceiling height and a June 2026 handover.",
        "ارتفاع الأسقف <b>٣٫٢ متر</b>، وهو سخيّ بشكل غير معتاد لسبع عشرة وحدة في مبنى مرمّم، وهو ما يجعل الشقق الأصغر ناجحة. والتشطيبات بالبلوط والترافرتين والبوكليه والكتّان — دافئة لا بيضاء، وهادئة بما يكفي لتترك الكلام للنافذة.<br><br>وتتراوح الوحدات بين <b>٢٢٫٢ و٧١٫١ متراً مربعاً</b>. والاستوديوهات صغيرة فعلاً، وما تحصل عليه مقابل ذلك هو العنوان وارتفاع السقف وتسليم يونيو ٢٠٢٦.","ჭერის სიმაღლეა <b>3.2 მ</b>, რაც აღდგენილ კორპუსში განთავსებული ჩვიდმეტი ბინისთვის უჩვეულოდ დიდია და სწორედ ეს ამუშავებს პატარა ბინებს. ინტერიერი მოპირკეთებულია მუხით, ტრავერტინით, ბუკლესა და სელით — თეთრის ნაცვლად თბილი და იმდენად მშვიდი, რომ სიტყვას ფანჯარა ამბობს.<br><br>ბინები <b>22.2-დან 71.1 მ²-მდეა</b>. სტუდიოები ნამდვილად პატარაა; სამაგიეროდ იღებენ მისამართს, ჭერის სიმაღლესა და 2026 წლის ივნისის ჩაბარებას."]},

   {h:["The bedrooms","غرف النوم","საძინებლები"],

        "نوافذ بارتفاع كامل نحو الشارع، وسرير بقماش البوكليه أمام جدار مكسو، ونجارة مبنية لا مشتراة — الخزانة والرفوف وممر الملابس كلها جزء من التجهيز.<br><br>وشقق الزاوية تحصل على اتجاهين: نافذة على سطوح المدينة القديمة وأخرى على امتداد الشارع.","სრული სიმაღლის ფანჯრები ქუჩის მხარეს, ბუკლეს საწოლი პანელებიანი კედლის ფონზე და ავეჯი ჩაშენებული და არა ნაყიდი — გარდერობი, თაროები და საგარდერობე ზოლი, ყველაფერი მოწყობის ნაწილია.<br><br>კუთხის ბინებს ორი ხედი აქვს: ერთი ფანჯარა ძველი ქალაქის სახურავებზე, მეორე ქუჩის გასწვრივ."]},

   {h:["The roof","السطح","სახურავი"],
    p:["A <b>panoramic terrace</b> runs the length of the block under a timber pergola, planted along the parapet, looking over the Old Town roofs toward the sea. It is shared, not private, and it is the single amenity that most changes what a 22 m² studio here is actually like to live in.<br><br>Below it: a restaurant and commercial space, a Mitsubishi lift, 24/7 concierge, and fibre-reinforced concrete rated to magnitude 8.",
        "يمتد <b>تراس بانورامي</b> بطول المبنى تحت عريشة خشبية، مزروع على امتداد الحاجز، ويطلّ على سطوح المدينة القديمة باتجاه البحر. وهو مشترك لا خاص، وهو المرفق الوحيد الذي يغيّر أكثر من غيره شعور العيش في استوديو بمساحة ٢٢ متراً هنا.<br><br>وتحته: مطعم ومساحة تجارية، ومصعد ميتسوبيشي، وكونسيرج على مدار الساعة، وخرسانة مسلّحة بالألياف مقاومة لزلزال بقوة ٨.","<b>პანორამული ტერასა</b> კორპუსის მთელ სიგრძეზე გადის ხის პერგოლის ქვეშ, პარაპეტის გასწვრივ გამწვანებული, და ძველი ქალაქის სახურავებს გადაჰყურებს ზღვისკენ. ის საერთოა და არა კერძო, და სწორედ ეს ერთი კეთილმოწყობაა, რომელიც ყველაზე მეტად ცვლის იმას, როგორია აქ 22 მ² სტუდიოში ცხოვრება.<br><br>მის ქვემოთ: რესტორანი და კომერციული ფართი, Mitsubishi-ს ლიფტი, 24/7 კონსიერჟი და ფიბრობეტონი, რომელიც 8 მაგნიტუდაზეა გათვლილი."]},

  story:[
   {h:["Five years is a long time","خمس سنوات مدة طويلة","ხუთი წელი დიდი დროა"],
    p:["The monthly payment is the lowest on this list — about $1,213 — and the first payment is only 10%, roughly $7,500. That is genuinely accessible, and it is accessible because you are lending the developer your money until <b>December 2031</b>.<br><br>Two things follow. First, this cannot deliver residency for five years, because the permit needs registered ownership. Second, ask what happens if the handover slips: what the contract says about delay, what you are owed, and what happens to your instalments. A five-year presale is a bet on the developer surviving five years — NEXT has the track record to make that reasonable, but it is still the question to ask, in writing.",
        "القسط الشهري هو الأقل في هذه القائمة — نحو ١٢١٣ دولاراً — والدفعة الأولى ١٠٪ فقط، أي نحو ٧٥٠٠ دولار. وهذا متاح فعلاً، ومتاح لأنك تُقرض المطوّر مالك حتى <b>ديسمبر ٢٠٣١</b>.<br><br>ويترتب على ذلك أمران. أولاً، لا يمكن لهذا أن يمنح إقامة لخمس سنوات، لأن التصريح يتطلب ملكية مسجَّلة. ثانياً، اسأل ماذا يحدث إذا تأخر التسليم: ماذا ينص العقد على التأخير، وما المستحق لك، وماذا يحل بأقساطك. البيع المبكر لخمس سنوات رهان على بقاء المطوّر خمس سنوات — ولدى نكست سجلّ يجعل ذلك معقولاً، لكنه يبقى السؤال الواجب طرحه، كتابةً.","ყოველთვიური გადასახდელი ამ სიაში ყველაზე დაბალია — დაახლოებით $1,213 — და პირველადი შენატანი მხოლოდ 10%-ია, დაახლოებით $7,500. ეს მართლაც ხელმისაწვდომია და ხელმისაწვდომია იმიტომ, რომ თქვენს ფულს დეველოპერს ასესხებთ <b>2031 წლის დეკემბრამდე</b>.<br><br>აქედან ორი რამ გამომდინარეობს. პირველი: ეს ხუთი წლის განმავლობაში ბინადრობის ნებართვას ვერ მოგცემთ, რადგან ნებართვას რეგისტრირებული საკუთრება სჭირდება. მეორე: იკითხეთ, რა მოხდება, თუ ჩაბარება გადაიწევს — რას ამბობს ხელშეკრულება დაგვიანებაზე, რა გეკუთვნით და რა ემართება თქვენს განვადების შენატანებს. ხუთწლიანი წინასწარი გაყიდვა ფსონია იმაზე, რომ დეველოპერი ხუთ წელს გაუძლებს — NEXT-ს აქვს გამოცდილება, რომ ეს გონივრულად ჩაითვალოს, მაგრამ კითხვა მაინც დასასმელია, წერილობით."]}]},

  story:[
   {h:["Tbilisi rents twelve months a year","تبليسي تُؤجَّر اثني عشر شهراً في السنة","თბილისი წელიწადში თორმეტ თვეს ქირავდება"],
    p:["This is the argument for the capital over the coast. Batumi's rental year has a shape — a loud summer and a quiet winter. Tbilisi does not: embassies, companies, students and long-stay visitors keep demand flat across the calendar. Lower peak, higher floor.<br><br>Avlabari is the old quarter on the high bank, walking distance to the Old Town and the sulphur baths. Daikin VRF air conditioning, Geberit plumbing rated to save 30% of water, low-emissivity glass, fibre-reinforced concrete. A gym, 24/7 concierge, valet parking, laundry, a business lounge, a library, children's areas and a garden lobby. Deposits start at $1,000–$3,000 with 0% instalments of 12–45 months.<br><br>The per-metre figure here has the same problem as NEXT Downtown — $165,000 against a 27 m² studio does not compute — so I have asked for the real price list rather than guess.",
        "هذه هي الحجة لصالح العاصمة على الساحل. فسنة الإيجار في باتومي لها شكل: صيف صاخب وشتاء هادئ. أما تبليسي فلا: السفارات والشركات والطلاب والزوار طويلو الإقامة يبقون الطلب مستوياً على مدار السنة. ذروة أقل، وقاع أعلى.<br><br>أفلاباري هو الحي القديم على الضفة المرتفعة، على مسافة مشي من المدينة القديمة وحمّامات الكبريت. تكييف دايكن VRF، وسباكة غيبيريت موفِّرة لـ٣٠٪ من الماء، وزجاج منخفض الانبعاثية، وخرسانة مسلّحة بالألياف. صالة رياضية، وكونسيرج على مدار الساعة، وخدمة صفّ سيارات، ومغسلة، وصالة أعمال، ومكتبة، ومناطق أطفال، وردهة حديقة. تبدأ العرابين من ١٠٠٠ إلى ٣٠٠٠ دولار بأقساط ٠٪ من ١٢ إلى ٤٥ شهراً.<br><br>ورقم سعر المتر هنا فيه المشكلة نفسها الموجودة في نكست داون تاون — ١٦٥٠٠٠ دولار مقابل استوديو ٢٧ متراً لا يستقيم — لذلك طلبت قائمة الأسعار الحقيقية بدل التخمين.","ეს არის არგუმენტი დედაქალაქის სასარგებლოდ სანაპიროსთან შედარებით. ბათუმის საიჯარო წელს ფორმა აქვს — ხმაურიანი ზაფხული და მშვიდი ზამთარი. თბილისს არა: საელჩოები, კომპანიები, სტუდენტები და ხანგრძლივად მყოფი ვიზიტორები მოთხოვნას მთელი კალენდრის განმავლობაში თანაბრად ინარჩუნებენ. უფრო დაბალი პიკი, უფრო მაღალი ქვედა ზღვარი.<br><br>ავლაბარი ძველი უბანია მაღალ ნაპირზე, ფეხით სავალ მანძილზე ძველი ქალაქიდან და გოგირდის აბანოებიდან. Daikin VRF კონდიცირება, Geberit-ის სანტექნიკა, რომელიც წყლის 30%-ის დაზოგვაზეა გათვლილი, დაბალემისიური მინა, ბოჭკოებით არმირებული ბეტონი. სპორტდარბაზი, 24/7 კონსიერჟი, ვალეტ-პარკინგი, სამრეცხაო, ბიზნეს-ლაუნჯი, ბიბლიოთეკა, საბავშვო სივრცეები და ბაღით გარშემორტყმული ლობი. დეპოზიტი $1,000–$3,000-დან იწყება, 0% განვადებით 12–45 თვეზე.<br><br>აქ ერთ მეტრზე გადაანგარიშებულ ციფრს იგივე პრობლემა აქვს, რაც NEXT Downtown-ს — $165,000 27 მ²-იან სტუდიოსთან არ ჯდება — ამიტომ გამოცნობის ნაცვლად რეალური ფასების სია მოვითხოვე."]}]},

  lede:["Ortachala on the Mtkvari: studios <b>from $109,350</b>, one-bedrooms from $164,000, two-bedrooms from $240,120. <b>70% sold</b>, handover <b>December 2028</b>. The studios sit below the residency line, the rest clear it comfortably.",
        "أورتاتشالا على نهر متكفاري: استوديوهات <b>من ١٠٩٣٥٠ دولاراً</b>، وشقق بغرفة نوم من ١٦٤٠٠٠، وبغرفتين من ٢٤٠١٢٠. <b>٧٠٪ مباع</b>، والتسليم في <b>ديسمبر ٢٠٢٨</b>. الاستوديوهات تحت خط الإقامة، وما عداها يتجاوزه بارتياح.","ორთაჭალა მტკვრის პირას: სტუდიოები <b>$109,350-დან</b>, ერთსაძინებლიანი ბინები $164,000-დან, ორსაძინებლიანი $240,120-დან. <b>70% გაყიდულია</b>, ჩაბარება <b>2028 წლის დეკემბერი</b>. სტუდიოები ბინადრობის ნებართვის ზღვარს ქვემოთ რჩება, დანარჩენი კი მას თავისუფლად აჭარბებს."],
  facts:[[["From","يبدأ من","დან","Başlangıç"],"$109,350"],[["2-bed from","غرفتان من","2 საძ. დან","2+1 başlangıç"],"$240,120"],
         [["Handover","التسليم","ჩაბარება","Teslim"],"Dec 2028"],[["Sold","مباع","გაყიდულია","Satılan"],"70%"]],
  story:[
   {h:["One building, both sides of the line","مبنى واحد، وجانبا الخط","ერთი შენობა, ზღვრის ორივე მხარეს"],
    p:["Oriental is the clearest illustration of the rule this whole site is built on. A <b>$109,350 studio here does not qualify for residency</b>. A <b>$240,120 two-bedroom in the same lobby does</b>. Same address, same developer, same finish — different answer, because the permit is assessed on the appraised value of your specific unit, not on the reputation of the building.<br><br>Anyone who tells you \"Oriental is good for residency\" or \"Oriental is not\" is selling you something. Ask which unit, then ask for the valuation.<br><br>The building itself: an elegant lobby, 24/7 security and valet parking, a gym and wellness centre, a Georgian restaurant, offices, a garden, cleaning and laundry, concierge. NEXT projects 10–12% annual ROI here. Treat any projected return as a sales figure until your own numbers agree with it — that is what the calculator on this site is for.",
        "أورينتال هو أوضح تجسيد للقاعدة التي بُني عليها هذا الموقع كله. فـ<b>استوديو بـ١٠٩٣٥٠ دولاراً هنا لا يؤهّل للإقامة</b>. و<b>شقة بغرفتين بـ٢٤٠١٢٠ دولاراً في المدخل نفسه تؤهّل</b>. العنوان نفسه، والمطوّر نفسه، والتشطيب نفسه — والجواب مختلف، لأن التصريح يُقيَّم على القيمة المُقدَّرة لوحدتك تحديداً، لا على سمعة المبنى.<br><br>ومن يقول لك «أورينتال جيد للإقامة» أو «ليس جيداً» فهو يبيعك شيئاً. اسأل أي وحدة، ثم اطلب التقييم.<br><br>أما المبنى نفسه: ردهة أنيقة، وأمن وخدمة صفّ سيارات على مدار الساعة، وصالة رياضية ومركز عافية، ومطعم جورجي، ومكاتب، وحديقة، وخدمات تنظيف وغسيل، وكونسيرج. وتتوقع نكست عائداً سنوياً بين ١٠٪ و١٢٪ هنا. عامل أي عائد متوقَّع كرقم بيعي حتى توافقه أرقامك أنت — ولهذا وُضعت الحاسبة في هذا الموقع.","Oriental ყველაზე ნათლად აჩვენებს იმ წესს, რომელზეც მთელი ეს საიტია აგებული. <b>აქ $109,350-იანი სტუდიო ბინადრობის ნებართვისთვის არ ვარგა</b>. <b>იმავე ლობიში $240,120-იანი ორსაძინებლიანი ბინა კი ვარგა</b>. იგივე მისამართი, იგივე დეველოპერი, იგივე მოპირკეთება — სხვადასხვა პასუხი, რადგან ნებართვა ფასდება თქვენი კონკრეტული ერთეულის შეფასებული ღირებულებით და არა შენობის რეპუტაციით.<br><br>ვინც გეუბნებათ, რომ „Oriental კარგია ბინადრობისთვის\" ან „Oriental არ ვარგა\", ის რაღაცას გყიდით. იკითხეთ, რომელ ერთეულზეა საუბარი, შემდეგ კი შეფასება მოითხოვეთ.<br><br>თავად შენობა: ელეგანტური ლობი, 24/7 დაცვა და ვალეტ-პარკინგი, სპორტდარბაზი და ველნეს-ცენტრი, ქართული რესტორანი, ოფისები, ბაღი, დასუფთავება და სამრეცხაო, კონსიერჟი. NEXT აქ წლიურ 10–12% ROI-ს პროგნოზირებს. ნებისმიერი პროგნოზირებული უკუგება გაყიდვების ციფრად მიიჩნიეთ, სანამ თქვენივე გათვლები არ დაეთანხმება — სწორედ ამისთვისაა ამ საიტზე კალკულატორი."]}]},

  lede:["The most expensive and the most unusual: <b>216 residences</b> built around the restored 1930 film-studio pavilion on Aghmashenebeli Avenue, a <b>protected cultural heritage monument</b>. From $206,000. Handover <b>Q4 2029</b>.",
        "الأغلى والأكثر تميّزاً: <b>٢١٦ وحدة</b> مبنية حول جناح استوديو سينمائي من عام ١٩٣٠ أُعيد ترميمه في جادة أغماشينيبيلي، وهو <b>معلم تراثي ثقافي محمي</b>. من ٢٠٦٠٠٠ دولار. التسليم في <b>الربع الأخير من ٢٠٢٩</b>.","ყველაზე ძვირი და ყველაზე უჩვეულო: <b>216 რეზიდენცია</b>, აგებული აღმაშენებლის გამზირზე მდებარე, 1930 წლის აღდგენილი კინოსტუდიის პავილიონის გარშემო, რომელიც <b>დაცული კულტურული მემკვიდრეობის ძეგლია</b>. $206,000-დან. ჩაბარება <b>2029 წლის მე-4 კვარტალი</b>."],
  facts:[[["From","يبدأ من","დან","Başlangıç"],"$206,000"],[["Residences","الوحدات","რეზიდენცია","Rezidans"],"216"],
         [["Handover","التسليم","ჩაბარება","Teslim"],"Q4 2029"],[["First payment","الدفعة الأولى","პირველი შენატანი","İlk ödeme"],"10%"]],
  story:[
   {h:["Buying a listed building is not buying a flat","شراء مبنى مُصنَّف ليس كشراء شقة","დაცული ძეგლის ყიდვა ბინის ყიდვა არ არის"],
    p:["The pitch is genuinely rare: a 1930 cinema pavilion, protected as cultural heritage, restored and built into a residential scheme with a cinematography museum, galleries of dining, a library, co-working, a gym, a kids' zone and valet parking. 216 units, entry from $206,000, 45 months at 0% on a 10% ($20,600) first payment, about $4,120 a month.<br><br>Heritage status cuts both ways, and you should know which way before you sign. It is why the building is unrepeatable, and it is also why restoration work can run long and why what you may alter inside and outside is restricted. Ask for the heritage conditions attached to the permit, and ask what the contract says if <b>Q4 2029</b> becomes 2030. This is presale — nothing is sold yet, so you have leverage now that you will not have later.",
        "الطرح نادر فعلاً: جناح سينما من عام ١٩٣٠، محمي كتراث ثقافي، جرى ترميمه ودمجه في مشروع سكني يضم متحفاً للسينما، وصالات طعام، ومكتبة، ومساحة عمل مشترك، وصالة رياضية، ومنطقة أطفال، وخدمة صفّ سيارات. ٢١٦ وحدة، يبدأ الدخول من ٢٠٦٠٠٠ دولار، بـ٤٥ شهراً بفائدة ٠٪ ودفعة أولى ١٠٪ (٢٠٦٠٠ دولار)، أي نحو ٤١٢٠ دولاراً شهرياً.<br><br>وصفة التراث سلاح ذو حدين، ويجب أن تعرف أي حدّ قبل التوقيع. فهي سبب كون المبنى غير قابل للتكرار، وهي أيضاً سبب احتمال طول أعمال الترميم وتقييد ما يمكنك تغييره داخلاً وخارجاً. اطلب شروط التراث المرفقة بالرخصة، واسأل ماذا ينص العقد إن صار <b>الربع الأخير من ٢٠٢٩</b> عام ٢٠٣٠. هذا بيع مبكر — لم يُبَع شيء بعد، فلديك الآن قوة تفاوضية لن تملكها لاحقاً.","შეთავაზება მართლაც იშვიათია: 1930 წლის კინოპავილიონი, დაცული როგორც კულტურული მემკვიდრეობა, აღდგენილი და ჩართული საცხოვრებელ პროექტში, სადაც იქნება კინემატოგრაფიის მუზეუმი, სასადილო გალერეები, ბიბლიოთეკა, კოვორკინგი, სპორტდარბაზი, საბავშვო ზონა და ვალეტ-პარკინგი. 216 ერთეული, შესვლა $206,000-დან, 45 თვე 0%-ზე 10%-იანი ($20,600) პირველადი შენატანით, დაახლოებით $4,120 თვეში.<br><br>მემკვიდრეობის სტატუსს ორი მხარე აქვს და ხელმოწერამდე უნდა იცოდეთ, რომელი გელით. სწორედ ამის გამოა შენობა განუმეორებელი და სწორედ ამის გამო შეიძლება რესტავრაციის სამუშაოები გაჭიანურდეს და შეზღუდული იყოს ის, რისი შეცვლაც შიგნით და გარეთ შეგიძლიათ. მოითხოვეთ ნებართვაზე თანდართული მემკვიდრეობის პირობები და იკითხეთ, რას ამბობს ხელშეკრულება იმ შემთხვევაზე, თუ <b>2029 წლის მე-4 კვარტალი</b> 2030 წლად იქცევა. ეს წინასწარი გაყიდვაა — ჯერ არაფერია გაყიდული, ამიტომ ახლა გაქვთ ბერკეტი, რომელიც მოგვიანებით აღარ გექნებათ."]}]},

  story:[
   {h:["Why a sold-out project is still worth reading","لماذا يستحق مشروع نفد بيعه القراءة","რატომ ღირს სრულად გაყიდულ პროექტზე წაკითხვა"],
    p:["You cannot buy this. It is here because it was delivered.<br><br>When a developer asks you to pay for something that will not exist until 2029, the only honest evidence you have is what they finished before. Villa Park is finished, occupied and fully sold, with its own management company, 24/7 security, a heated pool, picnic grounds and parkland. Judge the 2029 promises against this, not against a brochure.",
        "لا يمكنك شراء هذا. وهو هنا لأنه سُلِّم.<br><br>حين يطلب منك مطوّر أن تدفع ثمن شيء لن يوجد قبل ٢٠٢٩، فالدليل الصادق الوحيد لديك هو ما أنجزه قبل ذلك. فيلا بارك مكتملة ومسكونة ومباعة بالكامل، ولها شركة إدارة خاصة، وأمن على مدار الساعة، ومسبح مُدفّأ، ومناطق نزهة وحدائق. احكم على وعود ٢٠٢٩ بهذا، لا بكتيّب دعائي.","ამის ყიდვა არ შეგიძლიათ. აქ იმიტომაა, რომ ჩაბარდა.<br><br>როცა დეველოპერი გთხოვთ, გადაიხადოთ იმაში, რაც 2029 წლამდე არ იარსებებს, ერთადერთი პატიოსანი მტკიცებულება ისაა, რაც მან უკვე დაასრულა. Villa Park დასრულებულია, დასახლებული და სრულად გაყიდული, საკუთარი მმართველი კომპანიით, 24/7 დაცვით, გახურებადი აუზით, საპიკნიკე ადგილითა და პარკით. 2029 წლის დაპირებები სწორედ ამას შეადარეთ და არა ბუკლეტს."]}]},

  lede:["An operating apart-hotel two hundred metres from the beach in central Batumi, originally from $45,000, now <b>fully sold and running</b>. Reception, restaurant, lounge bar, parking, and NEXT's own management app handling bookings and payouts.",
        "شقق فندقية عاملة على بُعد مئتي متر من الشاطئ في وسط باتومي، كانت تبدأ من ٤٥٠٠٠ دولار، والآن <b>مباعة بالكامل وتعمل</b>. استقبال، ومطعم، وبار لاونج، ومواقف، وتطبيق الإدارة الخاص بنكست يتولّى الحجوزات والمدفوعات.","მოქმედი აპარტ-სასტუმრო ცენტრალურ ბათუმში, პლაჟიდან ორას მეტრში, თავდაპირველად $45,000-დან, ახლა კი <b>სრულად გაყიდული და მოქმედი</b>. რეცეფცია, რესტორანი, ლაუნჯ-ბარი, პარკინგი და NEXT-ის საკუთარი სამართავი აპლიკაცია, რომელიც ჯავშნებსა და გადახდებს ამუშავებს."],

  story:[
   {h:["The management app is the part to look at","التطبيق الإداري هو ما يجب النظر إليه","სამართავი აპლიკაციაა ის, რასაც ყურადღება უნდა მიაქციოთ"],
    p:["What makes this one worth studying is not the building, it is the machine behind it: NEXT runs the lettings through its own app, so the owner sees bookings and money without living in Georgia. If you are buying in one of the projects still selling, ask to be shown this app with real numbers from a real owner — not a demo. It is the closest thing to seeing your future income statement before you buy.",
        "ما يجعل هذا المشروع جديراً بالدراسة ليس المبنى، بل الآلة خلفه: تدير نكست التأجير عبر تطبيقها الخاص، فيرى المالك الحجوزات والأموال دون أن يعيش في جورجيا. فإن كنت تشتري في أحد المشاريع المعروضة، اطلب أن يُعرض عليك هذا التطبيق بأرقام حقيقية من مالك حقيقي — لا نسخة تجريبية. فهو أقرب ما يكون إلى رؤية بيان دخلك المستقبلي قبل الشراء.","ამ პროექტში შესასწავლი შენობა კი არა, მის უკან მდგარი მექანიზმია: NEXT გაქირავებას საკუთარი აპლიკაციით მართავს, ასე რომ მესაკუთრე ჯავშნებსა და ფულს ხედავს საქართველოში ცხოვრების გარეშე. თუ ყიდულობთ ერთ-ერთ იმ პროექტში, რომელიც ჯერ კიდევ იყიდება, მოითხოვეთ, რომ ეს აპლიკაცია რეალური მესაკუთრის რეალური ციფრებით გაჩვენონ — და არა დემო-ვერსია. ეს ყველაზე ახლოსაა იმასთან, რომ ყიდვამდე თქვენი მომავალი შემოსავლის ანგარიში ნახოთ."]}]},

        "مكتمل و<b>مباع بالكامل</b>، على بُعد ثلاث دقائق مشياً من البحر في الحي السياحي بباتومي. كان يبدأ من ٥٧٠٠٠ دولار، بإطلالات على البحر والجبل، وبار في الردهة، ومساحة عمل مشترك، وصالة رياضية.","დასრულებული და <b>100%-ით გაყიდული</b>, ზღვიდან სამი წუთის სავალზე, ბათუმის ტურისტულ უბანში. თავდაპირველად $57,000-დან, ზღვისა და მთის ხედებით, ლობი-ბარით, კოვორკინგ-სივრცითა და ფიტნეს-ცენტრით."],

  story:[
   {h:["What $57,000 bought in Batumi","ماذا اشترى ٥٧٠٠٠ دولار في باتومي","რას ყიდულობდა $57,000 ბათუმში"],
    p:["Keep this number in view when you look at today's prices. NEXT White opened from $57,000 and sold out; the comparable entry today, at Magnolia, is $49,000 for an inland building, and anything on the water starts far higher.<br><br>That is the appreciation story in one line — and also the warning inside it. Past price growth on this coast has been real, but a decade of it does not entitle anyone to promise you the next decade. Use the calculator with a 4–6% assumption and see whether the deal still works.",
        "احتفظ بهذا الرقم أمام عينيك وأنت تنظر إلى أسعار اليوم. افتتح نكست وايت من ٥٧٠٠٠ دولار ونفد بيعه؛ ونظيره اليوم في ماغنوليا هو ٤٩٠٠٠ دولار لمبنى داخلي، وأي شيء على الماء يبدأ بأعلى من ذلك بكثير.<br><br>تلك هي قصة ارتفاع الأسعار في سطر واحد — وفيها أيضاً التحذير. فنمو الأسعار على هذا الساحل كان حقيقياً، لكن عقداً من النمو لا يخوّل أحداً أن يعدك بالعقد التالي. استخدم الحاسبة بافتراض ٤٪ إلى ٦٪ وانظر هل تبقى الصفقة مجدية.","ეს ციფრი თვალწინ გქონდეთ, როცა დღევანდელ ფასებს უყურებთ. NEXT White $57,000-დან გაიხსნა და სრულად გაიყიდა; დღეს შესადარებელი შესვლის ფასი Magnolia-ში $49,000-ია ზღვისგან მოშორებულ შენობაში, ხოლო ზღვის პირას ყველაფერი გაცილებით ძვირიდან იწყება.<br><br>ეს არის ღირებულების ზრდის ისტორია ერთ წინადადებაში — და მასშივეა გაფრთხილება. ამ სანაპიროზე ფასების წარსული ზრდა რეალური იყო, მაგრამ ერთი ათწლეული არავის აძლევს უფლებას, მომდევნო ათწლეული დაგპირდეთ. გამოიყენეთ კალკულატორი 4–6%-იანი დაშვებით და ნახეთ, კვლავ მუშაობს თუ არა გარიგება."]}]},

   {h:["Read the return claim carefully","اقرأ ادعاء العائد بتمعّن","ყურადღებით წაიკითხეთ შემოსავლიანობის დაპირება"],
    p:["The developer advertises \"annual return up to 12%\" on this building. <b>Up to</b> is doing the work in that sentence — it describes the best unit in the best year, not the average owner.<br><br>This is not a criticism of NEXT specifically; every developer on this coast writes the same way. It is why this site gives you a calculator that subtracts management fees, vacancy weeks, service charges and tax instead of quoting you a headline. Run your own number, then ask the developer to explain the gap.",
        "يعلن المطوّر عن «عائد سنوي يصل إلى ١٢٪» على هذا المبنى. وعبارة <b>يصل إلى</b> هي التي تقوم بالعمل في تلك الجملة — فهي تصف أفضل وحدة في أفضل سنة، لا المالك المتوسط.<br><br>وليس هذا انتقاداً لنكست تحديداً؛ فكل مطوّر على هذا الساحل يكتب بالطريقة نفسها. ولهذا يمنحك هذا الموقع حاسبة تطرح رسوم الإدارة وأسابيع الشغور ورسوم الخدمة والضريبة بدل أن تعطيك رقماً براقاً. احسب رقمك أنت، ثم اطلب من المطوّر أن يفسّر الفارق.","დეველოპერი ამ შენობაზე „წლიურ შემოსავალს 12%-მდე\" არეკლამებს. ამ წინადადებაში მთელ საქმეს <b>„-მდე\"</b> აკეთებს — ის აღწერს საუკეთესო ერთეულს საუკეთესო წელს და არა საშუალო მესაკუთრეს.<br><br>ეს კონკრეტულად NEXT-ის კრიტიკა არ არის; ამ სანაპიროზე ყველა დეველოპერი ასე წერს. სწორედ ამიტომ გაძლევთ ეს საიტი კალკულატორს, რომელიც აკლებს მართვის საფასურს, სიცარიელის კვირებს, მომსახურების საფასურსა და გადასახადს, ნაცვლად იმისა, რომ სათაურის ციფრი შემოგთავაზოთ. გამოთვალეთ საკუთარი ციფრი და შემდეგ დეველოპერს სთხოვეთ, ახსნას სხვაობა."]}]}

const CHECKS=[
 [["Everything on this page before 6 September 2026 was wrong — corrected","كل ما كان على هذه الصفحة قبل ٦ سبتمبر ٢٠٢٦ كان خطأً — وقد صُحّح","ყველაფერი, რაც ამ გვერდზე 2026 წლის 6 სექტემბრამდე ეწერა, მცდარი იყო — გასწორებულია"],
  ["This is my own mistake, and it is the largest one on the list. Until that date these pages carried figures assembled last year from PDFs and presentations. Prices had moved, unit counts had changed, and two projects no longer existed in the form described. <b>All of it has been deleted, not edited.</b> Every number you now see was read off next-property.com on 6 September 2026 with the developer's permission. If a figure here disagrees with something I sent you before, this page is right and the old message is wrong.",
   "هذا خطئي أنا، وهو الأكبر في القائمة. فحتى ذلك التاريخ كانت هذه الصفحات تحمل أرقاماً جُمعت العام الماضي من ملفات وعروض. وقد تحرّكت الأسعار، وتغيّرت أعداد الوحدات، ولم يعد مشروعان موجودين بالصورة الموصوفة. <b>وقد حُذف كل ذلك، لا عُدِّل.</b> وكل رقم تراه الآن قُرئ من next-property.com في ٦ سبتمبر ٢٠٢٦ بإذن المطوّر. فإن خالف رقم هنا شيئاً أرسلته لك سابقاً، فهذه الصفحة هي الصحيحة والرسالة القديمة خطأ.","ეს ჩემი საკუთარი შეცდომაა და ამ სიაში ყველაზე დიდი. იმ თარიღამდე ამ გვერდებზე განთავსებული იყო შარშან PDF-ებიდან და პრეზენტაციებიდან შეკრებილი ციფრები. ფასები შეიცვალა, ერთეულების რაოდენობა შეიცვალა და ორი პროექტი უკვე აღარ არსებობდა აღწერილი სახით. <b>ყველაფერი წაიშალა და არა შესწორდა.</b> ყველა ციფრი, რომელსაც ახლა ხედავთ, next-property.com-იდან არის ამოკითხული 2026 წლის 6 სექტემბერს, დეველოპერის ნებართვით. თუ აქ მოცემული რომელიმე ციფრი ეწინააღმდეგება იმას, რაც ადრე გამოგიგზავნეთ, სწორია ეს გვერდი და არა ძველი შეტყობინება."]],
 [["Two buildings publish a price I cannot turn into a rate","مبنيان ينشران سعراً لا أستطيع تحويله إلى سعر متر","ორი შენობა აქვეყნებს ფასს, რომელსაც განაკვეთად ვერ ვაქცევ"],
  ["NEXT Downtown starts at $161,460 with a smallest unit of 22.2 m²; Tbilisi Downtown starts at $165,000 with a 27 m² studio. Divide either and you get $6,000–7,300 per square metre, which would make them the most expensive buildings in Georgia. The from-price almost certainly belongs to a larger unit. Their unit-level pages load their price tables with scripts I cannot read, so the real per-square-metre list has to come from NEXT directly. Until it does, those two rows say <b>Ask me</b>.",
   "نكست داون تاون يبدأ من ١٦١٬٤٦٠ دولاراً وأصغر وحدة فيه ٢٢٫٢ متراً؛ وتبليسي داون تاون يبدأ من ١٦٥٬٠٠٠ باستوديو ٢٧ متراً. اقسم أياً منهما تحصل على ٦٠٠٠–٧٣٠٠ دولار للمتر، ما يجعلهما أغلى مبنيين في جورجيا. وسعر البدء يعود شبه المؤكد إلى وحدة أكبر. وصفحات الوحدات لديهم تحمّل جداول الأسعار ببرمجيات لا أستطيع قراءتها، فقائمة سعر المتر الحقيقية يجب أن تأتي من نكست مباشرة. وإلى أن تأتي، يقول هذان الصفّان <b>اسألني</b>.","NEXT Downtown $161,460-დან იწყება, უმცირესი ერთეული კი 22.2 მ²-ია; Tbilisi Downtown $165,000-დან იწყება, 27 მ²-იანი სტუდიოთი. ორივე შემთხვევაში გაყოფისას მიიღებთ $6,000–7,300-ს კვადრატულ მეტრზე, რაც მათ საქართველოში ყველაზე ძვირ შენობებად აქცევდა. „დან\" ფასი თითქმის ნამდვილად უფრო დიდ ერთეულს ეკუთვნის. მათი ერთეულების გვერდები ფასების ცხრილებს ისეთი სკრიპტებით ტვირთავს, რომელთა წაკითხვაც არ შემიძლია, ამიტომ კვადრატულ მეტრზე რეალური ფასების სია პირდაპირ NEXT-ისგან უნდა მოვიდეს. სანამ ეს მოხდება, ეს ორი სტრიქონი ამბობს: <b>მკითხეთ</b>."]],
 [["Radisson is 576 units on today's site — your presentation says 1,128","راديسون ٥٧٦ وحدة على موقع اليوم — وعرضك يقول ١١٢٨","Radisson დღევანდელი საიტის მიხედვით 576 ერთეულია — თქვენი პრეზენტაცია კი 1,128-ს ამბობს"],
  ["The live page counts 360 studios, 192 one-bedrooms and 24 two-bedrooms: <b>576</b>. An older deck in your files says 1,128 across six blocks. One is describing a phase and the other the whole scheme. Before you quote a unit, confirm in writing which phase it sits in and what its handover date is.",
   "الصفحة المباشرة تعدّ ٣٦٠ استوديو، و١٩٢ شقة بغرفة نوم، و٢٤ بغرفتين: <b>٥٧٦</b>. وعرض أقدم في ملفاتك يقول ١١٢٨ في ستة مبانٍ. أحدهما يصف مرحلة والآخر المشروع كاملاً. قبل أن تسعّر وحدة، أكّد كتابةً في أي مرحلة تقع وما موعد تسليمها.","მოქმედ გვერდზე დათვლილია 360 სტუდიო, 192 ერთსაძინებლიანი და 24 ორსაძინებლიანი ბინა: <b>576</b>. თქვენს ფაილებში არსებული ძველი პრეზენტაცია ექვს ბლოკში 1,128-ს ასახელებს. ერთი ერთ ფაზას აღწერს, მეორე კი მთელ პროექტს. სანამ კონკრეტულ ერთეულზე ფასს დაასახელებთ, წერილობით დაადასტურეთ, რომელ ფაზაშია ის და როგორია მისი ჩაბარების თარიღი."]],
 [["The Radisson deck still advertises the obsolete $100,000 rule","عرض راديسون ما زال يعلن قاعدة الـ١٠٠ ألف الملغاة","Radisson-ის პრეზენტაცია კვლავ მოძველებულ $100,000-იან წესს არეკლამებს"],
  ["Page 5 promises a permit \u201cwith investments in real estate from $100,000.\u201d The threshold became <b>$150,000 on 1 March 2026</b>. Do not forward that PDF to a buyer without correcting the line — it is the fastest way to lose a client's trust when their lawyer reads it.",
   "الصفحة الخامسة تعد بتصريح «باستثمار عقاري من ١٠٠ ألف دولار». وقد أصبح الحد <b>١٥٠ ألف دولار في ١ مارس ٢٠٢٦</b>. لا تُرسل ذلك الملف إلى مشترٍ قبل تصحيح السطر — فهو أسرع طريقة لفقدان ثقة العميل حين يقرأه محاميه.","მე-5 გვერდი გპირდებათ ნებართვას \\u201eუძრავ ქონებაში $100,000-იდან ინვესტიციის შემთხვევაში\\u201c. ზღვარი <b>2026 წლის 1 მარტს $150,000</b> გახდა. ნუ გადაუგზავნით ამ PDF-ს მყიდველს ამ სტრიქონის შესწორების გარეშე — როცა მის იურისტს ის წაუკითხავს, ეს კლიენტის ნდობის დაკარგვის ყველაზე სწრაფი გზაა."]],
 [["Shell price or turnkey — always say which","سعر هيكل أم جاهز — قل دائماً أيّهما","კარკასის ფასი თუ გასაღებზე ჩაბარება — ყოველთვის თქვით, რომელია"],
  ["Most of these prices are shell prices, with finishing sold separately at roughly $650–900/m². Magnolia quotes renovated and unrenovated stock at different sold percentages, which tells you the two are priced apart. On a 50 m² flat that gap is $32,000–45,000 — bigger than any discount anyone will negotiate for you.",
   "معظم هذه الأسعار أسعار هيكل، والتشطيب يُباع منفصلاً بنحو ٦٥٠–٩٠٠ دولار للمتر. وماغنوليا تعرض المعروض المُجهَّز وغير المُجهَّز بنسبتي بيع مختلفتين، ما يخبرك أنهما مسعّران على حدة. وعلى شقة ٥٠ متراً يبلغ الفارق ٣٢٬٠٠٠–٤٥٬٠٠٠ دولار — أكبر من أي خصم سيتفاوض عليه أحد لصالحك.","ამ ფასების უმეტესობა კარკასის ფასია, რემონტი კი ცალკე იყიდება, დაახლოებით $650–900/მ²-ად. Magnolia გარემონტებულ და გაურემონტებელ ფართს სხვადასხვა გაყიდულ პროცენტზე ასახელებს, რაც გეუბნებათ, რომ ეს ორი სხვადასხვა ფასშია. 50 მ² ბინაზე ეს სხვაობა $32,000–45,000-ია — მეტი, ვიდრე ნებისმიერი ფასდაკლება, რომელსაც ვინმე თქვენთვის მოილაპარაკებს."]],
 [["Magnolia is the one building entirely under the residency line","ماغنوليا هو المبنى الوحيد الواقع بالكامل تحت خط الإقامة","Magnolia ერთადერთი შენობაა, რომელიც მთლიანად ბინადრობის ზღვარს ქვემოთაა"],
  ["At about $1,540/m² even the largest 86.3 m² unit prices near $133,000. Every other project on this list holds units on both sides of $150,000. State this as a fact when you quote Magnolia — it is a good rental building and a bad residency route, and saying so is what makes the rest of your numbers believable.",

    "حصن روماني من القرن الأول، ما زال قائماً مستطيلاً كاملاً من الأسوار والأبراج، وفي داخله حفريات وحديقة. ويقول التقليد المحلي إن الحواري متياس مدفون في ساحته. هادئ ورخيص وعلى بُعد خمس عشرة دقيقة من باتومي.","პირველი საუკუნის რომაული ციხესიმაგრე, დღემდე სრული ოთხკუთხედი კედლებითა და კოშკებით, შიგნით არქეოლოგიური გათხრებითა და ბაღით. ადგილობრივი გადმოცემით, ეზოში მოციქული მატათაა დაკრძალული. წყნარია, იაფია და ბათუმიდან თხუთმეტ წუთშია."],
 tip:["One hour. Combine it with the beach in the same afternoon.",
      "ساعة واحدة. اجمعها مع الشاطئ في العصر نفسه.","ერთი საათი. იმავე შუადღეს ზღვასთან ერთად მოაქციეთ."]},
"gonio|1":{im:["a10_0","a10_1"],
 d:["The stretch of coast south of Gonio, where the mountains come down close to the water and the crowd thins out. Grey pebbles, deep clear water a few metres out, and far fewer people than the city beach even in August.",
    "امتداد الساحل جنوب غونيو، حيث تنزل الجبال قريباً من الماء ويخفّ الزحام. حصى رمادي، وماء صافٍ عميق على بُعد أمتار، وناس أقلّ بكثير من شاطئ المدينة حتى في أغسطس.","გონიოს სამხრეთით მდებარე სანაპირო ზოლი, სადაც მთები წყალთან ახლოს ჩამოდის და ხალხი თხელდება. ნაცრისფერი კენჭები, რამდენიმე მეტრში ღრმა და გამჭვირვალე წყალი და ქალაქის პლაჟზე გაცილებით ნაკლები ხალხი აგვისტოშიც კი."],
 tip:["Bring beach shoes. The pebbles are hot at midday and hard on bare feet.",
      "أحضر حذاء بحر. فالحصى ساخن ظهراً وقاسٍ على القدم الحافية.","წაიღეთ საბანაო ფეხსაცმელი. კენჭები შუადღისას ცხელია და შიშველ ფეხს უჭირს."]},
"gonio|2":{im:["a11_0","a11_1"],
 d:["The last bay before the Turkish border, backed by steep green hills with houses stacked up them. The water here is the clearest on the Georgian coast — this is where Georgians themselves go to swim.",
    "آخر خليج قبل الحدود التركية، تسنده تلال خضراء شديدة الانحدار تتراصّ عليها البيوت. والماء هنا الأصفى على الساحل الجورجي — وهنا يذهب الجورجيون أنفسهم للسباحة.","ბოლო ყურე თურქეთის საზღვრამდე, უკან ციცაბო მწვანე გორებით, რომლებზეც სახლებია ერთმანეთზე აშენებული. წყალი აქ საქართველოს სანაპიროზე ყველაზე გამჭვირვალეა — სწორედ აქ დადიან საბანაოდ თავად ქართველები."],
 tip:["Twenty-five minutes from Batumi. Quietest before eleven in the morning.",
      "خمس وعشرون دقيقة من باتومي. وأهدأ ما يكون قبل الحادية عشرة صباحاً.","ბათუმიდან ოცდახუთი წუთი. ყველაზე წყნარია დილის თერთმეტ საათამდე."]},

"kazbegi|0":{im:["a12_0","a12_1"],
 d:["A fourteenth-century church alone on a green shoulder at 2,170 metres, with the 5,047-metre wall of Mount Kazbek behind it. It is the single most photographed thing in Georgia and it still does not disappoint when you are standing there.",
    "كنيسة من القرن الرابع عشر وحدها على كتف أخضر على ارتفاع ٢١٧٠ متراً، وخلفها جدار جبل كازبك بارتفاع ٥٠٤٧ متراً. إنها أكثر ما يُصوَّر في جورجيا، ومع ذلك لا تخيّب الظنّ حين تقف هناك.","მეთოთხმეტე საუკუნის ეკლესია მარტო დგას მწვანე მხარზე, 2,170 მეტრზე, უკან კი მყინვარწვერის 5,047-მეტრიანი კედელია. საქართველოში ყველაზე ბევრჯერ გადაღებული ადგილია და ადგილზე დგომისას მაინც არ გაცრუებს."],
 tip:["Three hours from Tbilisi each way. Take a 4x4 up the last stretch; the road is rough.",
      "ثلاث ساعات من تبليسي في كل اتجاه. خذ دفع رباعي للجزء الأخير؛ فالطريق وعر.","თბილისიდან სამი საათი თითო მიმართულებით. ბოლო მონაკვეთზე 4x4 აიყვანეთ; გზა ცუდია."]},
"kazbegi|1":{im:["a13_0","a13_1"],
 d:["A walled complex of churches and a tower on the shore of a turquoise reservoir, an hour out of Tbilisi on the road north. Everyone stops here, and rightly — it is the first properly beautiful thing on the drive.",
    "مجمّع مسوَّر من الكنائس وبرج على ضفة بحيرة اصطناعية فيروزية، على بُعد ساعة من تبليسي على الطريق شمالاً. الجميع يتوقّف هنا، وعن حق — فهو أول شيء جميل حقاً في الرحلة.","ეკლესიებისა და კოშკის შემოზღუდული კომპლექსი ფირუზისფერი წყალსაცავის ნაპირზე, თბილისიდან ერთი საათის სავალზე, ჩრდილოეთის გზაზე. აქ ყველა ჩერდება და სამართლიანადაც — გზაზე პირველი ნამდვილად ლამაზი რამაა."],
 tip:["Forty minutes. It is on the way to Kazbegi, not a separate trip.",
      "أربعون دقيقة. وهو في الطريق إلى كازبيغي لا رحلة منفصلة.","ორმოცი წუთი. ყაზბეგისკენ მიმავალ გზაზეა, ცალკე გასვლას არ საჭიროებს."]},
"kazbegi|2":{im:["a14_0","a14_1"],
 d:["A curved concrete balcony built out over a gorge in 1983, lined inside with a huge coloured mosaic. Soviet architecture at its most confident, in a setting that would be worth stopping for even if the building were not there.",
    "شرفة خرسانية منحنية بُنيت فوق وادٍ سحيق عام ١٩٨٣، مبطّنة من الداخل بفسيفساء ملوّنة ضخمة. عمارة سوفييتية في أوج ثقتها، في موقع يستحقّ التوقّف حتى لو لم يكن المبنى موجوداً.","1983 წელს ხეობაზე გადმოშენებული მოხრილი ბეტონის აივანი, შიგნიდან უზარმაზარი ფერადი მოზაიკით მოპირკეთებული. საბჭოთა არქიტექტურა თავის ყველაზე თავდაჯერებულ სახეში, ისეთ ადგილას, სადაც შენობის გარეშეც ღირდა გაჩერება."],
 tip:["Twenty minutes. Bring a jacket — it is cold and windy up there in any season.",
      "عشرون دقيقة. أحضر سترة — فالمكان بارد وعاصف في كل فصل.","ოცი წუთი. ქურთუკი წაიღეთ — იქ ნებისმიერ სეზონზე ცივა და ქარია."]},
"kazbegi|3":{im:["a15_0"],
 d:["Georgia's main ski resort in winter and a paragliding launch in summer, at 2,200 metres on the same road. In July the slopes are green pasture and you can fly off the ridge with an instructor for less than a hundred dollars.",
    "منتجع التزلّج الرئيسي في جورجيا شتاءً ومنصّة طيران شراعي صيفاً، على ارتفاع ٢٢٠٠ متر على الطريق نفسه. وفي يوليو تكون المنحدرات مراعي خضراء، ويمكنك الطيران من الحافة مع مدرّب بأقل من مئة دولار.","ზამთარში საქართველოს მთავარი სათხილამურო კურორტი, ზაფხულში კი პარაპლანის ასაფრენი, 2,200 მეტრზე, იმავე გზაზე. ივლისში ფერდობები მწვანე საძოვარია და ინსტრუქტორთან ერთად ქედიდან ასი დოლარზე ნაკლებად გაფრინდებით."],
 tip:["Ski season December to March. Book paragliding the day before.",
      "موسم التزلج من ديسمبر إلى مارس. واحجز الطيران الشراعي قبل يوم.","სათხილამურო სეზონი დეკემბრიდან მარტამდე. პარაპლანი წინა დღეს დაჯავშნეთ."]},

"mtskheta|0":{im:["a16_0","a16_1"],
 d:["The cathedral where Georgian kings were crowned and buried, built in the eleventh century over a fourth-century church, on the spot where tradition holds the robe of Christ was buried. It is the country's most sacred building and the whole town around it is a UNESCO site.",
    "الكاتدرائية التي تُوِّج فيها ملوك جورجيا ودُفنوا، بُنيت في القرن الحادي عشر فوق كنيسة من القرن الرابع، في الموضع الذي يقول التقليد إن ثوب المسيح دُفن فيه. إنها أقدس مبنى في البلاد، والبلدة كلها حولها موقع تراث عالمي.","ტაძარი, სადაც ქართველ მეფეებს აკურთხებდნენ და კრძალავდნენ; მეთერთმეტე საუკუნეში აშენდა მეოთხე საუკუნის ეკლესიაზე, იმ ადგილას, სადაც გადმოცემით ქრისტეს კვართია დამარხული. ქვეყნის ყველაზე წმინდა ნაგებობაა და მის გარშემო მთელი ქალაქი იუნესკოს ძეგლია."],
 tip:["Ninety minutes. Twenty minutes from Tbilisi — the easiest half-day trip in Georgia.",
      "تسعون دقيقة. عشرون دقيقة من تبليسي — أسهل رحلة نصف يوم في جورجيا.","ოთხმოცდაათი წუთი. თბილისიდან ოცი წუთი — ყველაზე მარტივი ნახევარდღიანი გასვლა საქართველოში."]},
"mtskheta|1":{im:["a17_0","a17_1"],
 d:["The sixth-century monastery on the cliff directly above Mtskheta, small and bare inside, with the best view in the region from its terrace. The building is fifteen hundred years old and looks it, in the best way.",
    "دير من القرن السادس على الجرف فوق متسخيتا مباشرة، صغير وخالٍ من الداخل، ومن شرفته أفضل إطلالة في المنطقة. المبنى عمره ألف وخمسمئة سنة ويبدو كذلك، بأجمل معنى.","მეექვსე საუკუნის მონასტერი კლდეზე, პირდაპირ მცხეთის თავზე; შიგნიდან პატარა და უბრალო, ტერასიდან კი რეგიონში საუკეთესო ხედი. შენობა ათას ხუთასი წლისაა და ზუსტად ისე გამოიყურება — საუკეთესო გაგებით."],
 tip:["Thirty minutes at the top. You need a car — there is no walking route up.",
      "ثلاثون دقيقة في الأعلى. تحتاج سيارة — فلا مسار مشي للصعود.","ოცდაათი წუთი ზემოთ. მანქანა გჭირდებათ — ფეხით ასასვლელი გზა არ არის."]},
"mtskheta|2":{im:["a18_0"],
 d:["The point below Jvari where the Aragvi and the Mtkvari meet, one river running clear and the other brown, flowing side by side without mixing for several hundred metres. It is a strange thing to watch and it costs nothing.",
    "الموضع أسفل جفاري حيث يلتقي نهرا أراغفي ومتكفاري، أحدهما صافٍ والآخر عكِر، يجريان جنباً إلى جنب دون أن يمتزجا مئات الأمتار. مشهد غريب، ولا يكلّف شيئاً.","ჯვრის ქვემოთ ის ადგილი, სადაც არაგვი და მტკვარი ერთმანეთს ერთვის: ერთი მდინარე გამჭვირვალეა, მეორე მღვრიე, და რამდენიმე ასეულ მეტრზე გვერდიგვერდ მიედინებიან შეურევლად. უცნაური სანახავია და არაფერი ღირს."],
 tip:["Ten minutes, from the Jvari terrace. Clearest after dry weather.",
      "عشر دقائق، من شرفة جفاري. وأوضح ما يكون بعد طقس جاف.","ათი წუთი, ჯვრის ტერასიდან. ყველაზე კარგად მშრალი ამინდის შემდეგ ჩანს."]},

"kakheti|0":{im:["a19_0","a19_1"],
 d:["A small walled hill town looking out over the Alazani valley to the Caucasus, restored in warm brick and red tile, with a defensive wall you can walk. Georgians call it the city of love because the registry office there marries couples twenty-four hours a day.",
    "بلدة صغيرة مسوَّرة على تلّة تطلّ على وادي ألازاني نحو القوقاز، مرمّمة بالآجرّ الدافئ والقرميد الأحمر، ولها سور دفاعي يمكنك السير عليه. ويسمّيها الجورجيون مدينة الحب لأن دائرة السجل فيها تزوّج الأزواج على مدار الساعة.","პატარა გალავნიანი მთის ქალაქი, რომელიც ალაზნის ველსა და კავკასიონს გადაჰყურებს; თბილი აგურითა და წითელი კრამიტით აღდგენილი, თავდაცვითი კედლით, რომელზეც სიარული შეიძლება. ქართველები მას სიყვარულის ქალაქს ეძახიან, რადგან იქაური რეესტრი წყვილებს დღე-ღამის განმავლობაში აქორწინებს."],
 tip:["Half a day with lunch. Two hours from Tbilisi.",
      "نصف يوم مع الغداء. ساعتان من تبليسي.","ნახევარი დღე სადილთან ერთად. თბილისიდან ორი საათი."]},
"kakheti|1":{im:["a20_0","a20_1"],
 d:["A working convent fifteen minutes from Sighnaghi, in a garden of cypresses on the edge of the escarpment, where St Nino — the woman who converted Georgia in the fourth century — is buried. A spring below the church is still a pilgrimage.",
    "دير عامل للراهبات على بُعد خمس عشرة دقيقة من سيغناغي، في حديقة من السرو على حافة الهضبة، حيث تُدفن القدّيسة نينو — المرأة التي نصّرت جورجيا في القرن الرابع. وما زال نبع أسفل الكنيسة مقصداً للحجّ.","მოქმედი დედათა მონასტერი სიღნაღიდან თხუთმეტ წუთში, კვიპაროსების ბაღში, ფერდობის კიდეზე, სადაც წმინდა ნინოა დაკრძალული — ქალი, რომელმაც მეოთხე საუკუნეში საქართველო მოაქცია. ეკლესიის ქვემოთ წყარო დღემდე სალოცავია."],
 tip:["Forty minutes. Modest dress required; women are given headscarves at the gate.",
      "أربعون دقيقة. اللباس المحتشم مطلوب؛ وتُعطى النساء أغطية رأس عند البوابة.","ორმოცი წუთი. სავალდებულოა თავშესაფარი ჩაცმულობა; ქალებს შესასვლელთან თავსაფარს აძლევენ."]},
"kakheti|2":{im:["a21_0","a21_1"],
 d:["Kakheti has been making wine for eight thousand years — the oldest continuous winemaking anywhere — and still ferments it in clay qvevri buried in the ground. Cellars around Telavi open their doors for tastings, usually with bread, cheese and no hurry.",
    "تصنع كاخيتي النبيذ منذ ثمانية آلاف سنة — أقدم صناعة نبيذ متواصلة في العالم — وما زالت تخمّره في جِرار «قفيفري» الطينية المدفونة في الأرض. وأقبية حول تيلافي تفتح أبوابها للتذوّق، عادةً مع الخبز والجبن وبلا عجلة.","კახეთი რვა ათასი წელია ღვინოს აყენებს — ყველაზე ხანგრძლივი უწყვეტი მეღვინეობა მსოფლიოში — და დღემდე მიწაში ჩაფლულ თიხის ქვევრში ადუღებს. თელავის მიდამოების მარნები დეგუსტაციისთვის კარს აღებენ, ჩვეულებრივ პურით, ყველით და უჩქაროდ."],
 tip:["Two to three hours. Say clearly at the start if you are not drinking — nobody minds.",

 kw: "Georgia residence permit property",
 title: ["The $150,000 residence permit rule, in one page",
         "قاعدة الإقامة بـ١٥٠ ألف دولار في صفحة واحدة","$150,000-იანი ბინადრობის ნებართვის წესი — ერთ გვერდზე"],
 dek: ["Since 1 March 2026 a Georgian residence permit through property needs $150,000, judged on a certified valuation and on registered ownership. Here is what that actually means when you are choosing a unit.",
       "منذ ١ مارس ٢٠٢٦ صار تصريح الإقامة الجورجي عبر العقار يتطلّب ١٥٠ ألف دولار، تُقاس بتقييم معتمد وبالملكية المسجّلة. وهذا ما يعنيه ذلك فعلاً عند اختيار الوحدة.","2026 წლის 1 მარტიდან საქართველოში უძრავი ქონებით ბინადრობის ნებართვის მისაღებად საჭიროა $150,000, რაც ფასდება სერტიფიცირებული შეფასებისა და რეგისტრირებული საკუთრების მიხედვით. აი, რას ნიშნავს ეს სინამდვილეში, როცა კონკრეტულ ობიექტს ირჩევთ."],
 body: [
  {h: ["Three things people still get wrong", "ثلاثة أمور ما زال الناس يخطئون فيها","სამი რამ, რასაც ხალხი დღემდე არასწორად იგებს"],
   p: ["<b>It is the appraisal, not your contract.</b> A $152,000 purchase that an accredited assessor values at $141,000 fails. Get the valuation before you sign.<br><br><b>It is registered ownership, not a signed contract.</b> Off-plan counts for nothing until the finished building is registered in your name — a 2029 handover is a 2029 permit.<br><br><b>You can combine properties.</b> Two apartments at $80,000 each satisfy the threshold, provided both are registered to the same applicant.",
       "<b>العبرة بالتقييم لا بعقدك.</b> فشراء بـ١٥٢٬٠٠٠ دولار يقيّمه خبير معتمد بـ١٤١٬٠٠٠ يسقط. احصل على التقييم قبل التوقيع.<br><br><b>العبرة بالملكية المسجّلة لا بالعقد الموقّع.</b> فالشراء على المخطط لا يُحتسب حتى يُسجَّل المبنى المنجز باسمك — وتسليم ٢٠٢٩ يعني تصريح ٢٠٢٩.<br><br><b>يمكن جمع عدة عقارات.</b> شقتان بـ٨٠ ألف دولار لكل منهما تحقّقان الحدّ، شرط تسجيلهما باسم المتقدّم نفسه.","<b>მნიშვნელობა აქვს შეფასებას და არა თქვენს ხელშეკრულებას.</b> $152,000-ად შეძენილი ქონება, რომელსაც აკრედიტებული შემფასებელი $141,000-ად აფასებს, ვერ გაივლის. შეფასება ხელმოწერამდე გააკეთეთ.<br><br><b>მნიშვნელობა აქვს რეგისტრირებულ საკუთრებას და არა ხელმოწერილ ხელშეკრულებას.</b> მშენებარე ობიექტი არაფრად ითვლება მანამ, სანამ დასრულებული შენობა თქვენს სახელზე არ დარეგისტრირდება — 2029 წლის ჩაბარების თარიღი 2029 წლის ნებართვას ნიშნავს.<br><br><b>ქონებების შეჯამება შესაძლებელია.</b> ორი ბინა, თითო $80,000-ად, აკმაყოფილებს ზღვარს იმ პირობით, რომ ორივე ერთსა და იმავე განმცხადებელზეა რეგისტრირებული."]},
  {h: ["The grandfather clause is worth knowing", "قاعدة الحقوق المكتسبة تستحق المعرفة","ძველი წესის შენარჩუნების პირობა, რომელიც უნდა იცოდეთ"],
   p: ["If your property was registered <b>before 1 March 2026</b>, the old $100,000 threshold still applies to you, and existing permit holders can renew without a new appraisal as long as they keep owning it. What is not cleanly settled is what happens if such a permit is allowed to lapse — so renew on time rather than find out.",
       "إن كان عقارك مسجّلاً <b>قبل ١ مارس ٢٠٢٦</b>، فحدّ الـ١٠٠ ألف دولار القديم ما زال ينطبق عليك، ويستطيع حاملو التصاريح التجديد دون تقييم جديد ما داموا محتفظين بالملكية. وما ليس محسوماً بوضوح هو ما يحدث إن تُرك التصريح ينتهي — فجدّد في وقته بدل أن تكتشف.","თუ თქვენი ქონება <b>2026 წლის 1 მარტამდე</b> დარეგისტრირდა, თქვენზე კვლავ ძველი, $100,000-იანი ზღვარი ვრცელდება, ხოლო ნებართვის არსებულ მფლობელებს ახალი შეფასების გარეშე შეუძლიათ მისი განახლება მანამ, სანამ ქონება მათ საკუთრებაში რჩება. ბოლომდე გარკვეული არ არის, რა ხდება მაშინ, თუ ასეთ ნებართვას ვადა გაუვა — ამიტომ ჯობია დროულად განაახლოთ, ვიდრე ეს პრაქტიკაში გამოცადოთ."]},
  {h: ["And the question nobody asks", "والسؤال الذي لا يسأله أحد","და კითხვა, რომელსაც არავინ სვამს"],
   p: ["Citizens of 94 countries — every Gulf state, Jordan, Turkey, the EU, the UK, the USA — can already stay in Georgia <b>visa-free for a full year</b> per entry. Be clear about what the permit buys you beyond that: a residence card, easier banking, a formal address, and years that count toward permanent residency. Those are real. Buying a $150,000 apartment purely to be legally present somewhere you can already be legally present is not.",
       "مواطنو ٩٤ دولة — كل دول الخليج والأردن وتركيا والاتحاد الأوروبي وبريطانيا والولايات المتحدة — يستطيعون أصلاً البقاء في جورجيا <b>بلا تأشيرة سنة كاملة</b> عن كل دخول. فكن واضحاً بشأن ما يمنحك إياه التصريح زيادةً على ذلك: بطاقة إقامة، وتعاملات بنكية أسهل، وعنوان رسمي، وسنوات تُحتسب للإقامة الدائمة. وهذه أمور حقيقية. أما شراء شقة بـ١٥٠ ألف دولار لمجرد التواجد القانوني في مكان تستطيع التواجد فيه قانونياً أصلاً فليس كذلك.","94 ქვეყნის მოქალაქეებს — ყურის ყველა ქვეყანა, იორდანია, თურქეთი, ევროკავშირი, გაერთიანებული სამეფო, აშშ — უკვე შეუძლიათ საქართველოში <b>უვიზოდ, მთელი წლის განმავლობაში</b> დარჩენა ყოველი შემოსვლისას. კარგად გაიაზრეთ, რას გაძლევთ ნებართვა ამის გარდა: ბინადრობის მოწმობას, ბანკთან უფრო მარტივ ურთიერთობას, ოფიციალურ მისამართს და წლებს, რომლებიც მუდმივ ბინადრობაში ჩაგეთვლებათ. ეს რეალური რამეებია. $150,000-იანი ბინის ყიდვა მხოლოდ იმისთვის, რომ კანონიერად იმყოფებოდეთ იქ, სადაც უკვე კანონიერად შეგიძლიათ იმყოფებოდეთ, არ არის."]}],
 cap: ["Georgia's residence permit through property is $150,000 since 1 March 2026 — and it is judged on the appraised value, not the price on your contract. Off-plan does not count until the building is registered in your name. Full breakdown on the site.",
       "تصريح الإقامة في جورجيا عبر العقار صار ١٥٠ ألف دولار منذ ١ مارس ٢٠٢٦ — ويُقاس بالقيمة المقدَّرة لا بسعر عقدك. والشراء على المخطط لا يُحتسب حتى يُسجَّل المبنى باسمك. التفاصيل كاملة على الموقع.","საქართველოში უძრავი ქონებით ბინადრობის ნებართვა 2026 წლის 1 მარტიდან $150,000-ს მოითხოვს — და ის შეფასებული ღირებულებით განისაზღვრება და არა თქვენს ხელშეკრულებაში მითითებული ფასით. მშენებარე ობიექტი არ ითვლება მანამ, სანამ შენობა თქვენს სახელზე არ დარეგისტრირდება. სრული განხილვა საიტზეა."],
 tags: ["GeorgiaRealEstate","GeorgiaResidencePermit","PropertyInGeorgia","Batumi","Tbilisi","PatroniGeorgia"]
},

{
 slug: "apartments-for-sale-in-batumi-what-they-cost",
 date: "2026-09-10", cat: "property", hero: "c_batumi",
 kw: "apartments for sale in Batumi",
 title: ["What apartments in Batumi actually cost",
         "كم تكلّف الشقق في باتومي فعلاً","რა ღირს ბინები ბათუმში სინამდვილეში"],
 dek: ["Around $1,395–1,500 per square metre on average — and five things that move that number far more than the district name does.",
       "نحو ١٣٩٥–١٥٠٠ دولار للمتر المربع وسطياً — وخمسة أمور تحرّك هذا الرقم أكثر بكثير من اسم الحي.","საშუალოდ დაახლოებით $1,395–1,500 კვადრატულ მეტრზე — და ხუთი ფაქტორი, რომლებიც ამ ციფრს უბნის სახელზე გაცილებით მეტად ცვლის."],
 body: [
  {h: ["The headline number", "الرقم الأساسي","მთავარი ციფრი"],
   p: ["Colliers put the average residential price at about <b>$1,500 per m²</b> in Batumi and Tbilisi at the end of 2025; TBC Capital's Batumi figure is nearer <b>$1,395</b>. Agents in the city report 8–10% annual growth, and 2025 closed with a record <b>17,478 apartment transactions</b> in Batumi, about 52% of them to foreign buyers.",
       "قدّرت كوليرز متوسط السعر السكني بنحو <b>١٥٠٠ دولار للمتر</b> في باتومي وتبليسي نهاية ٢٠٢٥، ورقم تي بي سي كابيتال لباتومي أقرب إلى <b>١٣٩٥</b>. ويذكر الوسطاء نمواً سنوياً ٨–١٠٪، وأُغلق عام ٢٠٢٥ برقم قياسي بلغ <b>١٧٬٤٧٨ صفقة شقة</b> في باتومي، نحو ٥٢٪ منها لمشترين أجانب.","Colliers-ის შეფასებით, 2025 წლის ბოლოს საცხოვრებელი ფართის საშუალო ფასი ბათუმსა და თბილისში დაახლოებით <b>$1,500 მ²-ზე</b> იყო; TBC Capital-ის მაჩვენებელი ბათუმისთვის <b>$1,395</b>-თან უფრო ახლოსაა. ქალაქის სააგენტოები წლიურ 8–10% ზრდაზე საუბრობენ, 2025 წელი კი ბათუმში რეკორდული, <b>17,478 ბინის გარიგებით</b> დასრულდა, რომელთა დაახლოებით 52% უცხოელ მყიდველებზე მოდის."]},
  {h: ["What actually moves the price per metre", "ما الذي يحرّك سعر المتر فعلاً","რა ცვლის რეალურად ფასს კვადრატულ მეტრზე"],
   p: ["<ul><li><b>First row against second row.</b> The largest single step in the city.</li><li><b>Finished or white frame.</b> Comparing one to the other is how people convince themselves a building is cheap. Finishing runs $250–450 per m².</li><li><b>Whether the balcony is counted</b> in the quoted area. This alone moves the real rate 10–15%.</li><li><b>Floor and view</b> — and whether that view can be built out.</li><li><b>Handover date.</b> A 2029 delivery should cost materially less than a finished building.</li></ul>Normalise for all five before you decide anything is a bargain.",
       "<ul><li><b>الصف الأول مقابل الثاني.</b> أكبر قفزة مفردة في المدينة.</li><li><b>جاهز أم إطار أبيض.</b> ومقارنة أحدهما بالآخر هي كيف يقنع الناس أنفسهم بأن مبنى رخيص. والتشطيب يكلّف ٢٥٠–٤٥٠ دولاراً للمتر.</li><li><b>هل تُحتسب الشرفة</b> ضمن المساحة المذكورة. هذا وحده يحرّك السعر الحقيقي ١٠–١٥٪.</li><li><b>الطابق والإطلالة</b> — وهل يمكن حجب تلك الإطلالة.</li><li><b>تاريخ التسليم.</b> فتسليم ٢٠٢٩ يجب أن يكلّف أقل بوضوح من مبنى جاهز.</li></ul>وحّد هذه الخمسة قبل أن تقرّر أن شيئاً ما صفقة.","<ul><li><b>პირველი ხაზი მეორე ხაზთან შედარებით.</b> ყველაზე დიდი ერთჯერადი სხვაობა მთელ ქალაქში.</li><li><b>რემონტით თუ თეთრი კარკასი.</b> სწორედ ერთის მეორესთან შედარებით არწმუნებს ხალხი საკუთარ თავს, რომ შენობა იაფია. რემონტი $250–450 ჯდება მ²-ზე.</li><li><b>ითვლება თუ არა აივანი</b> მითითებულ ფართში. მარტო ეს რეალურ ფასს 10–15%-ით ცვლის.</li><li><b>სართული და ხედი</b> — და ის, შეიძლება თუ არა ეს ხედი მშენებლობამ ჩაკეტოს.</li><li><b>ჩაბარების თარიღი.</b> 2029 წელს ჩასაბარებელი ობიექტი მნიშვნელოვნად ნაკლები უნდა ღირდეს, ვიდრე დასრულებული შენობა.</li></ul>სანამ რამეს იაფად მიიჩნევთ, ხუთივე ფაქტორის მიხედვით გაათანაბრეთ შედარება."]}],
 cap: ["Apartments in Batumi average $1,395–1,500 per m². But first row vs second row, finished vs white frame, and whether the balcony is counted move that number far more than the district does. Five checks before you call anything cheap.",
       "متوسط الشقق في باتومي ١٣٩٥–١٥٠٠ دولار للمتر. لكن الصف الأول مقابل الثاني، والجاهز مقابل الإطار الأبيض، وهل تُحتسب الشرفة — كلها تحرّك الرقم أكثر من الحي نفسه. خمسة فحوص قبل أن تصف شيئاً بالرخيص.","ბათუმში ბინები საშუალოდ $1,395–1,500 ღირს მ²-ზე. მაგრამ პირველი ხაზი მეორე ხაზთან შედარებით, რემონტი თეთრ კარკასთან შედარებით და ის, ითვლება თუ არა აივანი, ამ ციფრს უბანზე გაცილებით მეტად ცვლის. ხუთი შემოწმება, სანამ რამეს იაფს დაარქმევთ."],
 tags: ["ApartmentsForSaleInBatumi","BatumiRealEstate","GeorgiaProperty","RealEstateInvestment","Batumi","PatroniGeorgia"]
},

{
 slug: "tbilisi-vs-batumi-which-to-buy",
 date: "2026-09-09", cat: "property", hero: "c_tbilisi",
 kw: "Tbilisi vs Batumi real estate",
 title: ["Tbilisi or Batumi? The buyer mix tells you everything",
         "تبليسي أم باتومي؟ هويّة المشترين تخبرك بكل شيء","თბილისი თუ ბათუმი? მყიდველთა შემადგენლობა ყველაფერს გეუბნებათ"],
 dek: ["Both average about $1,500 per square metre. Underneath, they are not the same market at all — and one statistic explains why.",
       "متوسط كلتيهما نحو ١٥٠٠ دولار للمتر. وتحت ذلك ليستا السوق نفسها إطلاقاً — وإحصائية واحدة تفسّر السبب.","ორივეგან საშუალო ფასი დაახლოებით $1,500-ია კვადრატულ მეტრზე. სიღრმეში კი ეს სულაც არ არის ერთი და იგივე ბაზარი — და რატომ, ამას ერთი სტატისტიკური მაჩვენებელი ხსნის."],
 body: [
  {h: ["The statistic", "الإحصائية","ეს მაჩვენებელი"],
   p: ["In <b>Tbilisi</b>, Georgians are about <b>90%</b> of buyers. In <b>Batumi</b>, Georgians are about <b>50%</b>, with Russians at 16% and Ukrainians at 9%.<br><br>So Tbilisi is a domestic housing market that foreigners also buy into. Batumi is an international investment market attached to a Georgian city. Everything else follows from that.",
       "في <b>تبليسي</b> يشكّل الجورجيون نحو <b>٩٠٪</b> من المشترين. وفي <b>باتومي</b> نحو <b>٥٠٪</b>، مع ١٦٪ روس و٩٪ أوكرانيين.<br><br>فتبليسي سوق سكن محلي يشتري فيها الأجانب أيضاً. وباتومي سوق استثمار دولي ملحق بمدينة جورجية. وكل ما عدا ذلك يتبع هذا.","<b>თბილისში</b> მყიდველთა დაახლოებით <b>90%</b> ქართველია. <b>ბათუმში</b> ქართველები დაახლოებით <b>50%</b>-ს შეადგენენ, რუსები — 16%-ს, უკრაინელები — 9%-ს.<br><br>ანუ თბილისი ადგილობრივი საცხოვრებელი ბაზარია, რომელშიც უცხოელებიც ყიდულობენ. ბათუმი კი საერთაშორისო საინვესტიციო ბაზარია, რომელიც ქართულ ქალაქს აკრავს. დანარჩენი ყველაფერი აქედან გამომდინარეობს."]},
  {h: ["Which suits which buyer", "أيّهما يناسب أي مشترٍ","რომელი ვის მიესადაგება"],
   p: ["<b>Batumi</b> if you want the highest rental yield and accept that it is seasonal; if you want a managed building you never visit; if you value the liquidity of a market doing 17,000 transactions a year.<br><br><b>Tbilisi</b> if you want rent arriving in January as well as August; if you prefer price stability to price growth; if you might live in Georgia yourself.<br><br><b>Both</b> if you are reaching the $150,000 residency threshold by combining two properties — splitting between a seasonal market and a year-round one is a better portfolio than two units in one building.",
       "<b>باتومي</b> إن أردت أعلى عائد إيجاري وقبلت أنه موسمي؛ أو أردت مبنى مُداراً لا تزوره؛ أو قدّرت سيولة سوق ينجز ١٧ ألف صفقة سنوياً.<br><br><b>تبليسي</b> إن أردت إيجاراً يصل في يناير كما في أغسطس؛ أو فضّلت ثبات السعر على نموّه؛ أو كنت قد تعيش في جورجيا بنفسك.<br><br><b>كلتاهما</b> إن كنت تبلغ حدّ الإقامة ١٥٠ ألف دولار بجمع عقارين — فالتوزيع بين سوق موسمية وأخرى على مدار السنة محفظة أفضل من وحدتين في مبنى واحد.","<b>ბათუმი</b> — თუ ყველაზე მაღალი საიჯარო შემოსავლიანობა გინდათ და ეთანხმებით, რომ ის სეზონურია; თუ გინდათ მართული შენობა, სადაც თავად არასდროს ჩახვალთ; თუ აფასებთ ბაზრის ლიკვიდურობას, რომელიც წელიწადში 17,000 გარიგებას აკეთებს.<br><br><b>თბილისი</b> — თუ გინდათ, რომ ქირა აგვისტოსავით იანვარშიც შემოდიოდეს; თუ ფასის ზრდას ფასის სტაბილურობას ამჯობინებთ; თუ დაშვებულია, რომ თავად იცხოვროთ საქართველოში.<br><br><b>ორივე</b> — თუ $150,000-იან ბინადრობის ზღვარს ორი ქონების შეჯამებით აღწევთ: სეზონურ და მთელი წლის მანძილზე მომუშავე ბაზრებს შორის გადანაწილება უკეთესი პორტფელია, ვიდრე ორი ბინა ერთსა და იმავე შენობაში."]}],
 cap: ["Tbilisi and Batumi both average about $1,500/m². But 90% of Tbilisi buyers are Georgian, against 50% in Batumi. One is a domestic housing market; the other is an international investment market. That decides which one suits you.",
       "متوسط تبليسي وباتومي نحو ١٥٠٠ دولار للمتر. لكن ٩٠٪ من مشتري تبليسي جورجيون مقابل ٥٠٪ في باتومي. إحداهما سوق سكن محلي والأخرى سوق استثمار دولي. وهذا يحدّد أيّهما يناسبك.","თბილისშიც და ბათუმშიც საშუალო ფასი დაახლოებით $1,500/მ²-ია. მაგრამ თბილისში მყიდველთა 90% ქართველია, ბათუმში კი — 50%. ერთი ადგილობრივი საცხოვრებელი ბაზარია, მეორე — საერთაშორისო საინვესტიციო. სწორედ ეს წყვეტს, რომელი მოგერგებათ."],
 tags: ["TbilisiRealEstate","BatumiRealEstate","GeorgiaProperty","PropertyInvestment","Georgia","PatroniGeorgia"]
},

{
 slug: "can-foreigners-buy-property-in-georgia",
 date: "2026-09-08", cat: "property", hero: "c_gonio",
 kw: "can foreigners buy property in Georgia",
 title: ["Yes, foreigners can buy property in Georgia — with one exception",
         "نعم، يستطيع الأجانب الشراء في جورجيا — باستثناء واحد","დიახ, უცხოელებს შეუძლიათ საქართველოში უძრავი ქონების ყიდვა — ერთი გამონაკლისით"],
 dek: ["Freehold, in your own name, no visa and no residency required. The exception is agricultural land, and it catches people out in one specific way.",
       "ملكية حرّة باسمك، دون تأشيرة ودون إقامة. والاستثناء هو الأراضي الزراعية، وهو يوقع الناس بطريقة واحدة محددة.","სრული საკუთრება, საკუთარ სახელზე, ვიზისა და ბინადრობის გარეშე. გამონაკლისი სასოფლო-სამეურნეო მიწაა და ხალხი მასში ერთი კონკრეტული ფორმით ებმევა."],
 body: [
  {h: ["What you can buy", "ما يمكنك شراؤه","რის ყიდვა შეგიძლიათ"],
   p: ["Apartments, houses, offices, shops and hotel units — <b>freehold</b>, the building and the land under it, indefinitely, in your own name. No visa, no residence permit, no local partner. A valid passport is enough to sign and register, and registration is often same-day.",
       "الشقق والمنازل والمكاتب والمحلات والوحدات الفندقية — <b>ملكاً حراً</b>، المبنى والأرض تحته، إلى أجل غير مسمّى وباسمك. دون تأشيرة ولا تصريح إقامة ولا شريك محلي. وجواز سفر ساري يكفي للتوقيع والتسجيل، والتسجيل غالباً في اليوم نفسه.","ბინები, სახლები, ოფისები, მაღაზიები და სასტუმროს ნომრები — <b>სრული საკუთრება</b>, შენობა და მის ქვეშ არსებული მიწა, უვადოდ, თქვენს საკუთარ სახელზე. ვიზის, ბინადრობის ნებართვისა და ადგილობრივი პარტნიორის გარეშე. ხელმოწერისა და რეგისტრაციისთვის საკმარისია მოქმედი პასპორტი, რეგისტრაცია კი ხშირად იმავე დღეს ხდება."]},
  {h: ["The exception, and the trap inside it", "الاستثناء والفخّ داخله","გამონაკლისი და მასში ჩამალული ხაფანგი"],
   p: ["Foreign citizens cannot acquire <b>agricultural land</b>. That matters more than it sounds, because a village house with a big garden may have its yard registered as agricultural even though the house is residential.<br><br>If land is attached to what you are buying, read the Public Registry extract and check the registered <b>designation</b> — not the agent's description of it. An apartment in a building has no such problem.",
       "لا يستطيع المواطنون الأجانب تملّك <b>الأراضي الزراعية</b>. وهذا أهم مما يبدو، لأن بيتاً في قرية بحديقة كبيرة قد يكون فناؤه مسجّلاً كأرض زراعية رغم أن البيت سكني.<br><br>وإن كانت هناك أرض تتبع ما تشتريه، فاقرأ مستخرج السجل العام وتحقّق من <b>التصنيف</b> المسجّل — لا من وصف الوسيط. أما الشقة داخل بناية فلا تواجه هذه المشكلة.","უცხო ქვეყნის მოქალაქეებს არ შეუძლიათ <b>სასოფლო-სამეურნეო მიწის</b> შეძენა. ამას იმაზე მეტი მნიშვნელობა აქვს, ვიდრე ჟღერს, რადგან დიდეზოიან სოფლის სახლს ეზო შეიძლება სასოფლო-სამეურნეო მიწად ჰქონდეს რეგისტრირებული, თუმცა თავად სახლი საცხოვრებელია.<br><br>თუ იმას, რასაც ყიდულობთ, მიწა ახლავს, წაიკითხეთ საჯარო რეესტრის ამონაწერი და შეამოწმეთ რეგისტრირებული <b>დანიშნულება</b> — და არა ის, როგორ აღწერს მას სააგენტო. შენობაში მდებარე ბინას ასეთი პრობლემა არ აქვს."]},
  {h: ["The taxes, briefly", "الضرائب باختصار","გადასახადები, მოკლედ"],
   p: ["Rental income <b>5%</b> for individuals. Capital gains <b>zero</b> after two years of ownership. <b>No inheritance tax.</b> No separate purchase or transfer tax for the buyer — just a small registration fee. None of this is tax advice; your own position depends on where you are resident.",
       "دخل الإيجار <b>٥٪</b> للأفراد. والأرباح الرأسمالية <b>صفر</b> بعد سنتين من التملّك. و<b>لا ضريبة ميراث</b>. ولا ضريبة شراء أو نقل منفصلة على المشتري — فقط رسم تسجيل صغير. ولا شيء من هذا استشارة ضريبية، ووضعك يعتمد على مكان إقامتك.","საიჯარო შემოსავალი ფიზიკური პირებისთვის — <b>5%</b>. კაპიტალის ნამატი ორწლიანი მფლობელობის შემდეგ — <b>ნული</b>. <b>მემკვიდრეობის გადასახადი არ არსებობს.</b> მყიდველისთვის ცალკე ყიდვის ან გადაცემის გადასახადი არ არის — მხოლოდ მცირე სარეგისტრაციო მოსაკრებელი. არცერთი ეს ინფორმაცია საგადასახადო რჩევა არ არის; თქვენი კონკრეტული მდგომარეობა დამოკიდებულია იმაზე, სად ხართ რეზიდენტი."]}],
 cap: ["Foreigners buy property in Georgia freehold, in their own name, with no visa and no residency — registration is often same-day. The one exception is agricultural land, and a village house with a big garden can quietly be exactly that. Check the registry designation before you sign.",
       "يشتري الأجانب العقارات في جورجيا ملكاً حراً وباسمهم، دون تأشيرة ودون إقامة — والتسجيل غالباً في اليوم نفسه. والاستثناء الوحيد هو الأراضي الزراعية، وبيت القرية بحديقة كبيرة قد يكون كذلك بهدوء. تحقّق من تصنيف السجل قبل التوقيع.","უცხოელები საქართველოში უძრავ ქონებას სრულ საკუთრებაში, საკუთარ სახელზე ყიდულობენ, ვიზისა და ბინადრობის გარეშე — რეგისტრაცია ხშირად იმავე დღეს ხდება. ერთადერთი გამონაკლისი სასოფლო-სამეურნეო მიწაა და დიდეზოიანი სოფლის სახლი შეუმჩნევლად სწორედ ეს შეიძლება აღმოჩნდეს. ხელმოწერამდე შეამოწმეთ რეესტრში მითითებული დანიშნულება."],
 tags: ["GeorgiaRealEstate","BuyPropertyInGeorgia","PropertyInGeorgia","Batumi","Tbilisi","PatroniGeorgia"]
},

{
 slug: "best-day-trips-from-tbilisi",
 date: "2026-09-07", cat: "travel", hero: "c_mtskheta",
 kw: "day trips from Tbilisi",
 title: ["The best day trips from Tbilisi — and the one not to attempt",
         "أفضل رحلات اليوم من تبليسي — والرحلة التي لا تحاولها","საუკეთესო ერთდღიანი ექსკურსიები თბილისიდან — და ერთი, რომელსაც არ უნდა შეეცადოთ"],
 dek: ["Mtskheta in half a day, Kakheti in a full one, Ananuri and Gudauri if you leave early. And Kazbegi, which everybody sells as a day trip and nobody should book as one.",
       "متسخيتا في نصف يوم، وكاخيتي في يوم كامل، وأنانوري وغوداوري إن خرجت مبكراً. وكازبيغي التي يبيعها الجميع كرحلة يوم ولا ينبغي لأحد حجزها كذلك.","მცხეთა ნახევარ დღეში, კახეთი მთელ დღეში, ანანური და გუდაური — თუ ადრე გახვალთ. და ყაზბეგი, რომელსაც ყველა ერთდღიან ექსკურსიად ყიდის და რომელიც ასე არავინ უნდა დაჯავშნოს."],
 body: [
  {h: ["Mtskheta — half a day, best value in Georgia", "متسخيتا — نصف يوم وأفضل قيمة في جورجيا","მცხეთა — ნახევარი დღე, საუკეთესო ღირებულება საქართველოში"],
   p: ["Twenty minutes out. The old capital, Svetitskhoveli Cathedral, and Jvari Monastery on the hill above where two rivers meet. You are back in Tbilisi for lunch, and nothing else in the country gives you this much for this little travelling.",
       "على بُعد عشرين دقيقة. العاصمة القديمة وكاتدرائية سفيتيتسخوفيلي ودير جفاري على التلة فوق ملتقى نهرين. تعود إلى تبليسي للغداء، ولا شيء آخر في البلاد يمنحك هذا القدر مقابل هذا السفر القليل.","ოცი წუთის სავალზე. ძველი დედაქალაქი, სვეტიცხოვლის საკათედრო ტაძარი და ჯვრის მონასტერი გორაზე, რომლის ქვემოთაც ორი მდინარე ერთმანეთს ერწყმის. სადილისთვის უკვე თბილისში ხართ და ქვეყანაში სხვა არაფერი გაძლევთ ამდენს ასეთი მცირე გზის სანაცვლოდ."]},
  {h: ["Kakheti — and one thing that decides the day", "كاخيتي — وأمر واحد يقرّر اليوم","კახეთი — და ერთი რამ, რაც მთელ დღეს წყვეტს"],
   p: ["Ninety minutes east: Sighnaghi on its ridge, Bodbe monastery, and as many wineries as you have appetite for.<br><br><b>Call the wineries in advance.</b> The small family qvevri producers will sit you down, open several bottles and talk for two hours. Walk in without a booking and you get the room they keep for people who walk in without a booking. And if you are drinking, take a driver.",
       "تسعون دقيقة شرقاً: سيغناغي على تلّتها ودير بودبي ومن المعاصر بقدر ما تحتمل.<br><br><b>اتصل بالمعاصر مسبقاً.</b> فمنتجو القفيري العائليون الصغار سيجلسونك ويفتحون عدة زجاجات ويتحدثون ساعتين. وإن دخلت دون حجز فستُعطى الغرفة المخصصة لمن يدخل دون حجز. وإن كنت ستشرب فخذ سائقاً.","ოთხმოცდაათი წუთი აღმოსავლეთით: სიღნაღი თავის ქედზე, ბოდბის მონასტერი და იმდენი მარანი, რამდენზეც მადა გეყოფათ.<br><br><b>მარნებს წინასწარ დაურეკეთ.</b> პატარა ოჯახური ქვევრის მწარმოებლები დაგსხამენ, რამდენიმე ბოთლს გაგიხსნიან და ორ საათს გესაუბრებიან. ჯავშნის გარეშე რომ მიხვიდეთ, იმ ოთახში მიგიღებენ, რომელსაც ჯავშნის გარეშე მოსულებისთვის ინახავენ. და თუ სვამთ, მძღოლი აიყვანეთ."]},
  {h: ["Kazbegi is not a day trip", "كازبيغي ليست رحلة يوم","ყაზბეგი ერთდღიანი ექსკურსია არ არის"],
   p: ["155 km on a mountain road, three hours or more each way, plus the transfer up to Gergeti Trinity Church. That is six to seven hours of travel for perhaps two hours at 2,170 m, in the flat light of the middle of the day.<br><br><b>Stay one night in Stepantsminda.</b> You get the church in late-afternoon light and again at sunrise, which is when Kazbek is most likely to be clear of cloud. That is the difference between seeing it and photographing it.",
       "١٥٥ كم على طريق جبلي، ثلاث ساعات أو أكثر في كل اتجاه، إضافةً إلى الانتقال صعوداً إلى كنيسة غيرغيتي الثالوث. أي ست إلى سبع ساعات سفر مقابل ساعتين ربما على ارتفاع ٢١٧٠ متراً، في ضوء وسط النهار المسطّح.<br><br><b>بِت ليلة في ستيفانتسميندا.</b> فتحصل على الكنيسة في ضوء العصر ثم عند الشروق، وهو الوقت الذي يُرجَّح أن يكون فيه كازبيك صافياً من الغيم. وهذا هو الفرق بين أن تراه وأن تصوّره.","155 კმ მთის გზაზე, სამი საათი ან მეტი თითოეული მიმართულებით, პლუს ატანა გერგეტის სამების ტაძრამდე. ეს ექვსიდან შვიდ საათამდე გზაა იმისთვის, რომ, სავარაუდოდ, ორი საათი გაატაროთ 2,170 მ სიმაღლეზე, დღის შუა პერიოდის ბრტყელ განათებაზე.<br><br><b>ერთი ღამე სტეფანწმინდაში გაათიეთ.</b> ტაძარს გვიანი შუადღის შუქზე ნახავთ და მერე კიდევ ერთხელ — მზის ამოსვლისას, როცა მყინვარწვერი ყველაზე დიდი ალბათობით ღრუბლებისგან თავისუფალია. სწორედ ეს არის სხვაობა იმას შორის, ნახავთ თუ გადაიღებთ."]}],
 cap: ["Mtskheta is half a day and the best value in Georgia. Kakheti is a full day — call the wineries first, and take a driver if you are drinking. Kazbegi is six hours of driving for two hours on the mountain: stay the night instead.",

const t=k=>T[k]?(T[k][li()]||T[k][0]):k;
const waLink=x=>`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(x)}`;
/* Telegram cannot carry a pre-filled message to a phone number, only to a
   username, so the button opens the chat and copies the text to the clipboard
   for the visitor to paste. */
const tgLink=()=>`https://t.me/+${TELEGRAM_NUMBER}`;
function tgOpen(text){
  if(text){ try{ navigator.clipboard && navigator.clipboard.writeText(text); }catch(e){} }
  try{ window.open(tgLink(),"_blank","noopener"); }catch(e){ location.href=tgLink(); }
}
function waOpen(text){
  let w=null; try{ w=window.open(waLink(text),"_blank","noopener"); }catch(e){}
  if(!w||w.closed||typeof w.closed==="undefined") showWaModal(text);
}
function showWaModal(text){
  $("#mtext").value=text; $("#mopen").href=waLink(text);
  $("#mnum").href="https://wa.me/"+WHATSAPP_NUMBER;
  $("#mnum").textContent=WA_DISPLAY;      /* openMap borrows this line for its own link */
  const c=$("#mcopy"); c.classList.remove("copied"); c.textContent=t("mCopy");
  $("#modal").hidden=false; $("#mopen").focus();
}

/* ---------- artwork ---------- */
const SKY={heritage:["#241E19","#3A2F24"],tower:["#1B2933","#2E4450"],growth:["#1A2620","#2A3E34"],
  capital:["#26201B","#3E3226"],hotel:["#1E2A33","#2C3A44"],balcony:["#20303A","#31454F"],
  city:["#26212B","#3A3040"],sea:["#152C38","#245063"],mountain:["#1B2630","#33404C"],
  church:["#2A2620","#3E3830"],vine:["#22281C","#37402C"],forest:["#1A241C","#2A3A2C"],cave:["#221E28","#352E3D"]};
function art(kind,w,h){
  const c=SKY[kind]||SKY.city, g="g"+Math.random().toString(36).slice(2,8);
  const dk="#0E0C09", md="rgba(217,174,98,.28)";
  let s=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs>
   <rect width="${w}" height="${h}" fill="url(#${g})"/>
   <circle cx="${w*0.80}" cy="${h*0.24}" r="${h*0.10}" fill="#D9AE62" opacity=".24"/>`;
  if(kind==="heritage"){
    s+=`<rect x="${w*0.13}" y="${h*0.32}" width="${w*0.74}" height="${h*0.68}" fill="${dk}" opacity=".86"/>`;
    for(let i=0;i<7;i++){const x=w*(0.18+i*0.095);
      s+=`<path d="M${x} ${h*0.64} a ${w*0.023} ${w*0.023} 0 0 1 ${w*0.046} 0 L${x+w*0.046} ${h*0.88} L${x} ${h*0.88} Z" fill="${md}"/>`;}
    s+=`<rect x="${w*0.13}" y="${h*0.27}" width="${w*0.74}" height="${h*0.05}" fill="${md}"/>`;
  } else if(kind==="growth"){
    let d=`M0 ${h*0.93}`; for(let i=1;i<=12;i++) d+=` L${w*i/12} ${h*(0.93-i*0.060)}`;
    s+=`<path d="${d} L${w} ${h} L0 ${h} Z" fill="${dk}" opacity=".7"/><path d="${d}" fill="none" stroke="#D9AE62" stroke-width="2.6" opacity=".9"/>`;
    for(let i=1;i<=12;i++) s+=`<circle cx="${w*i/12}" cy="${h*(0.93-i*0.060)}" r="3" fill="#F0D194"/>`;
  } else if(kind==="sea"){
    const bh=h*0.62;
    s+=`<path d="M0 ${bh} Q ${w*0.25} ${bh-12} ${w*0.5} ${bh} T ${w} ${bh} L ${w} ${h} L 0 ${h} Z" fill="${dk}" opacity=".7"/>`;
    for(let i=0;i<4;i++) s+=`<rect x="${w*(0.06+i*0.24)}" y="${h*0.26}" width="${w*0.05}" height="${h*0.38}" fill="${dk}" opacity=".8"/>`;
  } else if(kind==="mountain"||kind==="forest"||kind==="cave"){
    s+=`<path d="M0 ${h} L ${w*0.24} ${h*0.30} L ${w*0.44} ${h*0.66} L ${w*0.64} ${h*0.22} L ${w} ${h} Z" fill="${dk}" opacity=".82"/>
        <path d="M${w*0.18} ${h*0.42} L ${w*0.24} ${h*0.30} L ${w*0.30} ${h*0.42} Z" fill="#E8E2D6" opacity=".5"/>
        <path d="M${w*0.58} ${h*0.34} L ${w*0.64} ${h*0.22} L ${w*0.70} ${h*0.34} Z" fill="#E8E2D6" opacity=".5"/>`;
  } else if(kind==="church"||kind==="hotel"){
    s+=`<rect x="${w*0.30}" y="${h*0.42}" width="${w*0.40}" height="${h*0.58}" fill="${dk}" opacity=".85"/>
        <path d="M${w*0.42} ${h*0.42} L ${w*0.50} ${h*0.20} L ${w*0.58} ${h*0.42} Z" fill="${dk}" opacity=".9"/>
        <rect x="${w*0.38}" y="${h*0.58}" width="${w*0.06}" height="${h*0.14}" fill="${md}"/>
        <rect x="${w*0.56}" y="${h*0.58}" width="${w*0.06}" height="${h*0.14}" fill="${md}"/>`;
  } else if(kind==="vine"){
    s+=`<path d="M0 ${h} L${w*0.3} ${h*0.52} L${w*0.6} ${h*0.72} L${w} ${h*0.46} L${w} ${h} Z" fill="${dk}" opacity=".8"/>`;
    for(let i=0;i<6;i++) s+=`<circle cx="${w*(0.1+i*0.16)}" cy="${h*0.80}" r="${h*0.045}" fill="${md}"/>`;
  } else if(kind==="capital"){
    s+=`<path d="M0 ${h} L${w*0.22} ${h*0.42} L${w*0.40} ${h*0.68} L${w*0.60} ${h*0.32} L${w*0.80} ${h*0.62} L${w} ${h*0.46} L${w} ${h} Z" fill="${dk}" opacity=".82"/>`;
    for(let i=0;i<8;i++) s+=`<rect x="${w*(0.07+i*0.115)}" y="${h*0.72}" width="${w*0.03}" height="${h*0.28}" fill="${md}"/>`;
  } else {
    for(let i=0;i<9;i++){const bw=w/9,x=i*bw,ht=h*(0.22+((i*37)%10)/22);
      s+=`<rect x="${x+2}" y="${h-ht}" width="${bw-4}" height="${ht}" fill="${dk}" opacity=".82"/>`;
      s+=`<rect x="${x+bw*0.28}" y="${h-ht+8}" width="${bw*0.16}" height="${bw*0.16}" fill="${md}"/>`;}
  }
  return s+"</svg>";
}
const visual=(p,w,h)=>p.hero&&IMG[p.hero]?`<img src="${IMG[p.hero]}" alt="">`:art(p.art,w,h);

function calcMsgText(){
  const n=$("#lname")?$("#lname").value.trim():"", num=$("#lnum")?$("#lnum").value.trim():"";
  return `${t("calcMsg")}\n\n${n?n+" — ":""}${num}\n${t("lPrice")}: ${money(+$("#price").value)}`
    + `\n${t("sGross")}: ${$("#oGross").textContent}\n${t("sApp")}: ${$("#oApp").textContent}`
    + `\n${t("sTot")}: ${$("#oTot").textContent}`;
}
function calc(){
  if(!$("#price")) return;
  const price=+$("#price").value||0, rentRaw=+$("#rent").value||0;
  /* one rent figure only. Management, vacancy and service charges are not
     collected any more, so every number below is a BEFORE-COSTS number and is
     labelled as one — nothing here is presented as a net return. */
  const gross=rentPeriod==="m"?rentRaw*12:rentRaw;
  const appR=(+$("#appr").value||0)/100;
  calcPrice=price;
  $("#oGross").textContent=price?(gross/price*100).toFixed(1)+"%":"—";
  $("#oApp").textContent=money(price*appR);
  $("#oBack").textContent=gross>0?Math.round(price/gross)+" "+t("yrs"):"—";
  const rf=$("#resFlag"), ok=price>=150000;
  rf.className="note "+(ok?"ok":"warn");
  rf.innerHTML=`<b>${ok?t("resYes"):t("resNo")}</b>${ok?t("resYesP"):t("resNoP")}`;
  const rows=[5,10,15,20].map(y=>({y, rent:gross*y, app:price*(Math.pow(1+appR,y)-1)}));
  $("#oTot").textContent=money(rows[0].rent+rows[0].app);
  drawChart(rows);
  $("#tbody").innerHTML=rows.map(r=>`<tr><td>${r.y}</td><td>${money(r.rent)}</td><td>${money(r.app)}</td><td>${money(r.rent+r.app)}</td></tr>`).join("");
}
const niceStep=x=>{const p=Math.pow(10,Math.floor(Math.log10(x||1))),n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;};
const shortMoney=v=>v>=1000?"$"+Math.round(v/1000)+"k":"$"+Math.round(v);
function drawChart(rows){
  const svg=$("#chart"); if(!svg) return;
  const box=svg.getBoundingClientRect();
  const W=Math.max(330,box.width||600), H=245;
  const ml=isAr()?14:58, mr=isAr()?58:14, mt=26, mb=34;
  const pl=W-ml-mr, ph=H-mt-mb;
  const max=Math.max(...rows.map(r=>r.rent+r.app),1);
  const step=niceStep(max/4), top=step*Math.ceil(max/step);
  const bw=Math.min(62, pl/rows.length*0.52);
  const cx=i=>ml+pl*((i+0.5)/rows.length), yy=v=>mt+ph-(v/top)*ph;
  const cs=getComputedStyle(document.documentElement);
  const c1=cs.getPropertyValue("--s1").trim(), c2=cs.getPropertyValue("--s2").trim();
  const ink3=cs.getPropertyValue("--ink-3").trim(), line=cs.getPropertyValue("--line").trim();
  const ink=cs.getPropertyValue("--ink-2").trim();
  let s=`<title>Projection</title>`;
  for(let v=0; v<=top+1; v+=step){
    s+=`<line x1="${ml}" y1="${yy(v)}" x2="${W-mr}" y2="${yy(v)}" stroke="${line}" stroke-width="1"/>`;
    s+=`<text x="${isAr()?W-mr+9:ml-9}" y="${yy(v)+4}" fill="${ink3}" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="${isAr()?"start":"end"}">${shortMoney(v)}</text>`;
  }
  rows.forEach((r,i)=>{
    const x=cx(i)-bw/2, hR=(r.rent/top)*ph, hA=(r.app/top)*ph;
    const yR=mt+ph-hR, yA=yR-hA-2;
    s+=`<rect x="${x}" y="${yR}" width="${bw}" height="${Math.max(0,hR)}" fill="${c1}" class="seg"/>`;
    s+=`<rect x="${x}" y="${yA}" width="${bw}" height="${Math.max(0,hA)}" fill="${c2}" rx="4" class="seg"/>`;
    s+=`<rect x="${x}" y="${yA+Math.max(0,hA)-4}" width="${bw}" height="4" fill="${c2}" class="seg"/>`;
    s+=`<text x="${cx(i)}" y="${yA-9}" fill="${ink}" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace" text-anchor="middle">${shortMoney(r.rent+r.app)}</text>`;
    s+=`<text x="${cx(i)}" y="${H-13}" fill="${ink3}" font-size="12" text-anchor="middle">${r.y} ${t("yrs")}</text>`;
    s+=`<rect x="${cx(i)-pl/rows.length/2}" y="${mt}" width="${pl/rows.length}" height="${ph}" fill="transparent" data-hit="${i}"/>`;
  });
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=s;
  const tip=$("#tip");
  svg.querySelectorAll("[data-hit]").forEach(h=>{
    h.addEventListener("mouseenter",()=>{ const r=rows[+h.dataset.hit];
      tip.innerHTML=`<div class="t">${r.y} ${t("yrs")}</div>
        <div class="r"><span>${t("legRent")}</span><span>${money(r.rent)}</span></div>
        <div class="r"><span>${t("legApp")}</span><span>${money(r.app)}</span></div>`;
      tip.style.opacity=1; });
    h.addEventListener("mousemove",e=>{ const b=svg.parentElement.getBoundingClientRect();
      let x=e.clientX-b.left+14,y=e.clientY-b.top-10;
      if(x>b.width-190) x-=200; tip.style.left=x+"px"; tip.style.top=Math.max(0,y)+"px"; });
    h.addEventListener("mouseleave",()=>tip.style.opacity=0);
  });
}
