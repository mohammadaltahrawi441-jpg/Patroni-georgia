<style>
:root{
  --bg:#F1F3F6;--panel:#FFFFFF;--panel-2:#F7F9FB;--panel-3:#EAEFF4;
  --line:#DDE3E9;--line-2:#C3CCD5;
  --gold:#0A5FB4;--gold-2:#0B4E93;--gold-dim:#6E7C8A;--gold-ghost:#EAF2FB;
  --yl:#FFE500;--yl-2:#FFEC57;--on-yl:#16232E;
  --ink:#16232E;--ink-2:#4A5866;--ink-3:#7C8894;
  --good:#1B8A4B;--good-bg:#E9F7EF;--good-line:#A8DCC1;
  --warn:#8A5B00;--warn-bg:#FFF6E0;
  --bad:#C4362F;--bad-bg:#FCEDEC;--bad-line:#F2C2BE;
  --s1:#0A5FB4;--s2:#C98A00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app[dir="rtl"]{font-family:"Tajawal",sans-serif}
/* Georgian: Mkhedruli has no small caps and no italic, and Marcellus carries no
   Georgian glyphs at all — so headings switch face rather than fall back to a
   system serif that would render half the page in a different colour of black. */
.app[lang="ka"]{font-family:"Noto Sans Georgian","Manrope",sans-serif}
.app[lang="ka"] h1,.app[lang="ka"] h2,.app[lang="ka"] h3,.app[lang="ka"] .brand-name,
.app[lang="ka"] th,.app[lang="ka"] caption,.app[lang="ka"] .pull,.app[lang="ka"] .figure figcaption{
  font-family:"Noto Sans Georgian",sans-serif;font-weight:700;letter-spacing:0}
.app[lang="ka"] .eyebrow,.app[lang="ka"] .mkicker,.app[lang="ka"] .mstate,
.app[lang="ka"] .st .k,.app[lang="ka"] .stat .k,.app[lang="ka"] .attx-t span{
  font-family:"Noto Sans Georgian",sans-serif;letter-spacing:.02em}
/* Turkish sits in Latin Extended — Manrope and Marcellus both carry ı ğ ş İ,
   so nothing switches; only the dotted/dotless i casing rule matters. */
.app[lang="tr"]{font-variant-ligatures:none}
select.btn-s{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%234A5866' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center}
.app[dir="rtl"] select.btn-s{padding-right:11px;padding-left:26px;background-position:left 9px center}
.app[dir="rtl"] h1,.app[dir="rtl"] h2,.app[dir="rtl"] h3,.app[dir="rtl"] .brand-name{font-family:"Tajawal",sans-serif;font-weight:800}
h1,h2,h3{font-family:"Marcellus",Georgia,serif;font-weight:400;margin:0;text-wrap:balance;line-height:1.16}
p{margin:0 0 16px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
input,select,textarea{font:inherit}
a{color:var(--gold);text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app[dir="rtl"] .num{text-align:right}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hb{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
/* On a phone the WhatsApp and Telegram labels made the header wider than the
   viewport, which scrolled the whole site sideways. Icons only below 640px. */
@media(max-width:640px){
  .hb{gap:8px;padding:10px 14px;flex-wrap:wrap}
  .hb .wa span,.hb .tg span{display:none}
  .hb .wa,.hb .tg{padding:9px 11px}
  .hb .brand-name{font-size:15px}
}
.logo{width:30px;height:30px;flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand-name{font-family:"Marcellus",serif;font-size:17px;color:var(--gold);line-height:1.12}
.brand-name small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.17em;color:var(--ink-3);text-transform:uppercase}
.app[dir="rtl"] .brand-name small{font-family:"Tajawal",sans-serif;letter-spacing:0;font-size:10.5px}
nav{display:flex;gap:4px}
nav button{padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav button:hover{color:var(--gold);background:var(--panel-2)}
nav button[aria-current="page"]{color:var(--gold);background:var(--gold-ghost)}
.btn-s{border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);flex:none}
.btn-s:hover{border-color:var(--gold);color:var(--gold)}
.wa{display:inline-flex;align-items:center;gap:8px;background:var(--yl);color:var(--on-yl);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;flex:none}
.wa:hover{background:var(--yl-2)}
.wa svg{width:16px;height:16px;flex:none}
@media(max-width:1040px){nav{display:none}}
.mnav{display:none;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
.mnav div{display:flex;gap:2px;padding:7px 14px}
.mnav button{padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.mnav button[aria-current="page"]{color:var(--gold);background:var(--gold-ghost)}
@media(max-width:1040px){.mnav{display:block}}

/* ---------- shared bits ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:11px}
.app[dir="rtl"] .eyebrow{font-family:"Tajawal",sans-serif;letter-spacing:.04em}
h1.big{font-size:clamp(31px,5.6vw,52px);margin-bottom:13px}
.dek{font-size:clamp(17px,2.2vw,20px);color:var(--ink-2);max-width:60ch;margin:0}
h2.sec{font-size:clamp(23px,3.2vw,31px);margin:44px 0 8px;padding-top:26px;border-top:1px solid var(--line)}
.sub{color:var(--ink-3);margin:0 0 20px;max-width:66ch;font-size:14.5px}
.btn-gold{background:var(--yl);color:var(--on-yl);font-weight:700;border-radius:10px;padding:12px 24px;font-size:15px}
.btn-gold:hover{background:var(--yl-2)}
.btn-line{border:1px solid var(--line-2);border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:center}
.btn-line:hover{border-color:var(--gold);color:var(--gold)}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:rgba(14,12,9,.82);border:1px solid var(--line-2);color:var(--ink-2);backdrop-filter:blur(4px)}
.tag.dev{background:var(--yl);border-color:var(--yl);color:var(--on-yl)}
.tag.real{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.tag.res{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.tag.resv{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.tag.feat{background:var(--yl);border-color:var(--yl);color:var(--on-yl)}
.note{border-radius:12px;padding:16px 19px;margin:24px 0;max-width:40em;font-size:15.5px;line-height:1.62}
.note b{display:block;margin-bottom:4px;font-size:16px}
.note.ok{background:var(--good-bg);border:1px solid var(--good-line);color:var(--good)}
.note.warn{background:var(--warn-bg);border:1px solid var(--gold-dim);color:var(--warn)}
.note.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:24px 0 6px}
table{border-collapse:collapse;width:100%;min-width:620px}
caption{text-align:start;padding:15px 18px 7px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.app[dir="rtl"] caption{font-family:"Tajawal",sans-serif;letter-spacing:0}
th,td{padding:11px 18px;text-align:start;border-top:1px solid var(--line);font-size:14.5px}
th{color:var(--ink-3);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;font-family:"Manrope",sans-serif}
.app[dir="rtl"] th{font-family:"Tajawal",sans-serif}
tr.click{cursor:pointer}
tr.click:hover{background:var(--panel-2)}
tr.click:hover td:first-child b{color:var(--gold)}
td b{color:var(--ink);font-weight:700}
.yes{color:var(--good);font-weight:700}.no{color:var(--warn);font-weight:700}

/* ---------- home hero ---------- */
.hero{padding:52px 0 34px;position:relative;overflow:hidden;text-align:center}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 0%,rgba(10,95,180,.07),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px}
.dek2{font-size:15.5px;color:var(--ink3);max-width:62ch;margin:-4px 0 2px}
.herocta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.hbtn{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;
      padding:13px 24px;border-radius:999px;background:var(--gold);color:#16232E}
.hbtn.alt{background:var(--blue,#0A5FB4);color:#fff}
.hbtn:hover{filter:brightness(.95)}
.search{width:100%;max-width:700px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 6px 17px;text-align:start}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:15px}
.tab{flex:1;padding:13px 8px;font-size:14.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.srow{display:flex;gap:10px;padding:0 12px;flex-wrap:wrap}
.field{flex:1 1 210px;display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 13px}
.field input,.field select{background:none;border:none;color:var(--ink);padding:12px 0;width:100%;outline:none;font-size:14.5px}
.field select option{background:var(--panel-2);color:var(--ink)}
.field .ic{color:var(--ink-3);flex:none}
.why{margin:6px 0 40px;padding:30px 26px;background:linear-gradient(160deg,var(--panel),var(--bg));border:1px solid var(--line);border-radius:18px}
.why-h{font-size:clamp(23px,3.4vw,34px);line-height:1.18;letter-spacing:-.02em;margin:0 0 12px;max-width:20ch}
.why-lede{color:var(--ink-2);font-size:16px;line-height:1.65;max-width:62ch;margin:0 0 26px}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.why-i{background:var(--bg);padding:22px 20px 24px}
.why-i h3{font-size:16.5px;margin:9px 0 8px;letter-spacing:-.01em}
.why-i p{color:var(--ink-2);font-size:14.4px;line-height:1.68;margin:0}
.why-i p b{color:var(--ink);font-weight:700}
.why-n{font-family:"IBM Plex Mono","Tajawal","Noto Sans Georgian",monospace;font-size:11px;letter-spacing:.18em;color:var(--gold-dim);direction:ltr;unicode-bidi:isolate}
.why-i.warn{background:var(--bad-bg)}
.why-i.warn .why-n{color:var(--bad)}
.why-i .btn-line.sm{margin-top:14px;padding:7px 13px;font-size:12.5px;display:inline-block}
.why-close{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.why-close p{color:var(--ink-2);font-size:15px;line-height:1.6;max-width:58ch;margin:0}
.asof{border:1px solid var(--line-2);border-left:3px solid var(--gold-dim);border-radius:10px;padding:14px 17px;margin:22px 0;color:var(--ink-3);font-size:13.6px;line-height:1.62}
.app[dir="rtl"] .asof{border-left:1px solid var(--line-2);border-right:3px solid var(--gold-dim)}
.asof b{color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:28px}
.mag{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mcover{position:relative;aspect-ratio:5/7;background:var(--panel-2);overflow:hidden}
.mcover svg{width:100%;height:100%;object-fit:cover}
.mcover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,9,.25) 0%,rgba(14,12,9,.55) 45%,rgba(14,12,9,.95) 100%)}
.mcover-in{position:absolute;inset-inline:0;bottom:0;z-index:2;padding:22px 22px 24px;display:flex;flex-direction:column;gap:9px}
.mkicker{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold)}
.app[dir="rtl"] .mkicker{font-family:"Tajawal",sans-serif;letter-spacing:.03em;font-size:12px}
.mcover-in h3{font-size:clamp(23px,3.4vw,30px);color:var(--ink);line-height:1.12}
.mpages{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);direction:ltr;unicode-bidi:isolate}
.app[dir="rtl"] .mpages{text-align:right;font-family:"Tajawal",sans-serif}
.mag-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.mag-b h3{font-size:18px}
.mag-b p{margin:0;color:var(--ink-2);font-size:14.4px;line-height:1.62;flex:1}
.mag-cta{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.mstate{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--warn);border:1px solid var(--gold-dim);padding:5px 10px;border-radius:6px}
.app[dir="rtl"] .mstate{font-family:"Tajawal",sans-serif;letter-spacing:0;font-size:12px}
.ccard{cursor:pointer;text-align:start;transition:border-color .16s,transform .16s}
.ccard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,35,46,.10)}
.city-art img{width:100%;height:100%;object-fit:cover}
.city-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(14,12,9,.8))}
.city-art .nm{z-index:2}
.cbadge{position:absolute;top:10px;inset-inline-end:10px;z-index:3;background:var(--yl);color:var(--on-yl);font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.ccard .open{padding-top:11px;margin-top:11px;border-top:1px solid var(--line);justify-content:space-between}
.ccard:hover .open{color:var(--gold)}
.cityhero img{width:100%;height:100%;object-fit:cover}
.citybar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-block:1px solid var(--line);padding:14px 0;margin:6px 0 8px}
.cb-n{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--ink-3)}
.app[dir="rtl"] .cb-n{font-family:"Tajawal",sans-serif}
.cb-n b{color:var(--gold);font-size:19px}
.attlist{display:flex;flex-direction:column;gap:22px;padding-bottom:12px}
.attx{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .16s}
.attx.on{border-color:var(--gold-dim);background:linear-gradient(150deg,var(--gold-ghost),var(--panel))}
.agal{display:grid;grid-template-columns:1fr;gap:2px;background:var(--line)}
.agal.multi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.agal img,.agal svg{width:100%;height:230px;object-fit:cover;display:block}
.agal.noimg svg{height:190px}
.attx-b{padding:18px 20px 20px}
.attx-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:9px}
.attx-h h3{font-size:clamp(19px,2.6vw,24px);flex:1 1 220px}
.addbtn{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.addbtn:hover{border-color:var(--gold);color:var(--gold)}
.addbtn .ic{font-family:"IBM Plex Mono",monospace;font-size:15px}
.attx.on .addbtn{background:var(--yl);border-color:var(--yl);color:var(--on-yl)}
.attx-d{color:var(--ink-2);font-size:15.6px;line-height:1.72;margin:0;max-width:64ch}
.attx-t{margin:12px 0 0;font-size:13.6px;color:var(--ink-3);line-height:1.6;max-width:60ch}

/* ---------- magazine ---------- */

.mhead{position:absolute;inset-inline:0;bottom:0;z-index:2;padding-bottom:32px}
.mhead .wrap{display:flex;flex-direction:column;gap:9px}
.mhead h1{font-size:clamp(33px,6.6vw,62px);line-height:1.03;text-shadow:0 3px 30px rgba(0,0,0,.6)}
.mhead .place{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.back{position:absolute;top:15px;inset-inline-start:20px;z-index:3;background:rgba(14,12,9,.72);border:1px solid var(--line-2);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--ink);backdrop-filter:blur(6px)}
.back:hover{border-color:var(--gold);color:var(--gold)}
/* the hero sits under a near-black scrim: its text has to be light, or the
   project title disappears into the photograph (it did) */
.mhead h1{color:#FFFFFF}
.mhead .place{color:#FFE500}
.mhead .place .tag.dev{background:#FFE500;color:#16232E}
.back{color:#FFFFFF;border-color:rgba(255,255,255,.34)}

.lede{font-size:clamp(19px,2.5vw,24px);line-height:1.62;color:var(--ink);max-width:34em;margin:34px 0 28px}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line);margin-bottom:34px}
.st{background:var(--bg);padding:15px 4px;text-align:center}

.st .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;color:var(--gold);margin-top:4px;direction:ltr;unicode-bidi:isolate}
.chap{margin-bottom:38px}
.chap h2{font-size:clamp(23px,3.4vw,32px);margin-bottom:13px;max-width:22em}
.chap .body{max-width:34em;color:var(--ink-2);font-size:17.5px}

.bleed{max-width:1400px;margin-inline:auto;padding:0 20px}

.pull{font-family:"Marcellus",serif;font-size:clamp(21px,3.3vw,29px);line-height:1.45;color:var(--gold-2);border-inline-start:3px solid var(--gold);padding-inline-start:21px;margin:32px 0;max-width:26em}

.amen{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px;max-width:44em}

/* ---------- calculator ---------- */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:330px 1fr;overflow:hidden;margin-top:24px}
.calc-in{padding:24px;border-inline-end:1px solid var(--line);background:var(--panel-2)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--panel);padding:14px 15px}
.stat .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.app[dir="rtl"] .stat .k{font-family:"Tajawal",sans-serif;letter-spacing:0;font-size:12px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;margin-top:3px;direction:ltr;unicode-bidi:isolate}
.app[dir="rtl"] .stat .v{text-align:right}
.stat .v.g{color:var(--gold)}
.stat .n{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.legend{display:flex;gap:15px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-inline-end:6px;vertical-align:-1px}

#chart{width:100%;min-width:330px;height:245px;display:block}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--panel-3);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;font-size:12.5px;white-space:nowrap;z-index:5;box-shadow:0 8px 24px rgba(22,35,46,.18)}
.tip .t{font-weight:700;margin-bottom:5px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}

.lead{margin-top:20px;border:1px dashed var(--gold-dim);border-radius:12px;padding:18px 20px;background:var(--gold-ghost)}

.leadrow{display:flex;gap:9px;flex-wrap:wrap}
.leadrow .inp{flex:1 1 150px;width:auto}
details.tblwrap summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);margin-top:12px;list-style:none}
details.tblwrap summary::-webkit-details-marker{display:none}
table.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;min-width:0}

table.tbl th:first-child,table.tbl td:first-child{text-align:start}
table.tbl td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2);direction:ltr;unicode-bidi:isolate}

/* ---------- tours ---------- */
.citygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.city{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.city-art{height:130px;position:relative}

.city-body{padding:15px 16px 16px}
.city-body>p{font-size:13.5px;color:var(--ink-2);margin:0 0 11px;line-height:1.5}
.att{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.att span{flex:1;color:var(--ink-2);line-height:1.35}
.plus{flex:none;width:29px;height:29px;border-radius:8px;border:1px solid var(--line-2);color:var(--ink-2);font-size:16px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}

.basket{position:fixed;bottom:0;inset-inline:0;z-index:70;background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border-top:1px solid var(--gold-dim);transform:translateY(105%);transition:transform .28s}

.basket-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:15px;padding:13px 20px;flex-wrap:wrap}
.basket .cnt{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);margin-inline-end:auto;line-height:1.4}
.app[dir="rtl"] .basket .cnt{font-family:"Tajawal",sans-serif}

.guide{max-width:760px;margin:0 auto;padding:0 20px}
.guide h2{font-size:clamp(22px,3.2vw,29px);color:var(--gold-2);margin:40px 0 12px;padding-top:22px;border-top:1px solid var(--line)}

 mkApprove:["Nothing goes up on its own. Sending this opens a message to Mubarak with everything you filled in. He reads it, checks the property, and only then does it appear on the public board. Your own copy is kept on this device meanwhile, marked Waiting for approval.","لا يُنشر شيء تلقائياً. إرسال هذا يفتح رسالة إلى مبارك بكل ما كتبته. يقرأها ويتحقق من العقار، وعندها فقط يظهر الإعلان على اللوحة العامة. ونسختك محفوظة على هذا الجهاز في هذه الأثناء بعلامة «بانتظار الموافقة».","არაფერი ქვეყნდება თავისით. ამის გაგზავნა უხსნის მუბარაქს შეტყობინებას თქვენს მიერ შევსებული ყველა მონაცემით. ის კითხულობს მას, ამოწმებს ობიექტს და მხოლოდ მაშინ ჩნდება საჯარო დაფაზე. ამასობაში თქვენი ასლი ინახება ამ მოწყობილობაზე, ნიშნით „დადასტურების მოლოდინში“."],
 mkApproveAsk:["Please review this listing and reply APPROVE or REJECT.","الرجاء مراجعة هذا الإعلان والرد بـ«موافقة» أو «رفض».","გთხოვთ, გადახედოთ ამ განცხადებას და უპასუხოთ „დამტკიცება“ ან „უარყოფა“."],
 mkSubmitMail:["Send by email","إرسال بالبريد","გაგზავნა ელფოსტით"],

 aiA_res:["Since 1 March 2026 a renewable Georgian residence permit needs property worth $150,000 or more, up from $100,000. Two things decide it: the certified appraised value, not the price written on the contract, and ownership that is actually registered — an off-plan flat paid in instalments does not count until it is transferred. Most projects hold units both above and below the line, so the question is always which unit. The full explanation is on the Residency guide page.","منذ ١ مارس ٢٠٢٦ صار تصريح الإقامة الجورجي القابل للتجديد يتطلّب عقاراً بقيمة ١٥٠ ألف دولار فأكثر، بعد أن كان ١٠٠ ألف. ويحسمه أمران: القيمة التقديرية المعتمدة لا السعر المكتوب في العقد، والملكية المسجَّلة فعلاً — فالشقة على الخارطة المدفوعة بالأقساط لا تُحتسب حتى تُنقل. ومعظم المشاريع فيها وحدات فوق الخط وتحته، فالسؤال دائماً أي وحدة. والشرح الكامل في صفحة دليل الإقامة.","2026 წლის 1 მარტიდან განახლებადი ქართული ბინადრობის ნებართვა მოითხოვს 150,000 დოლარის ან მეტი ღირებულების ქონებას, ადრინდელი 100,000-ის ნაცვლად. ორი რამ წყვეტს ამას: სერტიფიცირებული შეფასებული ღირებულება — და არა კონტრაქტში ჩაწერილი ფასი — და საკუთრება, რომელიც სინამდვილეში რეგისტრირებულია — გეგმით შენობის განვადებით გადახდილი ბინა არ ითვლება გადმორეგისტრირებამდე. უმეტეს პროექტებს აქვს ერთეულები როგორც ზღვარზე მაღლა, ისე ქვემოთ, ამიტომ კითხვა ყოველთვის ესაა — რომელი ერთეული. სრული ახსნა ბინადრობის გზამკვლევის გვერდზეა."],
 aiA_calc:["Open the Calculator page. Put in the purchase price, the rent you expect per month, the yearly appreciation you are willing to assume, then management, vacancy and yearly fees. It returns gross and net yield, the appreciation in dollars, payback years, and a five-year chart. It also tells you straight away whether that price clears the $150,000 residency line.","افتح صفحة الحاسبة. أدخل سعر الشراء، والإيجار المتوقّع شهرياً، ونسبة الارتفاع السنوي التي تقبل افتراضها، ثم الإدارة والشغور والرسوم السنوية. تعطيك العائد الإجمالي والصافي، والارتفاع بالدولار، وسنوات الاسترداد، ورسماً بيانياً لخمس سنوات. وتخبرك فوراً إن كان ذلك السعر يتجاوز حدّ الإقامة البالغ ١٥٠ ألف دولار.","გახსენით კალკულატორის გვერდი. შეიყვანეთ შესყიდვის ფასი, თვეში მოსალოდნელი ქირა, წლიური ზრდა, რომლის დაშვებაც გსურთ, შემდეგ მართვის, სიცარიელისა და წლიური მოსაკრებლების მონაცემები. ის გიბრუნებთ საერთო და წმინდა შემოსავალს, ზრდას დოლარებში, დაბრუნების წლებს და ხუთწლიან დიაგრამას. ასევე პირდაპირ გეუბნებათ, აღემატება თუ არა ეს ფასი ბინადრობის 150,000-დოლარიან ზღვარს."],
 aiA_cheap:["Cheapest per square metre on the site is {a} — about {b} per m², in {c}. The dearest is {d} at about {e}. But a project is a range of apartments, not one price: open it under Projects and read the unit table before you decide anything.","الأرخص للمتر المربع على الموقع هو {a} — نحو {b} للمتر، في {c}. والأغلى هو {d} بنحو {e}. لكن المشروع نطاق أسعار لا سعراً واحداً: افتحه من صفحة المشاريع واقرأ جدول الوحدات قبل أن تقرّر شيئاً.","საიტზე ყველაზე იაფი კვადრატულ მეტრზეა {a} — დაახლოებით {b} მ²-ზე, {c}-ში. ყველაზე ძვირია {d}, დაახლოებით {e}-ით. მაგრამ პროექტი ბინების დიაპაზონია და არა ერთი ფასი: გახსენით ის პროექტების გვერდზე და წაიკითხეთ ერთეულების ცხრილი, სანამ რაიმეს გადაწყვეტთ."],
 aiA_projects:["There are {n} developments on the Projects page — {list}, and the rest. Each one has its own page: photos, the price per square metre, the unit sizes, a map, and my own note on what is weak about it. There is also a comparison table underneath the cards.","على صفحة المشاريع {n} مشروعاً — {list}، وغيرها. لكل واحد صفحته: صور، وسعر المتر، ومساحات الوحدات، وخريطة، وملاحظتي على نقاط ضعفه. وتحت البطاقات جدول مقارنة أيضاً.","პროექტების გვერდზეა {n} დეველოპმენტი — {list} და დანარჩენი. თითოეულს აქვს საკუთარი გვერდი: ფოტოები, ფასი კვადრატულ მეტრზე, ერთეულების ზომები, რუკა და ჩემი შენიშვნა მისი სუსტი მხარეების შესახებ. ბარათების ქვემოთ შედარების ცხრილიც არის."],
 aiA_handover:["Handover dates as the developers publish them:\n{rows}\n\nThis matters for residency: the permit needs registered ownership, so a building finishing sooner puts you in the queue earlier. Confirm the date in writing before you sign.","مواعيد التسليم كما ينشرها المطوّرون:\n{rows}\n\nوهذا مهم للإقامة: فالتصريح يتطلّب ملكية مسجَّلة، والمبنى الذي ينتهي أبكر يضعك في الطابور أبكر. أكّد التاريخ كتابةً قبل التوقيع.","ჩაბარების თარიღები, როგორც დეველოპერები აქვეყნებენ:\n{rows}\n\nეს მნიშვნელოვანია ბინადრობისთვის: ნებართვას სჭირდება რეგისტრირებული საკუთრება, ასე რომ შენობა, რომელიც უფრო ადრე მთავრდება, გაწევს რიგში უფრო ადრე. დაადასტურეთ თარიღი წერილობით, სანამ ხელს მოაწერთ."],
 aiA_tour:["Open Build a tour. There are {n} cities — {cities}. Go into a city, read what each place actually is, press + on the ones you want. Your list follows you from city to city; when you are done press Send my tour list and it goes to Mubarak, who prices it and answers.","افتح «صمّم جولتك». فيها {n} مدن — {cities}. ادخل مدينة، واقرأ ما هو كل مكان فعلاً، واضغط + على ما يعجبك. وتتبعك قائمتك من مدينة إلى أخرى؛ وحين تنتهي اضغط «أرسل قائمة جولتي» فتصل إلى مبارك، فيسعّرها ويجيبك.","გახსენით „ტურის აწყობა“. არის {n} ქალაქი — {cities}. შედით ქალაქში, წაიკითხეთ, რა არის სინამდვილეში თითოეული ადგილი, დააჭირეთ + სასურველზე. თქვენი სია გდევთ ქალაქიდან ქალაქში; როცა დაასრულებთ, დააჭირეთ „გაგზავნეთ ჩემი ტურის სია“ და ის მუბარაქთან მიდის, რომელიც ფასს დაადებს და გიპასუხებთ."],
 aiA_mag:["The Magazines page has a free 31-page guide to Georgia, in Arabic and in English. Press the cover, leave your name and number, and Mubarak sends the file — there is no charge and no subscription.","في صفحة المجلات دليل مجاني عن جورجيا من ٣١ صفحة، بالعربية والإنجليزية. اضغط الغلاف واترك اسمك ورقمك فيرسل مبارك الملف — بلا رسوم ولا اشتراك.","ჟურნალების გვერდზეა უფასო 31-გვერდიანი გზამკვლევი საქართველოზე, არაბულად და ინგლისურად. დააჭირეთ ყდას, დატოვეთ სახელი და ნომერი, და მუბარაქი გაგზავნის ფაილს — არავითარი საფასურის ან გამოწერის გარეშე."],
 aiA_rent:["Rentals are not open yet. Properties has a For rent tab but it is deliberately empty: we would rather open with flats we have actually seen than with a filled page of guesses. Batumi and Tbilisi long lets come first, then summer short lets. Tell Mubarak what you are looking for and you go on the list before it opens.","الإيجارات لم تُفتح بعد. في صفحة العقارات تبويب «للإيجار» لكنه فارغ عن قصد: نفضّل أن نبدأ بشقق رأيناها فعلاً لا بصفحة مليئة بالتخمين. تبدأ بإيجارات باتومي وتبليسي الطويلة، ثم الصيفية القصيرة. أخبر مبارك بما تبحث عنه فتدخل القائمة قبل أن تُفتح.","ქირავნობა ჯერ არ არის გახსნილი. „უძრავი ქონების“ გვერდზეა „ქირავდება“ ჩანართი, მაგრამ ის განზრახ ცარიელია: გვირჩევნია დავიწყოთ ჩვენ მიერ ნანახი ბინებით, ვიდრე გამოცნობებით სავსე გვერდით. ჯერ ბათუმისა და თბილისის გრძელვადიანი ქირავნობა, მერე ზაფხულის მოკლევადიანი. უთხარით მუბარაქს, რას ეძებთ, და სიაში იქნებით, სანამ გაიხსნება."],
 aiA_contact:["Mubarak answers himself, in Arabic, English or Turkish. WhatsApp +90 541 654 2996, Telegram +90 542 790 8867. Every page has both buttons at the top, and the contact buttons on a project or a listing arrive already carrying which one you were reading.","يجيب مبارك بنفسه، بالعربية أو الإنجليزية أو التركية. واتساب ‎+90 541 654 2996‎، وتليجرام ‎+90 542 790 8867‎. وفي أعلى كل صفحة الزرّان، وأزرار التواصل داخل مشروع أو إعلان تصل ومعها ما كنت تقرأه.","მუბარაქი პასუხობს თავად, არაბულად, ინგლისურად ან თურქულად. WhatsApp +90 541 654 2996, Telegram +90 542 790 8867. ყოველ გვერდზე ზემოთ ორივე ღილაკია, ხოლო პროექტისა თუ განცხადების კონტაქტის ღილაკები მიდის იმის მითითებით, რასაც კითხულობდით."],
 aiA_post:["Go to Listings and press Post a listing — it is free, and it is open to owners, developers and agencies alike. Paste whatever text you already have and the form fills itself, add up to four photos, say whether you are the owner, a developer, an agency or something else, then send. It reaches Mubarak for approval; nothing appears on the public board until he approves it.","اذهب إلى «الإعلانات» واضغط «انشر إعلاناً» — مجاناً، ومفتوح للمالكين والمطوّرين والوكالات على السواء. الصق أي نص لديك فيملأ النموذج نفسه، وأضف حتى أربع صور، وحدّد إن كنت المالك أو مطوّراً أو وكالة أو غير ذلك، ثم أرسل. تصل إلى مبارك للموافقة؛ ولا يظهر شيء على اللوحة العامة قبل أن يوافق.","გადადით „განცხადებებზე“ და დააჭირეთ „განცხადების გამოქვეყნება“ — უფასოა და ღიაა როგორც მესაკუთრეებისთვის, ისე დეველოპერებისა და სააგენტოებისთვის. ჩასვით ნებისმიერი ტექსტი, რაც უკვე გაქვთ, და ფორმა თავად შეივსება, დაამატეთ სანამდე ოთხი ფოტო, მიუთითეთ, ხართ თუ არა მესაკუთრე, დეველოპერი, სააგენტო თუ სხვა, და გაგზავნეთ. ის მუბარაქთან მიდის დასამტკიცებლად; საჯარო დაფაზე არაფერი ჩნდება მის დამტკიცებამდე."],
 aiA_props:["There are {n} individual units on the Properties page right now:\n{list}\n\nThe developments are separate — those are under Projects. Press Contact on any card and the message arrives with the unit already named.","على صفحة العقارات الآن {n} وحدات مفردة:\n{list}\n\nأما المشاريع فمنفصلة، وتجدها في صفحة المشاريع. اضغط «تواصل» على أي بطاقة فتصل الرسالة والوحدة مذكورة فيها.","უძრავი ქონების გვერდზე ახლა არის {n} ცალკეული ერთეული:\n{list}\n\nდეველოპმენტები ცალკეა — ისინი პროექტების გვერდზეა. დააჭირეთ „კონტაქტს“ ნებისმიერ ბარათზე და შეტყობინება უკვე დასახელებული ერთეულით მოვა."],
 aiA_legal:["The general position: a foreigner can own an apartment in Georgia outright, purchase tax is not charged to the buyer, and registration at the Public Service Hall is quick. But I am not a lawyer or a tax adviser, and your own country may tax the income. Have a Georgian lawyer read the contract before you transfer money — Mubarak can point you to one.","الوضع العام: يستطيع الأجنبي تملّك شقة في جورجيا تملّكاً كاملاً، ولا تُفرض ضريبة شراء على المشتري، والتسجيل في «بيت الخدمات العامة» سريع. لكنني لست محامياً ولا مستشاراً ضريبياً، وقد تفرض دولتك ضريبة على الدخل. اجعل محامياً جورجياً يقرأ العقد قبل تحويل المال — ومبارك يدلّك على واحد.","ზოგადი მდგომარეობა: უცხოელს შეუძლია საქართველოში ბინის სრული საკუთრება, შემსყიდველს შესყიდვის გადასახადი არ ეკისრება, და საჯარო სამსახურის სახლში რეგისტრაცია სწრაფია. მაგრამ მე არც ვარ იურისტი და არც საგადასახადო მრჩეველი, და თქვენმა ქვეყანამ შეიძლება დაბეგროს შემოსავალი. ფულის გადარიცხვამდე ქართველ იურისტს წააკითხეთ კონტრაქტი — მუბარაქს ერთი დაგისახელებთ."],
 aiA_city:["{c} is one of the {n}-place stops on the tour builder: {places}. Open Build a tour, go into {c}, read what each place actually is, and press + on the ones you want.","{c} إحدى محطات مصمّم الجولات وفيها {n} أماكن: {places}. افتح «صمّم جولتك»، وادخل {c}، واقرأ ما هو كل مكان فعلاً، واضغط + على ما يعجبك.","{c} ტურის აწყობის {n}-ადგილიანი გაჩერებაა: {places}. გახსენით „ტურის აწყობა“, შედით {c}-ში, წაიკითხეთ, რა არის სინამდვილეში თითოეული ადგილი, და დააჭირეთ + სასურველზე."],
 aiA_project:["{name} — {city}. About {pm} per m², unit sizes {sizes}. {facts}. Open it under Projects for the photos, the full write-up and the map. For one specific apartment and today's price, ask Mubarak on WhatsApp — the unit lists move faster than this page.","{name} — {city}. نحو {pm} للمتر، ومساحات الوحدات {sizes}. {facts}. افتحه من صفحة المشاريع لترى الصور والشرح الكامل والخريطة. أما شقة بعينها وسعرها اليوم فاسأل مبارك على واتساب — فقوائم الوحدات تتحرّك أسرع من هذه الصفحة.","{name} — {city}. დაახლოებით {pm} მ²-ზე, ერთეულების ზომები {sizes}. {facts}. გახსენით ის პროექტების გვერდზე ფოტოებისთვის, სრული აღწერისთვის და რუკისთვის. კონკრეტულ ბინასა და დღევანდელ ფასზე ჰკითხეთ მუბარაქს WhatsApp-ზე — ერთეულების სია ამ გვერდზე უფრო სწრაფად იცვლება."],
 aiA_hello:["Hello. Ask me anything about this site — the residency rule, how the calculator works, which project is cheapest per square metre, how to build a tour, or how to post your own listing. For a price on a specific apartment, Mubarak answers on WhatsApp.","أهلاً. اسألني أي شيء عن هذا الموقع — قاعدة الإقامة، وكيف تعمل الحاسبة، وأي مشروع أرخص للمتر، وكيف تصمّم جولة، وكيف تنشر إعلانك. أما سعر شقة بعينها فيجيب عنه مبارك على واتساب.","გამარჯობა. მკითხეთ ნებისმიერი რამ ამ საიტზე — ბინადრობის წესი, როგორ მუშაობს კალკულატორი, რომელი პროექტია ყველაზე იაფი კვადრატულ მეტრზე, როგორ ავაწყოთ ტური, ან როგორ გამოვაქვეყნოთ განცხადება. კონკრეტული ბინის ფასზე მუბარაქი პასუხობს WhatsApp-ზე."],
 aiA_unit:["I do not hold a unit-by-unit list here, so I cannot tell you the price of one specific apartment number, and I will not guess at it. The project pages carry the developer's price per square metre and the size range; for a named unit, its floor, its view and what is still unsold, ask Mubarak on WhatsApp — he checks the current sheet with the developer.","لا أملك هنا قائمة وحدة بوحدة، فلا أستطيع أن أخبرك بسعر رقم شقة بعينه، ولن أخمّنه. صفحات المشاريع فيها سعر المتر عند المطوّر ونطاق المساحات؛ أما وحدة باسمها وطابقها وإطلالتها وما تبقّى منها فاسأل مبارك على واتساب — فهو يراجع القائمة الحالية مع المطوّر.","აქ ერთეულების სია არ მაქვს, ამიტომ ვერ გეტყვით კონკრეტული ბინის ნომრის ფასს და არც გამოვიცნობ. პროექტების გვერდებზეა დეველოპერის ფასი კვადრატულ მეტრზე და ზომების დიაპაზონი; დასახელებულ ერთეულზე, მის სართულზე, ხედსა და დარჩენილობაზე ჰკითხეთ მუბარაქს WhatsApp-ზე — ის ამოწმებს მიმდინარე ცხრილს დეველოპერთან."],
 aiA_none:["I could not find that on these pages, and I will not guess. Try asking about the $150,000 residency rule, the calculator, the projects and their prices per square metre, the tour cities, the magazines, or how to post a listing. For anything else — a specific unit, a payment plan, a viewing — Mubarak answers himself on WhatsApp.","لم أجد ذلك في هذه الصفحات، ولن أخمّن. جرّب السؤال عن قاعدة الإقامة بـ١٥٠ ألف دولار، أو الحاسبة، أو المشاريع وأسعار المتر فيها، أو مدن الجولات، أو المجلات، أو كيف تنشر إعلاناً. وأي شيء آخر — وحدة بعينها، أو خطة سداد، أو معاينة — يجيب عنه مبارك بنفسه على واتساب.","ამ გვერდებზე ვერ ვიპოვე ეს, და არ ვიცოდი. სცადეთ იკითხოთ 150,000-დოლარიან ბინადრობის წესზე, კალკულატორზე, პროექტებსა და მათ ფასებზე კვადრატულ მეტრზე, ტურის ქალაქებზე, ჟურნალებზე, ან როგორ გამოვაქვეყნოთ განცხადება. ყველაფერზე დანარჩენზე — კონკრეტულ ერთეულზე, გადახდის გეგმაზე, დათვალიერებაზე — მუბარაქი თავად პასუხობს WhatsApp-ზე."],

 rentSoonP:["We are not listing rentals yet. Long-lets in Batumi and Tbilisi come first, then the summer short-lets — and we would rather open with real apartments we have seen than with a page of nothing. If you own something you want let, or you are looking for one, tell me now and you will be first on the list.","لم نُدرج عقارات للإيجار بعد. سنبدأ بالإيجارات طويلة الأجل في باتومي وتبليسي ثم الإيجارات الصيفية القصيرة — ونفضّل أن نفتح بشقق حقيقية رأيناها بأنفسنا لا بصفحة فارغة. فإن كنت تملك ما تريد تأجيره أو تبحث عن واحد، أخبرني الآن وستكون أول القائمة.","ჯერ არ ვთავსებთ ქირავნობის განცხადებებს. ჯერ ბათუმისა და თბილისის გრძელვადიანი ქირავნობა, მერე ზაფხულის მოკლევადიანი — და გვირჩევნია დავიწყოთ ჩვენ მიერ ნანახი რეალური ბინებით, ვიდრე ცარიელი გვერდით. თუ გაქვთ რამე გასაქირავებელი, ან ეძებთ ასეთს, მითხარით ახლავე და სიის თავში იქნებით."],

 mkPostNote:["Posting is free and open to anyone. Every listing is read by a person before it appears to buyers — usually the same day. We remove anything we cannot verify, and we never take a fee from the sale.","النشر مجاني ومفتوح للجميع. ويقرأ شخص كل إعلان قبل ظهوره للمشترين — عادةً في اليوم نفسه. ونحذف ما لا نستطيع التحقق منه، ولا نأخذ عمولة من البيع.","გამოქვეყნება უფასოა და ღიაა ყველასთვის. ყოველ განცხადებას ადამიანი კითხულობს, სანამ მყიდველებს გამოუჩნდება — ჩვეულებრივ იმავე დღეს. ვშლით ყველაფერს, რისი დამოწმებაც ვერ ხერხდება, და გაყიდვიდან საკომისიოს არასოდეს ვიღებთ."],

const GUIDE=[
 { h:["What changed, exactly","ما الذي تغيّر بالضبط","რა შეიცვალა, ზუსტად"],
   p:["From <b>1 March 2026</b>, the minimum property value required to apply for an investment residence permit rose from <b>$100,000 to $150,000</b> — a 50% jump in one step.<br><br>One point many people miss: <b>properties registered before that date remain under the old threshold</b>. If you already own a property registered in your name before March 2026 at $100,000, you are fine and can renew while you keep it. Anyone buying today needs $150,000.",
      "اعتباراً من <b>١ مارس ٢٠٢٦</b>، ارتفع الحد الأدنى لقيمة العقار المطلوبة لطلب تصريح إقامة استثماري من <b>١٠٠ ألف إلى ١٥٠ ألف دولار</b> — بزيادة ٥٠٪ دفعة واحدة.<br><br>نقطة يغفلها كثيرون: <b>العقارات المسجّلة قبل ذلك التاريخ تبقى خاضعة للحد القديم</b>. فإن كنت تملك عقاراً مسجّلاً باسمك قبل مارس ٢٠٢٦ بقيمة ١٠٠ ألف، فوضعك سليم ويمكنك التجديد ما دمت محتفظاً به. أما من يشتري اليوم فيحتاج ١٥٠ ألفاً.","<b>2026 წლის 1 მარტიდან</b> საინვესტიციო ბინადრობის ნებართვაზე განაცხადისთვის საჭირო უძრავი ქონების მინიმალური ღირებულება <b>$100,000-დან $150,000-მდე</b> გაიზარდა — 50%-იანი ნახტომი ერთ ნაბიჯში.<br><br>ერთი დეტალი, რომელსაც ბევრი ვერ ამჩნევს: <b>ამ თარიღამდე რეგისტრირებულ ქონებაზე ძველი ზღვარი რჩება</b>. თუ თქვენს სახელზე ქონება 2026 წლის მარტამდე, $100,000-ად უკვე რეგისტრირებულია, პრობლემა არ გაქვთ და სანამ ის თქვენს საკუთრებაშია, ნებართვის განახლება შეგიძლიათ. ვინც დღეს ყიდულობს, მას $150,000 სჭირდება."] },
 { h:["Trap one: the valuation, not the purchase price","الفخّ الأول: التقييم لا سعر الشراء","პირველი ხაფანგი: შეფასება და არა ნასყიდობის ფასი"],
   p:["This is the most common reason applications are refused. The authorities do not look at the figure in your contract. They look at the <b>market value set by an accredited appraiser</b>.<br><br>So you can buy at $155,000, have it appraised at $145,000, and get nothing. An appraisal takes two to five working days and costs $100–300. Two hundred dollars protects a hundred and fifty thousand. <b>Never buy for residency without an appraisal first.</b><br><br>The gap widens exactly where you would expect: in new projects marketed to foreigners, where the foreigner price often sits above the real market value.",
      "هذا أكثر أسباب رفض الطلبات شيوعاً. الجهة المختصة لا تنظر إلى الرقم في عقدك، بل إلى <b>القيمة السوقية التي يحدّدها مُقيّم معتمد</b>.<br><br>فقد تشتري بـ ١٥٥ ألفاً ويُقيَّم بـ ١٤٥ ألفاً فلا تحصل على شيء. التقييم يستغرق من يومين إلى خمسة أيام عمل وتكلفته ١٠٠–٣٠٠ دولار. مئتا دولار تحمي مئة وخمسين ألفاً. <b>لا تشترِ للإقامة أبداً دون تقييم مسبق.</b><br><br>والفجوة تتّسع حيث تتوقّع: في المشاريع الجديدة المسوَّقة للأجانب، حيث يفوق سعر الأجنبي القيمة السوقية الحقيقية غالباً.","ეს არის განაცხადებზე უარის თქმის ყველაზე გავრცელებული მიზეზი. უწყება თქვენს ხელშეკრულებაში მითითებულ ციფრს არ უყურებს. ის უყურებს <b>აკრედიტებული შემფასებლის მიერ დადგენილ საბაზრო ღირებულებას</b>.<br><br>ანუ შეგიძლიათ $155,000-ად იყიდოთ, შეფასებით $145,000 მიიღოთ და შედეგად არაფერი დაგრჩეთ. შეფასებას ორიდან ხუთ სამუშაო დღემდე სჭირდება და $100–300 ღირს. ორასი დოლარი ასორმოცდაათ ათასს იცავს. <b>ბინადრობისთვის ქონება წინასწარი შეფასების გარეშე არასოდეს იყიდოთ.</b><br><br>სხვაობა ზუსტად იქ იზრდება, სადაც მოსალოდნელია: უცხოელებზე გათვლილ ახალ პროექტებში, სადაც უცხოელის ფასი ხშირად რეალურ საბაზრო ღირებულებაზე მაღლა დგას."] },
 { h:["Trap two: instalments on an off-plan unit","الفخّ الثاني: الأقساط على وحدة تحت الإنشاء","მეორე ხაფანგი: განვადება მშენებარე ობიექტზე"],
   p:["You will see very attractive terms in Batumi right now — 15% down, 15% in instalments, 70% on completion. Excellent for an investor.<br><br>Useless for residency. The permit requires <b>registered ownership with a certified valuation</b>, and a unit still under construction that has not been transferred to you does not meet that, whatever the contract price says.<br><br>Off-plan is not a mistake — it may be the smartest financial move available. But anyone selling you an instalment plan as a route to residency either does not understand the rule or is not telling you.",
      "سترى شروطاً مغرية جداً في باتومي هذه الأيام — ١٥٪ مقدّماً و١٥٪ أقساطاً و٧٠٪ عند الإنجاز. ممتازة للمستثمر.<br><br>وعديمة الفائدة للإقامة. فالتصريح يتطلّب <b>ملكية مسجّلة مع تقييم معتمد</b>، والوحدة التي ما زالت تُبنى ولم تُنقل إليك لا تحقّق ذلك، مهما كان سعر العقد.<br><br>الشراء على المخطط ليس خطأً — قد يكون أذكى قرار مالي متاح. لكن من يبيعك خطة أقساط كطريق إلى الإقامة إمّا لا يفهم القاعدة أو لا يخبرك بها.","ბათუმში ახლა ძალიან მიმზიდველ პირობებს ნახავთ — 15% პირველადი შენატანი, 15% განვადებით, 70% ჩაბარებისას. ინვესტორისთვის შესანიშნავია.<br><br>ბინადრობისთვის — უსარგებლო. ნებართვა მოითხოვს <b>რეგისტრირებულ საკუთრებას სერტიფიცირებული შეფასებით</b>, ჯერ კიდევ მშენებარე ბინა კი, რომელიც თქვენზე გადაფორმებული არ არის, ამას არ აკმაყოფილებს, რა ფასიც უნდა ეწეროს ხელშეკრულებაში.<br><br>მშენებარე ქონება შეცდომა არ არის — შესაძლოა ის ყველაზე გონივრული ფინანსური ნაბიჯიც კი იყოს. მაგრამ ვინც განვადებას ბინადრობის გზად გყიდით, ან თავად არ ესმის ეს წესი, ან ამას არ გეუბნებათ."] },
 { h:["What qualifies","ما الذي يؤهّل","რა ჩაითვლება"],
   ul:[["<b>Apartments and houses</b> — qualify.","<b>الشقق والمنازل</b> — تؤهّل.","<b>ბინები და სახლები</b> — ჩაითვლება."],
       ["<b>Commercial units</b> — also qualify. A hotel project or a shop counts exactly like an apartment.","<b>الوحدات التجارية</b> — تؤهّل أيضاً. المشروع الفندقي أو المحل يُحتسب تماماً كالشقة.","<b>კომერციული ფართი</b> — ასევე ჩაითვლება. სასტუმროს პროექტი ან მაღაზია ზუსტად ისევე ითვლება, როგორც ბინა."],
       ["<b>Agricultural land</b> — does not qualify, and is restricted for foreigners anyway.","<b>الأراضي الزراعية</b> — لا تؤهّل، وشراؤها مقيّد على الأجانب أصلاً.","<b>სასოფლო-სამეურნეო მიწა</b> — არ ჩაითვლება და უცხოელებისთვის ისედაც შეზღუდულია."],
       ["<b>Combining properties</b> — allowed. Two apartments at $80,000 each meet the threshold together.","<b>الجمع بين عقارات</b> — مسموح. شقتان بـ ٨٠ ألفاً لكل منهما تحقّقان الحد مجتمعتين.","<b>ქონების შეჯამება</b> — დაშვებულია. ორი ბინა, თითო $80,000-ად, ერთად აკმაყოფილებს ზღვარს."]] },
 { h:["Fees, timing and family","الرسوم والمدة والعائلة","საფასური, ვადები და ოჯახი"],
   p:["Standard processing takes <b>30 days at 300 GEL</b> (about $115); expedited is 20 days at 450 GEL and urgent is 10 days at 600 GEL. The residence card adds $20–50, the accredited appraisal $100–300, and property registration 50–200 GEL.<br><br>You must attend <b>in person</b> for the first application. The permit runs for <b>one year and is renewable</b>, and continued renewal opens a path to permanent residency after six years.<br><br>One investment covers your <b>spouse and children</b> on the same application, with translated and certified proof of relationship. That is the strongest feature of the Georgian scheme: a whole family legally resident on a single purchase.",
      "المعالجة القياسية تستغرق <b>٣٠ يوماً بـ ٣٠٠ لاري</b> (نحو ١١٥ دولاراً)؛ والمستعجلة ٢٠ يوماً بـ ٤٥٠ لاري، والعاجلة ١٠ أيام بـ ٦٠٠ لاري. وبطاقة الإقامة تضيف ٢٠–٥٠ دولاراً، والتقييم المعتمد ١٠٠–٣٠٠، وتسجيل العقار ٥٠–٢٠٠ لاري.<br><br>ويجب حضورك <b>شخصياً</b> للطلب الأول. والتصريح لمدة <b>سنة قابلة للتجديد</b>، والاستمرار في التجديد يفتح طريقاً إلى الإقامة الدائمة بعد ست سنوات.<br><br>واستثمار واحد يغطّي <b>الزوجة والأبناء</b> في الطلب نفسه، مع وثائق قرابة مترجمة ومصدّقة. وهذه أقوى ميزة في النظام الجورجي: عائلة كاملة مقيمة قانونياً بعملية شراء واحدة.","სტანდარტული განხილვა <b>30 დღეა 300 ლარად</b> (დაახლოებით $115); დაჩქარებული — 20 დღე 450 ლარად, სასწრაფო კი 10 დღე 600 ლარად. ბინადრობის მოწმობა ემატება $20–50, აკრედიტებული შეფასება $100–300, ქონების რეგისტრაცია კი 50–200 ლარი.<br><br>პირველ განაცხადზე <b>პირადად</b> უნდა გამოცხადდეთ. ნებართვა <b>ერთი წლით გაიცემა და განახლებადია</b>, უწყვეტი განახლება კი ექვსი წლის შემდეგ მუდმივ ბინადრობამდე გზას ხსნის.<br><br>ერთი ინვესტიცია იმავე განაცხადით მოიცავს თქვენს <b>მეუღლესა და შვილებს</b>, ნათესაური კავშირის თარგმნილი და დამოწმებული დადასტურებით. ეს არის ქართული სქემის ყველაზე ძლიერი მხარე: მთელი ოჯახი ლეგალურად ბინადრობს ერთი შენაძენით."] },
 { h:["The taxes nobody mentions","الضرائب التي لا يذكرها أحد","გადასახადები, რომლებზეც არავინ საუბრობს"],
   ul:[["<b>Rental income:</b> 20% as a general rule — but only <b>5%</b> if you register as a residential landlord. Same flat, same rent, four times the tax.","<b>الدخل الإيجاري:</b> ٢٠٪ كقاعدة عامة — لكن <b>٥٪</b> فقط إن سجّلت نفسك مؤجّراً للسكن. نفس الشقة ونفس الإيجار وأربعة أضعاف الضريبة.","<b>საიჯარო შემოსავალი:</b> ზოგადი წესით 20% — მაგრამ მხოლოდ <b>5%</b>, თუ საცხოვრისის გამქირავებლად დარეგისტრირდებით. იგივე ბინა, იგივე ქირა, ოთხჯერ მეტი გადასახადი."],
       ["<b>Commercial letting:</b> stays at 20%.","<b>التأجير التجاري:</b> يبقى ٢٠٪.","<b>კომერციული გაქირავება:</b> რჩება 20%-ზე."],
       ["<b>Capital gains:</b> 5% if you sell within two years, <b>zero after two years</b>.","<b>الأرباح الرأسمالية:</b> ٥٪ إن بعت خلال سنتين، و<b>صفر بعد سنتين</b>.","<b>კაპიტალის ნამატი:</b> 5%, თუ ორი წლის განმავლობაში გაყიდით, <b>ნული ორი წლის შემდეგ</b>."],
       ["<b>No purchase tax</b> and no stamp duty on the transaction itself.","<b>لا ضريبة شراء</b> ولا رسم دمغة على المعاملة نفسها.","<b>შეძენის გადასახადი არ არის</b> და თავად გარიგებაზე საგერბო მოსაკრებელიც არ ირიცხება."]] },
 { h:["When the permit is taken away","متى يُسحب التصريح","როდის უუქმდება ნებართვა"],
   p:["The permit is tied to the investment staying in place. If you <b>sell the property</b>, or its appraised value falls below the threshold at renewal, the permit becomes liable to cancellation.<br><br>This should change which unit you choose. A property bought at $152,000 lives on the edge of the requirement every single year. Leave yourself real headroom above the line rather than betting on the market.",
      "التصريح مرتبط ببقاء الاستثمار قائماً. فإن <b>بعت العقار</b>، أو انخفضت قيمته المقدّرة دون الحد عند التجديد، أصبح التصريح عرضة للإلغاء.<br><br>وهذا ينبغي أن يغيّر اختيارك للوحدة. فالعقار المشترى بـ ١٥٢ ألفاً يعيش على حافة الشرط كل سنة. اترك لنفسك هامشاً حقيقياً فوق الحد بدل المراهنة على السوق.","ნებართვა დაკავშირებულია იმასთან, რომ ინვესტიცია ადგილზე რჩებოდეს. თუ <b>ქონებას გაყიდით</b> ან განახლებისას მისი შეფასებული ღირებულება ზღვარს ქვემოთ დაეცემა, ნებართვა გაუქმებას ექვემდებარება.<br><br>ამან უნდა შეცვალოს ის, თუ რომელ ბინას აირჩევთ. $152,000-ად ნაყიდი ქონება ყოველ წელს მოთხოვნის ზღვარზე დგას. ბაზარზე ფსონის დადების ნაცვლად, ზღვარს ზემოთ რეალური მარაგი დაიტოვეთ."] },
 { h:["What this permit is not","ما ليس هذا التصريح","რა არ არის ეს ნებართვა"],
   ul:[["<b>Not a passport</b>, and not a fast track to citizenship.","<b>ليس جواز سفر</b>، ولا طريقاً سريعاً إلى الجنسية.","<b>არ არის პასპორტი</b> და არც მოქალაქეობის დაჩქარებული გზა."],

    p:["Studios start at $145,000 — just under the $150,000 threshold, and the permit is assessed on the <b>certified appraised value</b>, not the contract price, so a studio may land either side of it. One-bedrooms, the one-bedroom Lux at 66 m² and the 88.5 m² two-bedrooms all clear it comfortably.<br><br>So the honest answer is not \u201cRadisson qualifies\u201d or \u201cRadisson does not\u201d. It is: tell me your budget and I will send you the specific units in this building that appraise above $150,000, and the ones that do not. Then remember the second condition — <b>handover is May 2027</b>, and nothing counts until the title is registered in your name.",
        "تبدأ الاستوديوهات من ١٤٥٠٠٠ دولار — أي تحت حدّ الـ١٥٠٠٠٠ بقليل، والتصريح يُقيَّم على <b>القيمة المُقدَّرة المعتمدة</b> لا على سعر العقد، فقد تقع الاستوديو على أي من الجانبين. أما الشقق بغرفة نوم، وغرفة النوم لوكس بمساحة ٦٦ متراً، والشقق بغرفتين بمساحة ٨٨٫٥ متراً فتتجاوزه جميعاً بارتياح.<br><br>فالجواب الصادق ليس «راديسون مؤهّل» ولا «راديسون غير مؤهّل»، بل: أخبرني بميزانيتك وسأرسل لك الوحدات المحدَّدة في هذا المبنى التي يزيد تقييمها عن ١٥٠٠٠٠ دولار، وتلك التي لا تزيد. ثم تذكّر الشرط الثاني — <b>التسليم مايو ٢٠٢٧</b>، ولا شيء يُحتسب قبل تسجيل الملكية باسمك.","სტუდიოები იწყება $145,000-დან — ოდნავ $150,000-იან ზღვარს ქვემოთ, ნებართვა კი ფასდება <b>სერტიფიცირებული შეფასების ღირებულებით</b> და არა ხელშეკრულების ფასით, ამიტომ სტუდიო ზღვრის ორივე მხარეს შეიძლება აღმოჩნდეს. ერთსაძინებლიანები, 66 მ²-იანი ერთსაძინებლიანი Lux და 88.5 მ²-იანი ორსაძინებლიანები ამ ზღვარს თავისუფლად გადალახავს.<br><br>ამიტომ პატიოსანი პასუხი არც \\u201cRadisson გამოდგება\\u201d არის და არც \\u201cRadisson არ გამოდგება\\u201d. პასუხი ასეთია: მითხარით თქვენი ბიუჯეტი და გამოგიგზავნით ამ შენობის იმ კონკრეტულ ბინებს, რომელთა შეფასებაც $150,000-ს აღემატება, და იმ ბინებსაც, რომლებიც არ აღემატება. შემდეგ კი გახსოვდეთ მეორე პირობა — <b>ჩაბარება 2027 წლის მაისშია</b> და არაფერი ჩაითვლება მანამ, სანამ საკუთრება თქვენს სახელზე არ დარეგისტრირდება."]},
   {img:"rad_pair", cap:["Radisson and Wyndham side by side at Gonio — the same developer, two hotel names, two handover dates.","راديسون وويندهام جنباً إلى جنب في غونيو — المطوّر نفسه، اسمان فندقيان، وموعدا تسليم مختلفان.","Radisson და Wyndham გვერდიგვერდ გონიოში — ერთი და იგივე დეველოპერი, ორი სასტუმროს სახელი, ორი ჩაბარების თარიღი."],
    pull:["A hotel brand on the door is a promise someone else has to keep. Ask how long they have promised it for.","العلامة الفندقية على الباب وعدٌ على غيرك أن يفي به. اسأل كم من الوقت وعدوا به.","სასტუმროს ბრენდი შესასვლელზე არის დაპირება, რომელიც სხვას უნდა შეასრულოს. იკითხეთ, რა ვადით აქვთ ეს დაპირებული."]}]},

  story:[
   {h:["The one that finishes first","المشروع الذي ينتهي أولاً","ის, რომელიც პირველი სრულდება"],
    p:["Every unit here starts above $150,000 and the building hands over in December 2026. That combination matters: the residency permit needs <b>registered ownership</b>, not a signed contract, so a project completing in 2026 puts you in the queue two to three years ahead of one completing in 2028 or 2029.<br><br>What you get: a rooftop infinity pool (25 m, heated to 28°C), private beach access, two restaurants including a panoramic one, a fitness centre, a children's playground, a conference hall and secured parking. 118 one-bedrooms and two duplexes among the 456.",
        "كل وحدة هنا تبدأ فوق ١٥٠٠٠٠ دولار، والمبنى يُسلَّم في ديسمبر ٢٠٢٦. هذا المزيج مهم: فتصريح الإقامة يتطلب <b>ملكية مسجَّلة</b>، لا عقداً موقَّعاً، لذا فالمشروع المنتهي في ٢٠٢٦ يضعك في الطابور قبل مشروع ينتهي في ٢٠٢٨ أو ٢٠٢٩ بسنتين إلى ثلاث.<br><br>ما تحصل عليه: مسبح لا متناهٍ على السطح (٢٥ متراً، مُدفّأ إلى ٢٨ درجة)، ومدخل إلى شاطئ خاص، ومطعمان أحدهما بانورامي، وصالة رياضية، وملعب أطفال، وقاعة مؤتمرات، ومواقف مؤمَّنة. من بين الـ٤٥٦ وحدة، ١١٨ شقة بغرفة نوم ودوبلكسان.","აქ ყველა ბინა $150,000-ზე მაღლა იწყება და შენობა 2026 წლის დეკემბერში ბარდება. ეს კომბინაცია მნიშვნელოვანია: ბინადრობის ნებართვას სჭირდება <b>რეგისტრირებული საკუთრება</b> და არა ხელმოწერილი ხელშეკრულება, ამიტომ 2026 წელს დასრულებული პროექტი რიგში ორი-სამი წლით წინ გაყენებთ იმ პროექტთან შედარებით, რომელიც 2028 ან 2029 წელს სრულდება.<br><br>რას იღებთ: სახურავზე უსასრულობის აუზი (25 მ, გათბობილი 28°C-მდე), წვდომა კერძო პლაჟზე, ორი რესტორანი, მათ შორის პანორამული, ფიტნეს ცენტრი, საბავშვო მოედანი, საკონფერენციო დარბაზი და დაცული პარკინგი. 456 ბინიდან 118 ერთსაძინებლიანია და ორი — დუპლექსი."]},
   {duo:["wy_aerial","wy_sea"], cap:["Gonio from the air at dusk, and the same tower seen from the water at night.","غونيو من الجو عند الغسق، والبرج نفسه من جهة الماء ليلاً.","გონიო ჰაერიდან მწუხრისას და იგივე კოშკი ღამით, ზღვიდან დანახული."]},
   {duo:["wy_beach","wy_pool"], cap:["The private beach in front of the building, and the pool deck between the two Wyndham blocks.","الشاطئ الخاص أمام المبنى، وساحة المسبح بين مبنيَي ويندهام.","კერძო პლაჟი შენობის წინ და აუზის ტერასა Wyndham-ის ორ კორპუსს შორის."]},
   {h:["Where this project sits against the residency line","أين يقع هذا المشروع من خط الإقامة","სად დგას ეს პროექტი ბინადრობის ზღვართან მიმართებით"],
    p:["Studios open at $155,000 and the one-bedroom Lux at $261,000, so on the developer's own price list <b>the one-bedrooms are the residency units</b> and the studios sit only just above the line — close enough that a certified valuation could bring one under it.<br><br>Ask for the appraisal before you sign, not after. And note the thing that actually makes this building useful for a permit: it hands over in <b>December 2026</b>. Registered ownership is the requirement, and this is the only project on the list that reaches it next year.",
        "تبدأ الاستوديوهات من ١٥٥٠٠٠ دولار، وغرفة النوم لوكس من ٢٦١٠٠٠، فبحسب قائمة أسعار المطوّر نفسه فإن <b>الشقق بغرفة نوم هي وحدات الإقامة</b>، بينما تقع الاستوديوهات فوق الخط بقليل فقط — قريبة بما يكفي لأن يهبط بها تقييم معتمد تحته.<br><br>اطلب التقييم قبل التوقيع لا بعده. ولاحظ ما يجعل هذا المبنى مفيداً فعلاً للتصريح: التسليم في <b>ديسمبر ٢٠٢٦</b>. فالملكية المسجَّلة هي الشرط، وهذا هو المشروع الوحيد في القائمة الذي يبلغها العام المقبل.","სტუდიოები იწყება $155,000-დან, ერთსაძინებლიანი Lux კი — $261,000-დან, ამიტომ დეველოპერის საკუთარი ფასების სიით <b>ბინადრობისთვის ერთსაძინებლიანი ბინები გამოდგება</b>, სტუდიოები კი ზღვარს მხოლოდ ოდნავ აღემატება — იმდენად ახლოსაა, რომ სერტიფიცირებულმა შეფასებამ შეიძლება ზღვარს ქვემოთ ჩამოიყვანოს.<br><br>შეფასება ხელმოწერამდე მოითხოვეთ და არა შემდეგ. და გაითვალისწინეთ ის, რაც ამ შენობას ნებართვისთვის ნამდვილად გამოსადეგს ხდის: ჩაბარება <b>2026 წლის დეკემბერშია</b>. მოთხოვნა რეგისტრირებული საკუთრებაა და ეს არის სიაში ერთადერთი პროექტი, რომელიც მას მომავალ წელს აღწევს."]},
   {duo:["wy_reception","wy_lobby"], cap:["Reception under the wave chandelier, and the double-height lobby it opens into.","الاستقبال تحت ثريا الموجة، والردهة المزدوجة الارتفاع التي يفتح عليها.","რეცეფცია ტალღისებრი ჭაღის ქვეშ და ორმაგი სიმაღლის ლობი, რომელშიც ის გადადის."]},
   {duo:["wy_lounge","wy_split"], cap:["The lounge along the glass wall, and the run from the seating back to the desk.","الصالة على طول الجدار الزجاجي، والامتداد من مجلس الجلوس إلى مكتب الاستقبال.","ლაუნჯი შუშის კედლის გასწვრივ და მონაკვეთი სასხდომი ზონიდან უკან მიმღებ მაგიდამდე."]},
   {duo:["wy_library","wy_seating"], cap:["The library wall, and the seating residents actually use in the afternoon.","جدار المكتبة، ومقاعد الجلوس التي يستعملها السكان فعلاً بعد الظهر.","ბიბლიოთეკის კედელი და სასხდომი ადგილები, რომლებსაც მაცხოვრებლები შუადღისას ნამდვილად იყენებენ."]},
   {duo:["wy_corridor","wy_atrium"], cap:["The long reception corridor, and the atrium seen from the floor above it.","ممر الاستقبال الطويل، والبهو من الطابق الذي يعلوه.","რეცეფციის გრძელი დერეფანი და ატრიუმი, ზემოთა სართულიდან დანახული."]},
   {duo:["wy_meeting","wy_garden"], cap:["The meeting room off the lobby, and the Wyndham Garden hotel that shares the plot.","قاعة الاجتماعات المجاورة للردهة، وفندق ويندهام غاردن الذي يشاركها الموقع.","შეხვედრების ოთახი ლობიდან გასასვლელში და Wyndham Garden-ის სასტუმრო, რომელიც იმავე ნაკვეთზე დგას."]}]},

  story:[
   {h:["Still early enough to choose","ما زال الوقت مبكراً للاختيار","ჯერ კიდევ საკმარისად ადრეა ასარჩევად"],
    p:["At 35% sold you can still pick the floor, the aspect and the unit type — which on a sea-facing building is most of the value. Ceilings are 3.3 metres. A pool with sea views, a sauna, a co-working space, a fitness centre, restaurants and bars, gardens, 24/7 reception and parking.<br><br>Two dates, not one: <b>handover December 2027</b>, full turnkey completion <b>June 2028</b>. Plan your rental income from the second date, not the first. Instalments run to 36 months at 0%, from about $1,535 a month on a 15% ($9,700) first payment.",
        "عند نسبة بيع ٣٥٪ لا يزال بإمكانك اختيار الطابق والاتجاه ونوع الوحدة — وهذا في مبنى مطلّ على البحر هو معظم القيمة. ارتفاع الأسقف ٣٫٣ متر. مسبح بإطلالة بحرية، وساونا، ومساحة عمل مشترك، وصالة رياضية، ومطاعم وبارات، وحدائق، واستقبال على مدار الساعة، ومواقف.<br><br>تاريخان لا واحد: <b>التسليم ديسمبر ٢٠٢٧</b>، والإنجاز الكامل الجاهز <b>يونيو ٢٠٢٨</b>. خطّط دخلك الإيجاري من التاريخ الثاني لا الأول. الأقساط حتى ٣٦ شهراً بفائدة ٠٪، من نحو ١٥٣٥ دولاراً شهرياً بدفعة أولى ١٥٪ (٩٧٠٠ دولار).","როცა გაყიდულია 35%, ჯერ კიდევ შეგიძლიათ აირჩიოთ სართული, მხარე და ბინის ტიპი — ზღვისკენ მიმართულ შენობაში კი სწორედ ამაშია ღირებულების უდიდესი ნაწილი. ჭერი 3.3 მეტრია. აუზი ზღვის ხედით, საუნა, ქოვორქინგ სივრცე, ფიტნეს ცენტრი, რესტორნები და ბარები, ბაღები, 24/7 რეცეფცია და პარკინგი.<br><br>ორი თარიღი და არა ერთი: <b>ჩაბარება 2027 წლის დეკემბერში</b>, სრული, გასაღებამდე დასრულება კი <b>2028 წლის ივნისში</b>. საიჯარო შემოსავალი მეორე თარიღიდან დაგეგმეთ და არა პირველიდან. განვადება 36 თვემდეა 0%-ით, დაახლოებით $1,535-დან თვეში, 15%-იანი ($9,700) პირველადი შენატანის პირობით."]},
   {duo:["gard_sign","gard_facade"], cap:["The building carries its own name on the roofline; below it, the stepped balconies and planting that give the project its title.","المبنى يحمل اسمه على سطحه؛ وتحته الشرفات المتدرّجة والمزروعات التي أعطت المشروع اسمه.","შენობას სახურავის ხაზზე საკუთარი სახელი აწერია; ქვემოთ კი საფეხურებრივი აივნები და გამწვანება, რომლებმაც პროექტს სახელი მისცა."]},
   {img:"gard_sea", cap:["Kvariati from the water — the two blocks, the beach in front, and the green ridge behind them.","كفارياتي من الماء — المبنيان، والشاطئ أمامهما، والحافة الخضراء خلفهما.","კვარიათი ზღვიდან — ორი კორპუსი, პლაჟი წინ და მწვანე ქედი მათ უკან."]},
   {h:["The roof is the amenity","السطح هو الميزة","სახურავია მთავარი კეთილმოწყობა"],
    pull:["Fifty metres of beach in front and a heated pool above it. That combination is what you are paying the premium for.","خمسون متراً من الشاطئ أمامك ومسبح مُدفّأ فوقك. هذا المزيج هو ما تدفع مقابله العلاوة.","ორმოცდაათი მეტრი პლაჟი წინ და გათბობილი აუზი ზემოთ. სწორედ ამ კომბინაციაში იხდით დანამატს."],
    p:["The pool deck runs the length of the roof with the sea on one side and the ridge on the other, heated so it works outside July and August — which matters, because the difference between a summer-only building and a year-round one is most of your rental income.<br><br>Add the sauna, the co-working space, the fitness centre and the gardens at ground level, and what you are buying at Kvariati is a building people can live in through a Batumi winter, not just visit in a Batumi August.",
        "يمتد مسطح المسبح بطول السطح، والبحر على جانب والحافة الخضراء على الآخر، وهو مُدفّأ ليعمل خارج يوليو وأغسطس — وهذا مهم، لأن الفرق بين مبنى صيفي ومبنى يعمل طوال العام هو معظم دخلك الإيجاري.<br><br>أضف الساونا، ومساحة العمل المشترك، والصالة الرياضية، والحدائق في الطابق الأرضي، وما تشتريه في كفارياتي هو مبنى يمكن العيش فيه طوال شتاء باتومي، لا زيارته في أغسطس فقط.","აუზის ტერასა სახურავის მთელ სიგრძეზე გადის — ერთ მხარეს ზღვა, მეორეზე ქედი — და გათბობილია, ამიტომ ივლისისა და აგვისტოს მიღმაც მუშაობს. ეს მნიშვნელოვანია, რადგან მხოლოდ საზაფხულო და მთელი წლის განმავლობაში მომუშავე შენობას შორის სხვაობა თქვენი საიჯარო შემოსავლის უდიდეს ნაწილს შეადგენს.<br><br>დაუმატეთ საუნა, ქოვორქინგ სივრცე, ფიტნეს ცენტრი და ბაღები პირველ დონეზე და გამოვა, რომ კვარიათში ყიდულობთ შენობას, რომელშიც ადამიანებს ბათუმის ზამთარშიც შეუძლიათ ცხოვრება და არა მხოლოდ ბათუმის აგვისტოში სტუმრობა."]},
   {duo:["gard_pool","gard_sunset"], cap:["The heated roof pool at dusk, and the same terrace looking west over the water.","مسبح السطح المُدفّأ عند الغسق، والتراس نفسه ينظر غرباً فوق الماء.","გათბობილი სახურავის აუზი მწუხრისას და იგივე ტერასა, დასავლეთით, ზღვისკენ გახედული."]}]},

  lede:["City-centre Batumi on the Alley of Heroes, seven hundred metres from the water. <b>From $68,000</b>, <b>70% sold</b>, handing over <b>December 2028</b>. The cheapest entry into the centre on this list.",
        "وسط باتومي في جادة الأبطال، على بُعد سبعمئة متر من الماء. <b>يبدأ من ٦٨٠٠٠ دولار</b>، <b>٧٠٪ مباع</b>، والتسليم في <b>ديسمبر ٢٠٢٨</b>. أرخص مدخل إلى وسط المدينة في هذه القائمة.","ბათუმის ცენტრი, გმირთა ხეივანი, წყლიდან შვიდას მეტრში. <b>$68,000-დან</b>, <b>70% გაყიდულია</b>, ჩაბარება <b>2028 წლის დეკემბერში</b>. ამ სიაში ყველაზე იაფი შესვლა ცენტრში."],

  story:[
   {h:["Centre, not coast","المركز لا الساحل","ცენტრი და არა სანაპირო"],
    p:["Seven hundred metres inland is not a sea view, and it should not be priced like one — that is exactly why the entry price here is roughly half of Gonio's. What you buy instead is year-round demand: a centre flat lets to people who live and work in Batumi in February, not only to tourists in August.<br><br>A heated pool at 28°C, 24/7 reception and security, a fitness centre, a restaurant, a kids' zone, a pharmacy, a commercial area, lounge and meeting rooms, secured parking. Instalments 12–45 months at 0%; the example NEXT shows is $1,400 a month over 40 months on a $14,000 first payment.",
        "سبعمئة متر إلى الداخل ليست إطلالة بحرية، ولا ينبغي أن تُسعَّر كذلك — ولهذا بالضبط فإن سعر الدخول هنا نحو نصف سعر غونيو. ما تشتريه بدلاً من ذلك هو طلب على مدار العام: شقة في المركز تُؤجَّر لمن يعيشون ويعملون في باتومي في فبراير، لا لسيّاح أغسطس فقط.<br><br>مسبح مُدفّأ إلى ٢٨ درجة، واستقبال وأمن على مدار الساعة، وصالة رياضية، ومطعم، ومنطقة أطفال، وصيدلية، ومنطقة تجارية، وصالات اجتماعات، ومواقف مؤمَّنة. الأقساط ١٢–٤٥ شهراً بفائدة ٠٪؛ والمثال الذي تعرضه نكست هو ١٤٠٠ دولار شهرياً على ٤٠ شهراً بدفعة أولى ١٤٠٠٠ دولار.","ზღვიდან შვიდასი მეტრით დაშორებული ადგილი ზღვის ხედი არ არის და ისე არც უნდა ფასდებოდეს — სწორედ ამიტომ არის აქ საწყისი ფასი დაახლოებით გონიოს ნახევარი. სამაგიეროდ ყიდულობთ წლის განმავლობაში სტაბილურ მოთხოვნას: ცენტრში მდებარე ბინა ქირავდება იმ ადამიანებზე, რომლებიც თებერვალში ბათუმში ცხოვრობენ და მუშაობენ, და არა მხოლოდ აგვისტოს ტურისტებზე.<br><br>გათბობიანი აუზი 28°C-ზე, 24/7 რეცეფცია და დაცვა, ფიტნეს-ცენტრი, რესტორანი, საბავშვო ზონა, აფთიაქი, კომერციული ზონა, ლაუნჯი და შეხვედრების ოთახები, დაცული პარკინგი. განვადება 12–45 თვე 0%-ით; NEXT-ის მიერ ნაჩვენები მაგალითია $1,400 თვეში 40 თვის განმავლობაში, $14,000 პირველადი შენატანის პირობით."]},
   {duo:["addr_tower","addr_night"], cap:["The three stepped volumes by day, and the same silhouette lit after dark.","الكتل الثلاث المتدرّجة نهاراً، والصورة الظلّية نفسها مضاءة بعد الغروب.","სამი საფეხურებრივი მოცულობა დღისით და იგივე სილუეტი, განათებული ბნელის შემდეგ."]},
   {img:"addr_skyline", cap:["Where it sits in the Batumi skyline — inland of the seafront towers, with the water still in view from the upper floors.","موقعه في أفق باتومي — داخل صف الأبراج الساحلية، والماء ما زال في المشهد من الطوابق العليا.","სად დგას იგი ბათუმის სილუეტში — სანაპირო კოშკებს მიღმა, ხმელეთისკენ, თუმცა ზღვა ზედა სართულებიდან მაინც ჩანს."]},
   {h:["What the roof gives you inland","ماذا يمنحك السطح في الداخل","რას გაძლევთ სახურავი ზღვიდან მოშორებით"],
    pull:["A city-centre building cannot sell you a beach. It sells you height, and a tenant in February.","مبنى في وسط المدينة لا يبيعك شاطئاً. يبيعك ارتفاعاً، ومستأجراً في فبراير.","ქალაქის ცენტრში მდებარე შენობა პლაჟს ვერ მოგყიდით. ის გყიდით სიმაღლეს და მოიჯარეს თებერვალში."],
    p:["The roof deck carries a heated pool and loungers against a planted façade — the sea view you did not pay beachfront prices for. At street level the podium is wrapped in greenery with retail units along the corner, which is what keeps the ground floor alive rather than shuttered out of season.<br><br>Downstairs it is a working city building: 24/7 reception and security, a fitness centre, a restaurant, a kids' zone, a pharmacy, commercial units and secured parking.",
        "يحمل سطح المبنى مسبحاً مُدفّأً ومقاعد استلقاء أمام واجهة مزروعة — إطلالة البحر التي لم تدفع مقابلها أسعار الواجهة البحرية. وعند مستوى الشارع تُغلَّف القاعدة بالمساحات الخضراء مع وحدات تجارية على الزاوية، وهذا ما يبقي الطابق الأرضي حياً بدل أن يُغلق خارج الموسم.<br><br>وفي الأسفل مبنى مدينة عامل: استقبال وأمن على مدار الساعة، وصالة رياضية، ومطعم، ومنطقة أطفال، وصيدلية، ووحدات تجارية، ومواقف مؤمَّنة.","სახურავის ტერასაზეა გათბობიანი აუზი და შეზლონგები გამწვანებული ფასადის ფონზე — ზღვის ხედი, რომელშიც სანაპირო ზოლის ფასი არ გადაგიხდიათ. ქუჩის დონეზე პოდიუმი გამწვანებითაა შემოსილი, კუთხის გასწვრივ კი სავაჭრო ფართებია — სწორედ ეს ინარჩუნებს პირველ სართულს ცოცხლად, სეზონის გარეთ დაკეტილის ნაცვლად.<br><br>ქვემოთ ეს მომუშავე ქალაქური შენობაა: 24/7 რეცეფცია და დაცვა, ფიტნეს-ცენტრი, რესტორანი, საბავშვო ზონა, აფთიაქი, კომერციული ფართები და დაცული პარკინგი."]},
   {duo:["addr_pool","addr_street"], cap:["The pool terrace against the planted façade, and the retail corner at street level.","تراس المسبح أمام الواجهة المزروعة، وزاوية المحال عند مستوى الشارع.","აუზის ტერასა გამწვანებული ფასადის ფონზე და სავაჭრო კუთხე ქუჩის დონეზე."]},
   {h:["Inside a unit","داخل الوحدة","ბინის შიგნით"],
    p:["Ceilings are <b>3.1 metres</b> and the glazing runs floor to ceiling, which is what makes a 31 m² studio read as a room rather than a corridor. The renders show the finished specification: engineered oak floors, a stone kitchen wall with integrated appliances, fitted wardrobes and joinery.<br><br>Ask which of that is included in your price. Most Georgian prices are shell prices with finishing sold separately at roughly $650–900 per square metre — on a 50 m² flat that is $32,000–45,000, and it is the single most common surprise in this market.",
        "ارتفاع الأسقف <b>٣٫١ متر</b> والزجاج يمتد من الأرض إلى السقف، وهذا ما يجعل استوديو ٣١ متراً يُقرأ كغرفة لا كممر. وتُظهر الصور مواصفات التشطيب: أرضيات بلوط هندسي، وجدار مطبخ حجري بأجهزة مدمجة، وخزائن ونجارة مركّبة.<br><br>اسأل أيّها مشمول في سعرك. فمعظم الأسعار الجورجية أسعار هيكل والتشطيب يُباع منفصلاً بنحو ٦٥٠–٩٠٠ دولار للمتر — وعلى شقة ٥٠ متراً يعني ذلك ٣٢٬٠٠٠–٤٥٬٠٠٠ دولار، وهي أكثر المفاجآت شيوعاً في هذا السوق.","ჭერის სიმაღლეა <b>3.1 მეტრი</b>, მინაპაკეტები კი იატაკიდან ჭერამდე მიდის — სწორედ ამის გამო აღიქმება 31 მ² სტუდიო ოთახად და არა დერეფნად. რენდერებზე ნაჩვენებია დასრულებული სპეციფიკაცია: მუხის ინჟინერული პარკეტი, ქვის სამზარეულოს კედელი ჩაშენებული ტექნიკით, ჩამონტაჟებული გარდერობები და ავეჯი.<br><br>იკითხეთ, აქედან რა შედის თქვენს ფასში. ქართული ფასების უმეტესობა კარკასის ფასია, რემონტი კი ცალკე იყიდება, დაახლოებით $650–900 კვადრატულ მეტრზე — 50 მ² ბინაზე ეს არის $32,000–45,000 და სწორედ ეს არის ამ ბაზარზე ყველაზე გავრცელებული სიურპრიზი."]},
   {duo:["addr_living","addr_livdet"], cap:["The living space with the balcony doors open, and the joinery wall along it.","المساحة المعيشية وأبواب الشرفة مفتوحة، وجدار النجارة الممتد بمحاذاتها.","მისაღები სივრცე გაღებული აივნის კარებით და მის გასწვრივ ჩამონტაჟებული ავეჯის კედელი."]},
   {duo:["addr_bed","addr_bed2"], cap:["A bedroom on the city side, and a larger unit with a dressing area behind glass.","غرفة نوم على جهة المدينة، ووحدة أكبر بمنطقة ملابس خلف الزجاج.","საძინებელი ქალაქის მხარეს და უფრო დიდი ბინა შუშის მიღმა მოწყობილი საგარდერობე ზონით."]},
   {img:"addr_kitchen", cap:["The kitchen wall — stone, integrated hob and sink, concealed storage either side.","جدار المطبخ — حجر، وموقد ومغسلة مدمجان، وتخزين مخفي على الجانبين.","სამზარეულოს კედელი — ქვა, ჩაშენებული ქურა და ნიჟარა, ორივე მხარეს ჩამალული საცავი."]},
   {h:["What is actually built today","ما هو مبنيّ فعلاً اليوم","რა არის დღეს რეალურად აშენებული"],
    p:["These two photographs are the site, not a render. That distinction matters more than anything else on this page: a drawing shows intent, a photograph shows progress. Compare the concrete against the <b>December 2028</b> handover date and judge for yourself whether the schedule looks comfortable.<br><br>When you visit, ask to be taken to the floor your unit is on, and ask what stage the façade and the lifts are at. Those two answers tell you more about the finishing date than any brochure.",
        "هاتان الصورتان هما الموقع، لا رسماً تخيّلياً. وهذا التمييز أهم من أي شيء آخر في هذه الصفحة: فالرسم يُظهر النيّة، والصورة تُظهر التقدّم. قارن الخرسانة بموعد التسليم في <b>ديسمبر ٢٠٢٨</b> واحكم بنفسك هل يبدو الجدول مريحاً.<br><br>وحين تزور، اطلب أن تُؤخذ إلى الطابق الذي فيه وحدتك، واسأل في أي مرحلة الواجهة والمصاعد. هذان الجوابان يخبرانك عن موعد الإنجاز أكثر من أي كتيّب.","ეს ორი ფოტო ობიექტია და არა რენდერი. ეს განსხვავება ამ გვერდზე ყველაფერზე მეტად მნიშვნელოვანია: ნახაზი განზრახვას აჩვენებს, ფოტო კი პროგრესს. შეადარეთ ბეტონი ჩაბარების თარიღს — <b>2028 წლის დეკემბერს</b> — და თავად განსაჯეთ, რამდენად კომფორტულად გამოიყურება გრაფიკი.<br><br>ვიზიტისას მოითხოვეთ, რომ აგიყვანონ იმ სართულზე, სადაც თქვენი ბინაა, და იკითხეთ, რა ეტაპზეა ფასადი და ლიფტები. ეს ორი პასუხი დასრულების თარიღზე ნებისმიერ ბროშურაზე მეტს გეტყვით."]},
   {duo:["addr_site1","addr_site2"], cap:["The site photographed from the air — the structure up, the sea seven hundred metres beyond it.","الموقع مصوَّراً من الجو — الهيكل قائم، والبحر على بُعد سبعمئة متر خلفه.","ობიექტი ჰაერიდან გადაღებული — კარკასი აშენებული, ზღვა კი მისგან შვიდასი მეტრის იქით."]},
   {img:"addr_facade", cap:["The façade detail: recessed balconies, timber screens, and the yellow structural bracing that gives the building its signature.","تفصيل الواجهة: شرفات غائرة، وحواجز خشبية، والدعامات الإنشائية الصفراء التي تمنح المبنى بصمته.","ფასადის დეტალი: ჩაღრმავებული აივნები, ხის ჟალუზები და ყვითელი კონსტრუქციული გამაგრება, რომელიც შენობას თავის ამოსაცნობ იერს ანიჭებს."]}]},

{ key:"magnolia", pm:["≈$1,540","≈١٥٤٠","≈$1,540","≈1.540 $"], art:"vine", res:"below", dev:NEXT,
  name:["Magnolia","ماغنوليا","Magnolia","Magnolia"],
  loc:["New Boulevard, Batumi","البوليفارد الجديد، باتومي","ახალი ბულვარი, ბათუმი","Yeni Bulvar, Batum"],
  city:["Batumi","باتومي","ბათუმი","Batum"], ppm:"≈$1,540", sizes:"31.9–86.3 m²", from:49000,
  tags:[["Lowest entry","أقل سعر دخول","ყველაზე დაბალი ფასი","En düşük giriş"],["15 floors","١٥ طابقاً","15 სართული","15 kat"]],
  lede:["The cheapest way in: <b>from $49,000</b> near Batumi's New Boulevard, fifteen residential floors, handing over <b>December 2028</b>. It is also the one project here where <b>no unit reaches $150,000</b> — so buy it for the rent, never for the residency permit.",
        "أرخص طريقة للدخول: <b>من ٤٩٠٠٠ دولار</b> قرب البوليفارد الجديد في باتومي، خمسة عشر طابقاً سكنياً، والتسليم في <b>ديسمبر ٢٠٢٨</b>. وهو أيضاً المشروع الوحيد هنا الذي <b>لا تبلغ فيه أي وحدة ١٥٠٠٠٠ دولار</b> — فاشترِه من أجل الإيجار، لا من أجل الإقامة أبداً.","ყველაზე იაფი შესვლის გზა: <b>$49,000-დან</b> ბათუმის ახალ ბულვართან ახლოს, თხუთმეტი საცხოვრებელი სართული, ჩაბარება <b>2028 წლის დეკემბერში</b>. ეს ასევე ერთადერთი პროექტია აქ, სადაც <b>არცერთი ბინა არ აღწევს $150,000-ს</b> — ამიტომ იყიდეთ ქირისთვის და არასოდეს ბინადრობის ნებართვისთვის."],
  facts:[[["From","يبدأ من","დან","Başlangıç"],"$49,000"],[["Floors","الطوابق","სართული","Kat"],"15"],
         [["Ceilings","الارتفاع","ჭერი","Tavan"],"3.1 m"],[["Handover","التسليم","ჩაბარება","Teslim"],"Dec 2028"],
         [["Sold","مباع","გაყიდულია","Satılan"],"70%"]],
  story:[
   {h:["Honest about the ceiling","صراحة بشأن السقف","პატიოსნად ფასის ჭერის შესახებ"],
    p:["The rule on this site is that a project is a range of apartments, not one price, and most projects hold units on both sides of the $150,000 residency line. Magnolia is the exception I have to name: at roughly $1,540 per square metre, even the largest 86 m² two-bedroom lands near $133,000. <b>The whole building sits under the line.</b><br><br>That is not a reason to avoid it. It is a reason to buy it for what it is — a low-entry rental unit a few minutes from the centre, with 24/7 reception, shops, an ATM, a fitness centre, parking and commercial space downstairs. 70% of the unrenovated stock is gone; 35% of the renovated. Instalments run 31 months at 0% on a 20% first payment of $9,800–$13,700.",
        "القاعدة في هذا الموقع أن المشروع نطاق من الشقق لا سعر واحد، ومعظم المشاريع تضم وحدات على جانبي خط الـ١٥٠٠٠٠ دولار للإقامة. وماغنوليا هي الاستثناء الذي يجب أن أسمّيه: فبسعر نحو ١٥٤٠ دولاراً للمتر، حتى أكبر شقة بغرفتين بمساحة ٨٦ متراً تصل إلى نحو ١٣٣٠٠٠ دولار. <b>المبنى كله تحت الخط.</b><br><br>وليس هذا سبباً لتجنّبه، بل سبب لشرائه على ما هو عليه — وحدة إيجارية بسعر دخول منخفض على بُعد دقائق من المركز، مع استقبال على مدار الساعة، ومحال، وصرّاف آلي، وصالة رياضية، ومواقف، ومساحات تجارية في الأسفل. نفد ٧٠٪ من المعروض غير المُجهَّز، و٣٥٪ من المُجهَّز. الأقساط ٣١ شهراً بفائدة ٠٪ بدفعة أولى ٢٠٪ من ٩٨٠٠ إلى ١٣٧٠٠ دولار.","ამ საიტის წესი ისაა, რომ პროექტი ბინების დიაპაზონია და არა ერთი ფასი, და პროექტების უმეტესობას ბინები აქვს ბინადრობის $150,000-იანი ზღვრის ორივე მხარეს. Magnolia ის გამონაკლისია, რომელიც უნდა დავასახელო: დაახლოებით $1,540 კვადრატულ მეტრზე, ყველაზე დიდი, 86 მ² ორსაძინებლიანი ბინაც კი $133,000-თან ახლოს ჯდება. <b>მთელი შენობა ამ ზღვარს ქვემოთ რჩება.</b><br><br>ეს არ არის მისი თავიდან აცილების მიზეზი. ეს მიზეზია, რომ იყიდოთ ის, რაც სინამდვილეშია — დაბალი შესვლის ფასის მქონე საქირავებელი ბინა ცენტრიდან რამდენიმე წუთში, 24/7 რეცეფციით, მაღაზიებით, ბანკომატით, ფიტნეს-ცენტრით, პარკინგითა და ქვემოთ განთავსებული კომერციული ფართით. შეუკეთებელი ბინების 70% უკვე გაყიდულია; გარემონტებულის — 35%. განვადება 31 თვეა 0%-ით, 20%-იან პირველად შენატანზე, რაც $9,800–$13,700-ს შეადგენს."]},
   {h:["Where this project sits against the residency line","أين يقع هذا المشروع من خط الإقامة","სად დგას ეს პროექტი ბინადრობის ზღვართან მიმართებით"],
    p:["A statement of fact, not a verdict: at roughly $1,540 per square metre the largest unit in the building, an 86.3 m² two-bedroom, prices near $133,000. <b>No apartment in Magnolia reaches $150,000.</b><br><br>That does not make it a bad building. It makes it a rental purchase rather than a residency purchase, and anyone who sells it to you as a route to a permit is either careless or lying. If residency is what you want, look at Wyndham, Tbilisi Downtown, NEXT Downtown or Cinema City, or at the larger units in Collection, Gardens, Address and Oriental.",
        "بيان واقع لا حكم: بسعر نحو ١٥٤٠ دولاراً للمتر، فإن أكبر وحدة في المبنى، وهي شقة بغرفتين بمساحة ٨٦٫٣ متراً، تُسعَّر قرب ١٣٣٠٠٠ دولار. <b>لا شقة في ماغنوليا تبلغ ١٥٠٠٠٠ دولار.</b><br><br>وهذا لا يجعله مبنى سيئاً، بل يجعله شراءً للإيجار لا شراءً للإقامة، ومن يبيعه لك كطريق إلى التصريح فهو إما مهمل أو كاذب. فإن كانت الإقامة هي مرادك، فانظر إلى ويندهام أو تبليسي داون تاون أو نكست داون تاون أو سينما سيتي، أو إلى الوحدات الأكبر في كوليكشن وغاردنز وأدرس وأورينتال.","ფაქტის კონსტატაცია და არა განაჩენი: დაახლოებით $1,540 კვადრატულ მეტრზე, შენობაში ყველაზე დიდი ბინა — 86.3 მ² ორსაძინებლიანი — $133,000-თან ახლოს ფასდება. <b>Magnolia-ში არცერთი ბინა არ აღწევს $150,000-ს.</b><br><br>ეს მას ცუდ შენობად არ აქცევს. ეს მას ბინადრობის ნაცვლად საქირავებელ შენაძენად აქცევს, და ვინც ამას ნებართვის მიღების გზად მოგყიდით, ის ან დაუდევარია, ან იტყუება. თუ ბინადრობა გინდათ, ნახეთ Wyndham, Tbilisi Downtown, NEXT Downtown ან Cinema City, ან უფრო დიდი ბინები Collection-ში, Gardens-ში, Address-სა და Oriental-ში."]}]},

{ key:"downtown", pm:["Ask me","اسألني","მკითხეთ","Bana sorun"], art:"heritage", res:"yes", dev:NEXT,
